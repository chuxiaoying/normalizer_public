# 种子语义元数据。稳定 ID 与案例路径仍以 seeds.yaml 为权威来源。
version: 1
source: seeds.yaml

# 主题注册表是 topic 引用的权威来源。每个目录至少有一个 README.md，说明该主题的语义合同和扩展路线。
topics:
  unified-canonical-form: { path: topics/unified-canonical-form }
  expression-simplification: { path: topics/expression-simplification }
  collections: { path: topics/collections }
  control-flow: { path: topics/control-flow }
  objects-and-types: { path: topics/objects-and-types }
  state-and-aliasing: { path: topics/state-and-aliasing }
  loops-and-termination: { path: topics/loops-and-termination }
  external-boundaries: { path: topics/external-boundaries }
  relational-data: { path: topics/relational-data }
  number-domain: { path: topics/number-domain }
  language-entries: { path: topics/language-entries }
  basic-contracts: { path: topics/basic-contracts }

compositions:
  loops-and-collections: { path: compositions/loops-and-collections }
  relational-data-and-collections: { path: compositions/relational-data-and-collections }
  collections-and-expression-simplification: { path: compositions/collections-and-expression-simplification }

