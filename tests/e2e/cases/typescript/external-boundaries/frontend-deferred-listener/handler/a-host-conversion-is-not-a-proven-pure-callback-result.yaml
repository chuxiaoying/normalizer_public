entry: src/handler.ts#handle
input:
  src/handler.ts: |
    /** @N external */
    declare const audit: { registered(): void }
    /** @N external */
    declare const notices: { notify(): void }

    export function handle(deliver: boolean): void {
        let pending: (() => string) | undefined
        function listen(callback: () => string) {
            pending = callback
            audit.registered()
        }
        listen(() => { notices.notify(); return String(deliver) })
        if (deliver) pending!()
    }
reject:
  fragments:
    - "[NORM-TS-MODULE]"
    - listener callback return must be a closed pure value
