entry: src/handler.ts#handle
input:
  src/handler.ts: |
    /** @N external */
    declare const audit: { registered(): void }
    /** @N external */
    declare const notices: { notify(): void }

    export function handle(deliver: boolean): void {
        let pending: (() => string) | undefined
        const listen = (callback: () => string): void => { pending = callback; audit.registered() }
        listen(() => { notices.notify(); return "callback-only" })
        if (deliver) pending!()
    }
reject:
  fragments:
    - "[NORM-TS-MODULE]"
    - listener needs a closed synchronous entry, callback slot and registration
