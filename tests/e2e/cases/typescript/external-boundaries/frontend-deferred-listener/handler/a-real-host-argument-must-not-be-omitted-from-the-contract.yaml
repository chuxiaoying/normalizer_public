entry: src/handler.ts#handle
input:
  src/handler.ts: |
    /** @N external */
    declare const audit: { registered(sequence: number): void }
    /** @N external */
    declare const notices: { notify(): void }

    export function handle(deliver: boolean): void {
        let pending: (() => string) | undefined
        function listen(callback: () => string) {
            pending = callback
            audit.registered(1)
        }
        listen(() => { notices.notify(); return "callback-only" })
        if (deliver) pending!()
    }
reject:
  fragments:
    - "[NORM-TS-MODULE]"
    - listener requires a named required zero-argument void member
