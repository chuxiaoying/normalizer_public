entry: src/Calculator.java#Calculator.summarize
input:
  src/Calculator.java: |
    class Summary {
        int raised;
        int selected;
        int delta;

        Summary(int raised, int selected, int delta) {
            this.raised = raised;
            this.selected = selected;
            this.delta = delta;
        }
    }

    class SummaryRequest {
        int value;
        int limit;
        int fallback;
    }

    class Calculator {
        static Summary summarize(SummaryRequest request) {
            int raised = request.value + 1;
            int selected = raised > request.limit ? raised : request.fallback;
            int delta = selected - raised;
            Summary result = new Summary(raised, selected, 0);
            result.delta = delta;
            return result;
        }
    }
expected:
  schema: normalizer.pers/1
  types:
    SummaryRequest:
      fields:
        value: number
        limit: number
        fallback: number
    Summary:
      fields:
        raised: number
        selected: number
        delta: number
  entry:
    function: src/Calculator.java#Calculator.summarize
    returns: Summary
  P:
    parameters:
      request:
        position: 0
        type: SummaryRequest
  R: |-
    {
      raised: request.value + 1,
      selected: CASE
        WHEN request.limit < request.value + 1 THEN request.value + 1
        ELSE request.fallback
      END,
      delta: CASE
        WHEN request.limit < request.value + 1 THEN 0
        ELSE request.fallback - (request.value + 1)
      END
    }
