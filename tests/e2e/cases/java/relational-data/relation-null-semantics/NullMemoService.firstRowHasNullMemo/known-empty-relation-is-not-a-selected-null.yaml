            BillMemoRow[] bills;
            /* @normalizer-ir
               bills = from bill as b
                   where b.account_id == accountId and false
                   yield { id: b.id, memo: b.memo }
            */
            @N.Nullable BillMemoRow match;
            /* @normalizer-ir
               match = first from bills as row
                   order by row.id
                   yield row else null
            */
            if (match != null) return match.memo == null;
            return false;
        }
    }
