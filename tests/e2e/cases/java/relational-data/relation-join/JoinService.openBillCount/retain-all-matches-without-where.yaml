               accounts = from account as row yield { id: row.id }
            */
            BillJoinRow[] bills;
            /* @normalizer-ir
               bills = from bill as row yield { account_id: row.account_id, status: row.status }
            */
            int count;
            /* @normalizer-ir
               count = count from accounts as a
                   join bills as b on a.id == b.account_id
                    
            */
            return count;
        }
    }
