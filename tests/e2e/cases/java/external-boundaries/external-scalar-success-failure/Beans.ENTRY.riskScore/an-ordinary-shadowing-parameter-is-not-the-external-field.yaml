entry: src/RiskService.java#Beans.ENTRY.riskScore
input:
  src/RiskService.java: |
    import normalizer.intrinsics.N;

    class RiskService {
        @N.External
        private final RiskClient riskClient;

        RiskService(RiskClient riskClient) {
            this.riskClient = riskClient;
        }

        int riskScore(RiskClient riskClient, int accountId) {
            try {
                return riskClient.fetchScore(accountId);
            } catch (RiskUnavailable ignored) {
                return 0;
            }
        }
    }

    class RiskClient {
        native int fetchScore(int accountId) throws RiskUnavailable;
    }

    class RiskUnavailable extends RuntimeException {}

    class Beans {
        static final RiskService ENTRY = new RiskService(new RiskClient());
    }
reject:
  fragments:
    - "[NORM-OUT-OF-SOURCE]"
    - target=RiskClient.fetchScore
    - "[NORM-ENGINE-FAILURE]"
