entry: src/Identity.java#Identity.sameIdentity
input:
  src/Identity.java: |
    import normalizer.intrinsics.N;

    class Box {
        int value;
    }

    class Identity {
        static boolean sameValue(Box left, Box right) {
            return left.value == right.value;
        }

        static boolean sameIdentity(@N.Nullable Box prior, boolean p, boolean q) {
            Box x = new Box(); Box a = prior; if (p) { a = x; } Box b = prior; if (q) { b = x; } return a == b;
        }
    }
expected:
  schema: normalizer.pers/1
  types:
    Box:
      fields:
        value: number
  entry:
    function: src/Identity.java#Identity.sameIdentity
    returns: bool
  P:
    parameters:
      prior:
        position: 0
        type: Box?
      p:
        position: 1
        type: bool
      q:
        position: 2
        type: bool
  R: p AND q OR NOT (p) AND NOT (q)
