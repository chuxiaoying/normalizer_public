          - accountId
        returns: number
        result: $e_1
        when: completion.is_throw($e_0, RetryableScoreError)
    - call:
        external: src/ScoreService.java#ScoreService.INSTANCE.scoreClient.readPoints
        args:
          - accountId
        returns: number
        result: $e_2
        when: |-
          CASE
            WHEN completion.is_throw($e_0, RetryableScoreError) THEN completion.is_throw($e_1, RetryableScoreError)
            ELSE false
          END
    - call:
        external: src/ScoreService.java#ScoreService.INSTANCE.scoreClient.readPoints
        args:
