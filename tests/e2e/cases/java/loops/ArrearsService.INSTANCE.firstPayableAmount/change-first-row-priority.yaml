entry: src/ArrearsService.java#ArrearsService.INSTANCE.firstPayableAmount
input:
  src/ArrearsService.java: |
    class ArrearsService {
        static final ArrearsService INSTANCE = new ArrearsService();

        int firstPayableAmount(int accountId, int today) {
            BillRow[] rows;
            /* @normalizer-ir
               rows = from bill as b
                   where b.account_id == accountId and b.status == "OPEN"
                   order by b.due_date, b.priority, b.id
                   yield { id: b.id, accountId: b.account_id, dueDate: b.due_date,
                           amount: b.amount, priority: b.priority }
            */
            BillRow match;
            /* @normalizer-ir
               match = first from rows as row
                   where row.dueDate <= today and row.amount > 0
                   yield row else null
            */
            if (match != null) return match.amount;
            return 0;
        }
    }

    class BillRow {
        int id;
        int accountId;
        int dueDate;
        int amount;
        int priority;
    }
expected:
  schema: normalizer.pers/1
  entry:
    function: src/ArrearsService.java#ArrearsService.INSTANCE.firstPayableAmount
    returns: number
  P:
    parameters:
      accountId:
        position: 0
        type: number
      today:
        position: 1
        type: number
  E:
    bill:
      kind: table
      source: bill
      columns:
        id: number
        account_id: number
        due_date: number
        amount: number
        priority: number
        status: text
  R: |-
    COALESCE(
      (
        SELECT bill.amount
        FROM bill
        WHERE bill.account_id == accountId
          AND bill.due_date <= today
          AND bill.amount > 0
          AND bill.status == "OPEN"
        ORDER BY bill.due_date, bill.priority, bill.id
        LIMIT 1
      ),
      0
    )
