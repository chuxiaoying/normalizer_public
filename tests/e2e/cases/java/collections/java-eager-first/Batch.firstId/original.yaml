entry: src/Batch.java#Batch.firstId
input:
  src/Batch.java: |
    import normalizer.intrinsics.N;

    class Ticket { int id; }
    class Row { @N.Nullable Ticket ticket; }
    class Batch {
        static int firstId(Row[] rows) {
            int[] ids;
            /* @normalizer-ir
