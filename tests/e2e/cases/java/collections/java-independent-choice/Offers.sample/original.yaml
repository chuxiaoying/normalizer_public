entry: src/Offers.java#Offers.sample
input:
  src/Offers.java: |
    record Offer(String code, int price) {}
    record Pick(String firstCode, int firstPrice, String secondCode) {}
    class Offers {
        static Pick sample(Offer[] offers, Offer backup) {
            Offer first;
            /* @normalizer-ir first = choose from offers else backup */
            Offer second;
            /* @normalizer-ir second = choose from offers else backup */
            return new Pick(first.code(), first.price(), second.code());
        }
    }
expected:
  schema: normalizer.pers/1
  types:
    Offer:
      fields:
        code: text
        price: number
    Pick:
      fields:
        firstCode: text
        firstPrice: number
        secondCode: text
  entry:
    function: src/Offers.java#Offers.sample
    returns: Pick
  P:
    parameters:
      offers:
        position: 0
        type: Offer[]
      backup:
        position: 1
        type: Offer
  T:
    - id: $t_0
      op: member_choice
      when: "true"
      members: offers
      empty: backup
    - id: $t_1
      op: member_choice
      when: "true"
      members: offers
      empty: backup
  R: |-
    {
      firstCode: $t_0.code,
      firstPrice: $t_0.price,
      secondCode: $t_1.code
    }
