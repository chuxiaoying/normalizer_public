entry: src/Calculator.java#Calculator.summarize
expected:
  schema: normalizer.pers/1
  types:
    SummaryRequest:
      fields:
        value: number
        limit: number
        fallback: number
    Summary:
      fields:
        raised: number
        selected: number
        delta: number
  entry:
    function: src/Calculator.java#Calculator.summarize
    returns: Summary
  P:
    parameters:
      request:
        position: 0
        type: SummaryRequest
  R: |-
    {
      raised: 1 + request.value,
      selected: CASE
        WHEN request.limit > 1 + request.value THEN request.fallback
        ELSE 1 + request.value
      END,
      delta: CASE
        WHEN request.limit > 1 + request.value THEN request.fallback - (1 + request.value)
        ELSE 0
      END
    }
