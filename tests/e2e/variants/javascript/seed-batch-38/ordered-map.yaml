- name: inverse-with-swapped-branches-keeps-the-same-map
  edits:
    - from: "b === null ? [] : [['b', b]]"
      to: "b !== null ? [['b', b]] : []"
- name: testing-a-different-value-cannot-authorize-an-insert
  edits:
    - from: "b === null ? [] : [['b', b]]"
      to: "c === null ? [] : [['b', b]]"
  reject: ['readonly Map requires each null guard to protect the inserted value']
- name: duplicate-keys-are-not-ordered-unique-inserts
  edits:
    - from: "[['b', b]]"
      to: "[['a', b]]"
  reject: ['readonly Map requires unique literal keys']
- name: empty-map-is-a-concrete-constant
  edits:
    - from: |-
        ...(a === null ? [] : [['a', a]]),
            ...(b === null ? [] : [['b', b]]),
            ...(c === null ? [] : [['c', c]]),
      to: ''
  expect:
    - path: [R]
      value: 'MAP([])'
- name: moving-insertions-changes-map-iteration-order
  edits:
    - from: |-
        ...(a === null ? [] : [['a', a]]),
            ...(b === null ? [] : [['b', b]]),
            ...(c === null ? [] : [['c', c]]),
      to: |-
        ...(b === null ? [] : [['10', b]]),
            ...(a === null ? [] : [['2', a]]),
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN a == null AND b == null THEN MAP([])
          WHEN a == null THEN MAP([["10", b]])
          WHEN b == null THEN MAP([["2", a]])
          ELSE MAP([["10", b], ["2", a]])
        END
- name: map-constructor-shadowing-invalidates-purity-proof
  edits:
    - from: '/**'
      to: |-
        function Map(rows) { return rows; }
        /**
  reject: ['readonly Map requires an unshadowed built-in Map']
- name: refuses-unbounded-expansion-instead-of-nested-map-output
  edits:
    - from: "...(c === null ? [] : [['c', c]]),"
      to: |-
        ...(c === null ? [] : [['c', c]]), ...(c === null ? [] : [['d', c]]),
        ...(c === null ? [] : [['e', c]]), ...(c === null ? [] : [['f', c]]),
        ...(c === null ? [] : [['g', c]]), ...(c === null ? [] : [['h', c]]),
  reject: ['readonly Map CASE lift exceeds its expansion budget']
- name: parameter-named-map-invalidates-purity-proof
  edits:
    - from: ' * @param {string|null} c'
      to: |-
         * @param {string|null} c
         * @param {string|null} Map
    - from: 'labels(a, b, c)'
      to: 'labels(a, b, c, Map)'
  reject: ['readonly Map requires an unshadowed built-in Map']
- name: shared-null-guard-does-not-publish-impossible-maps
  edits:
    - from: "b === null ? [] : [['b', b]]"
      to: "a === null ? [] : [['b', a]]"
    - from: "c === null ? [] : [['c', c]]"
      to: "a === null ? [] : [['c', a]]"
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN a == null THEN MAP([])
          ELSE MAP([["a", a], ["b", a], ["c", a]])
        END
