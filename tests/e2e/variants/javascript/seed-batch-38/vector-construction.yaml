- name: explicit-outer-case-and-direct-construction-agree
  edits:
    - from: '[enabled ? left : right, fixed]'
      to: 'enabled ? [left, fixed] : [right, fixed]'
- name: vector-slot-order-is-not-commutative
  edits:
    - from: '[enabled ? left : right, fixed]'
      to: '[fixed, enabled ? left : right]'
  expect:
    - path: [R]
      value: 'CASE WHEN enabled THEN [fixed, left] ELSE [fixed, right] END'
- name: sparse-vector-is-not-a-closed-element-list
  edits:
    - from: '[enabled ? left : right, fixed]'
      to: '[enabled ? left : right,, fixed]'
  reject:
    - readonly Vector literal requires a closed list of numbers
- name: matching-guards-do-not-create-unreachable-constructions
  edits:
    - from: '[enabled ? left : right, fixed]'
      to: '[enabled ? left : right, enabled ? fixed : right]'
  expect:
    - path: [R]
      value: 'CASE WHEN enabled THEN [left, fixed] ELSE [right, right] END'
- name: an-untyped-element-is-not-certified-by-the-array-literal
  edits:
    - from: '[enabled ? left : right, fixed]'
      to: '[enabled ? left : right, null]'
  reject:
    - unsupported standalone scalar operation literal
- name: full-case-expansion-reports-its-budget
  edits:
    - from: " * @returns {ReadonlyArray<number>}"
      to: |-
         * @param {boolean} gate0
         * @param {boolean} gate1
         * @param {boolean} gate2
         * @param {boolean} gate3
         * @param {boolean} gate4
         * @param {boolean} gate5
         * @param {boolean} gate6
         * @param {boolean} gate7
         * @returns {ReadonlyArray<number>}
    - from: pair(enabled, left, right, fixed)
      to: pair(enabled, left, right, fixed, gate0, gate1, gate2, gate3, gate4, gate5, gate6, gate7)
    - from: '[enabled ? left : right, fixed]'
      to: '[gate0 ? 1 : 0, gate1 ? 1 : 0, gate2 ? 1 : 0, gate3 ? 1 : 0, gate4 ? 1 : 0, gate5 ? 1 : 0, gate6 ? 1 : 0, gate7 ? 1 : 0]'
  reject:
    - readonly Vector CASE lift exceeds its expansion budget
