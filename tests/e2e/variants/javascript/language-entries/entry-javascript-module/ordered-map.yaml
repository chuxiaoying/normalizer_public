- name: inverse-with-swapped-branches-keeps-the-same-map
  edits:
  - from: 'b === null ? [] : [[''b'', b]]'
    to: 'b !== null ? [[''b'', b]] : []'
- name: testing-a-different-value-cannot-authorize-an-insert
  edits:
  - from: 'b === null ? [] : [[''b'', b]]'
    to: 'c === null ? [] : [[''b'', b]]'
  reject:
  - '[NORM-JS-MODULE]'
  - readonly Map requires each null guard to protect the inserted value
- name: duplicate-keys-are-not-ordered-unique-inserts
  edits:
  - from: '[[''b'', b]]'
    to: '[[''a'', b]]'
  reject:
  - '[NORM-JS-MODULE]'
  - readonly Map requires unique literal keys
- name: empty-map-is-a-concrete-constant
  edits:
  - from: "...(a === null ? [] : [['a', a]]),\n    ...(b === null ? [] : [['b', b]]),\n    ...(c === null ? [] : [['c', c]]),"
    to: ''
  expect:
  - path:
    - R
    value: MAP([])
- name: moving-insertions-changes-map-iteration-order
  edits:
  - from: "...(a === null ? [] : [['a', a]]),\n    ...(b === null ? [] : [['b', b]]),\n    ...(c === null ? [] : [['c', c]]),"
    to: "...(b === null ? [] : [['10', b]]),\n    ...(a === null ? [] : [['2', a]]),"
  expect:
  - path:
    - R
    value: "CASE\n  WHEN a == null AND b == null THEN MAP([])\n  WHEN a == null THEN MAP([[\"10\", b]])\n  WHEN b == null THEN MAP([[\"\
      2\", a]])\n  ELSE MAP([[\"10\", b], [\"2\", a]])\nEND"
- name: map-constructor-shadowing-invalidates-purity-proof
  edits:
  - from: /**
    to: 'function Map(rows) { return rows; }

      /**'
  reject:
  - '[NORM-JS-MODULE]'
  - readonly Map requires an unshadowed built-in Map
- name: refuses-unbounded-expansion-instead-of-nested-map-output
  edits:
  - from: '...(c === null ? [] : [[''c'', c]]),'
    to: '...(c === null ? [] : [[''c'', c]]), ...(c === null ? [] : [[''d'', c]]),

      ...(c === null ? [] : [[''e'', c]]), ...(c === null ? [] : [[''f'', c]]),

      ...(c === null ? [] : [[''g'', c]]), ...(c === null ? [] : [[''h'', c]]),'
  reject:
  - '[NORM-PROJECT]'
  - readonly Map CASE lift exceeds its expansion budget
- name: parameter-named-map-invalidates-purity-proof
  edits:
  - from: ' * @param {string|null} c'
    to: '* @param {string|null} c

      * @param {string|null} Map'
  - from: labels(a, b, c)
    to: labels(a, b, c, Map)
  reject:
  - '[NORM-JS-MODULE]'
  - readonly Map requires an unshadowed built-in Map
- name: shared-null-guard-does-not-publish-impossible-maps
  edits:
  - from: 'b === null ? [] : [[''b'', b]]'
    to: 'a === null ? [] : [[''b'', a]]'
  - from: 'c === null ? [] : [[''c'', c]]'
    to: 'a === null ? [] : [[''c'', a]]'
  expect:
  - path:
    - R
    value: "CASE\n  WHEN a == null THEN MAP([])\n  ELSE MAP([[\"a\", a], [\"b\", a], [\"c\", a]])\nEND"

- name: an-array-result-is-not-a-built-in-ordered-map
  edits:
  - from: 'return new Map(['
    to: 'return Object.freeze(['
  reject: ['[NORM-JS-MODULE]', 'readonly Map requires one built-in Map construction with literal entry assembly']

- name: unconditionally-inserting-a-nullable-value-is-not-a-null-guard
  edits:
  - from: '...(b === null ? [] : [[''b'', b]]),'
    to: '[''b'', b],'
  reject: ['[NORM-JS-MODULE]', 'readonly Map requires explicitly null-guarded literal text entries']

- name: a-text-literal-is-not-the-input-protected-by-the-null-guard
  edits:
  - from: 'b === null ? [] : [[''b'', b]]'
    to: 'b === null ? [] : [[''b'', ''b'']]'
  reject: ['[NORM-JS-MODULE]', 'readonly Map requires each null guard to protect the inserted value']
