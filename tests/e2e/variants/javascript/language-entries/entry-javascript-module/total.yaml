- name: add-offset
  edits: [{ from: 'value + base', to: 'value + base + 1' }]
  expect: [{ path: [R], value: base + value + 1 }]
- name: module-reverse-addition-operands
  edits: [{ from: 'value + base', to: 'base + value' }]
- name: module-left-associated-sum
  edits: [{ from: 'value + base', to: '(value + 2) + base' }]
  expect: [{ path: [R], value: base + value + 2 }]
- name: module-right-associated-sum
  edits: [{ from: 'value + base', to: '2 + (base + value)' }]
  expect: [{ path: [R], value: base + value + 2 }]
- name: the-selected-module-entry-must-be-exported
  edits: [{ from: 'export function total', to: 'function total' }]
  reject: ['[NORM-JS-MODULE]', 'expected one defined exported function: total']
- name: a-defaulted-formal-is-not-a-required-business-input
  edits: [{ from: 'total(value, base)', to: 'total(value = 7, base)' }]
  reject: ['[NORM-JS-MODULE]', 'expected named required parameters']
- name: boolean-plus-number-is-not-business-number-addition
  edits: [{ from: '{number} value', to: '{boolean} value' }]
  reject: ['[NORM-JS-MODULE]', 'scalar arithmetic and comparison require two business numbers']
