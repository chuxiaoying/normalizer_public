reject: ['[NORM-OUT-OF-SOURCE]', 'kind=ABORT', '[NORM-ENGINE-FAILURE]', 'total', 'source.read', 'unsupported']
variants:
  - name: add-offset-does-not-close-read
    edits: [{ from: 'value + 1', to: 'value + 2' }]
  - name: argument-named-ports-is-not-external
    edits:
      - { from: 'total(source)', to: 'total(ports)' }
      - { from: 'await source.read()', to: 'await ports.read()' }
      - { from: '}} source @returns', to: '}} ports @returns' }
    reject: ['[NORM-OUT-OF-SOURCE]', 'kind=ABORT', '[NORM-ENGINE-FAILURE]', 'total', 'ports.read']
  - name: optional-call-is-not-a-definite-call
    edits: [{ from: 'await source.read()', to: 'await source?.read()' }]
    reject: ['[NORM-JS-MODULE]', 'async entry requires a closed completion contract']
  - name: a-mutable-prefix-binding-does-not-prove-closed-completion
    edits: [{ from: 'const value = await source.read();', to: 'let value = await source.read();' }]
    reject: ['[NORM-JS-MODULE]', 'async entry requires a closed completion contract']
  - name: destructuring-the-awaited-value-does-not-prove-closed-completion
    edits:
      - { from: 'const value = await source.read();', to: 'const { value } = await source.read();' }
    reject: ['[NORM-JS-MODULE]', 'async entry requires a closed completion contract']
  - name: a-direct-synchronous-call-still-needs-source-or-an-external-contract
    edits:
      - { from: 'export async function', to: 'export function' }
      - { from: 'await source.read()', to: 'source.read()' }
      - { from: '{ read: () => Promise<number> }', to: '{ read: () => number }' }
      - { from: '@returns {Promise<number>}', to: '@returns {number}' }
    reject: ['[NORM-OUT-OF-SOURCE]', 'kind=ABORT', '[NORM-ENGINE-FAILURE]', '#total:call', 'source.read']
  - name: legal-javascript-dollar-spelling-does-not-invent-an-external-boundary
    edits:
      - { from: 'total(source)', to: 'total($source)' }
      - { from: 'await source.read()', to: 'await $source.$read()' }
      - { from: '}} source @returns', to: '}} $source @returns' }
      - { from: 'read: ()', to: '$read: ()' }
    reject: ['[NORM-OUT-OF-SOURCE]', 'kind=ABORT', '[NORM-ENGINE-FAILURE]', '$source.$read']
