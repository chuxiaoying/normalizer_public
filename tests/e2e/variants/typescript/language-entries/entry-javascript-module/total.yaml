- name: add-offset
  edits:
  - from: value + base
    to: value + base + 1
  expect:
  - path:
    - R
    value: base + value + 1
- name: module-reverse-addition-operands
  edits:
  - from: value + base
    to: base + value
- name: module-left-associated-sum
  edits:
  - from: value + base
    to: (value + 2) + base
  expect:
  - path:
    - R
    value: base + value + 2
- name: module-right-associated-sum
  edits:
  - from: value + base
    to: 2 + (base + value)
  expect:
  - path:
    - R
    value: base + value + 2
- name: the-selected-module-entry-must-be-exported
  edits:
  - from: export function total
    to: function total
  reject:
  - '[NORM-TS-MODULE]'
  - 'expected one defined exported function: total'
- name: a-defaulted-formal-is-not-a-required-business-input
  edits:
  - from: 'total(value: number, base: number)'
    to: 'total(value: number = 7, base: number)'
  reject:
  - '[NORM-TS-MODULE]'
  - expected named required parameters
- name: boolean-plus-number-is-not-business-number-addition
  edits:
  - from: 'value: number'
    to: 'value: boolean'
  reject:
  - '[NORM-TS-MODULE]'
  - scalar arithmetic and comparison require two business numbers

- name: erased-type-declarations-do-not-create-business-values
  edits:
    - from: 'export function total'
      to: |-
        type AccountAmount = number;
        interface AuditShape { amount: AccountAmount }
        export function total

- name: explicit-any-in-an-unused-function-rejects-the-module
  edits:
    - from: 'export function total'
      to: |-
        function unused(input: any) { return input; }
        export function total
  reject: ['[NORM-TS-MODULE]', 'explicit any is not an admitted analysis type']
- name: implicit-any-in-an-unused-function-rejects-the-module
  edits:
    - from: 'export function total'
      to: |-
        function unused(input) { return input; }
        export function total
  reject: ['[NORM-TS-MODULE]', "implicitly has an 'any' type"]
- name: an-inferred-library-any-does-not-acquire-a-business-domain
  edits:
    - from: 'export function total'
      to: |-
        function unused() { return JSON.parse('{}'); }
        export function total
  reject: ['[NORM-TS-MODULE]', 'resolved any is not an admitted analysis type']
- name: a-type-suppression-cannot-bypass-module-admission
  edits:
    - from: 'export function total'
      to: |-
        // @ts-nocheck
        export function total
  reject: ['[NORM-TS-MODULE]', 'cannot disable or suppress the strict preflight']
