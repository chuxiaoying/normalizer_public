- name: explicit-outer-case-and-direct-construction-agree
  edits:
  - from: '[enabled ? left : right, fixed]'
    to: 'enabled ? [left, fixed] : [right, fixed]'
- name: vector-slot-order-is-not-commutative
  edits:
  - from: '[enabled ? left : right, fixed]'
    to: '[fixed, enabled ? left : right]'
  expect:
  - path:
    - R
    value: '[fixed, (CASE WHEN enabled THEN left ELSE right END)]'
- name: sparse-vector-is-not-a-closed-element-list
  edits:
  - from: '[enabled ? left : right, fixed]'
    to: '[enabled ? left : right,, fixed]'
  reject:
  - '[NORM-TS-MODULE]'
  - readonly Vector literal requires a closed list of numbers
- name: matching-guards-do-not-create-unreachable-constructions
  edits:
  - from: '[enabled ? left : right, fixed]'
    to: '[enabled ? left : right, enabled ? fixed : right]'
  expect:
  - path:
    - R
    value: CASE WHEN enabled THEN [left, fixed] ELSE [right, right] END
- name: an-untyped-element-is-not-certified-by-the-array-literal
  edits:
  - from: '[enabled ? left : right, fixed]'
    to: '[enabled ? left : right, null]'
  reject:
  - '[NORM-TS-MODULE]'
  - unsupported standalone scalar operation literal
- name: independent-pure-slots-do-not-force-case-expansion
  edits:
  - from: 'pair(enabled: boolean, left: number, right: number, fixed: number)'
    to: 'pair(enabled: boolean, left: number, right: number, fixed: number, gate0: boolean, gate1:
      boolean, gate2: boolean, gate3: boolean, gate4: boolean, gate5: boolean, gate6: boolean, gate7:
      boolean)'
  - from: '[enabled ? left : right, fixed]'
    to: '[gate0 ? 1 : 0, gate1 ? 1 : 0, gate2 ? 1 : 0, gate3 ? 1 : 0, gate4 ? 1 : 0, gate5 ? 1 : 0,
      gate6 ? 1 : 0, gate7 ? 1 : 0]'
  expect:
  - path:
    - P
    - parameters
    - gate0
    add:
      position: 4
      type: bool
  - path:
    - P
    - parameters
    - gate1
    add:
      position: 5
      type: bool
  - path:
    - P
    - parameters
    - gate2
    add:
      position: 6
      type: bool
  - path:
    - P
    - parameters
    - gate3
    add:
      position: 7
      type: bool
  - path:
    - P
    - parameters
    - gate4
    add:
      position: 8
      type: bool
  - path:
    - P
    - parameters
    - gate5
    add:
      position: 9
      type: bool
  - path:
    - P
    - parameters
    - gate6
    add:
      position: 10
      type: bool
  - path:
    - P
    - parameters
    - gate7
    add:
      position: 11
      type: bool
  - path:
    - R
    value: '[(CASE WHEN gate0 THEN 1 ELSE 0 END), (CASE WHEN gate1 THEN 1 ELSE 0 END), (CASE WHEN
      gate2 THEN 1 ELSE 0 END), (CASE WHEN gate3 THEN 1 ELSE 0 END), (CASE WHEN gate4 THEN 1 ELSE
      0 END), (CASE WHEN gate5 THEN 1 ELSE 0 END), (CASE WHEN gate6 THEN 1 ELSE 0 END), (CASE WHEN
      gate7 THEN 1 ELSE 0 END)]'
- name: different-branch-lengths-keep-the-whole-vector-selection
  edits:
  - from: '[enabled ? left : right, fixed]'
    to: 'enabled ? [left, fixed] : [right]'
  expect:
  - path: [R]
    value: CASE WHEN enabled THEN [left, fixed] ELSE [right] END
