- name: a-false-branch-does-not-dispatch-the-registered-callback
  edits:
  - from: if (deliver) pending!()
    to: if (false) pending!()
  expect:
  - path:
    - S
    value:
    - call:
        external: audit.registered
        args: []
        returns: void
        result: $e_0
- name: a-true-branch-dispatches-after-registration-without-a-guard
  edits:
  - from: if (deliver) pending!()
    to: if (true) pending!()
  expect:
  - path:
    - S
    value:
    - call:
        external: audit.registered
        args: []
        returns: void
        result: $e_0
    - call:
        external: notices.notify
        args: []
        returns: void
        result: $e_1
- name: an-actual-invocation-during-registration-is-not-deferred
  edits:
  - from: audit.registered()
    to: callback(); audit.registered()
  expect:
  - path:
    - S
    value:
    - call:
        external: notices.notify
        args: []
        returns: void
        result: $e_0
    - call:
        external: audit.registered
        args: []
        returns: void
        result: $e_1
    - call:
        external: notices.notify
        args: []
        returns: void
        result: $e_2
        when: deliver
- name: two-dispatches-have-distinct-receipts-even-on-the-same-guard
  edits:
  - from: if (deliver) pending!()
    to: if (deliver) { pending!(); pending!() }
  expect:
  - path:
    - S
    value:
    - call:
        external: audit.registered
        args: []
        returns: void
        result: $e_0
    - call:
        external: notices.notify
        args: []
        returns: void
        result: $e_1
        when: deliver
    - call:
        external: notices.notify
        args: []
        returns: void
        result: $e_2
        when: deliver
- name: no-marked-external-for-a-reached-notification-panics
  edits:
  - from: '/** @external */

      declare const notices'
    to: declare const notices
  reject:
  - '[NORM-OUT-OF-SOURCE]'
  - target=notices.notify
  - '[NORM-ENGINE-FAILURE]'
- name: no-source-in-a-proven-dead-branch-is-not-encountered
  edits:
  - from: '/** @external */

      declare const notices'
    to: declare const notices
  - from: if (deliver) pending!()
    to: if (false) pending!()
  expect:
  - path:
    - S
    value:
    - call:
        external: audit.registered
        args: []
        returns: void
        result: $e_0
- name: writing-the-local-slot-alone-is-not-an-external-operation
  edits:
  - from: audit.registered()
    to: ''
  - from: if (deliver) pending!()
    to: ''
  expect:
  - path:
    - S
    absent: true
- name: no-local-slot-assignment-is-not-a-registered-callback
  edits:
  - from: pending = callback
    to: ''
  reject:
  - '[NORM-TS-MODULE]'
  - listener callback is not registered in the local slot
- name: callback-result-does-not-become-the-void-entry-result
  edits:
  - from: '"callback-only"'
    to: '"another-local-result"'
- name: a-declared-throw-contract-is-not-assumed-to-complete-normally
  edits:
  - from: '/** @external */

      declare const notices'
    to: "/**\n * @external\n * @throws {Error}\n */\ndeclare const notices"
  reject:
  - '[NORM-TS-MODULE]'
  - unsupported listener host contract tag
- name: negated-boolean-inverts-only-the-dispatch-domain
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (!deliver) pending!()' }
  expect:
    - { path: [S, 1, call, when], value: 'NOT (deliver)' }
- name: repeated-negation-restores-the-original-dispatch
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (!!deliver) pending!()' }
- name: a-negated-true-guard-keeps-registration-but-skips-dispatch
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (!true) pending!()' }
  expect:
    - path: [S]
      value:
        - call: { external: audit.registered, args: [], returns: void, result: $e_0 }
- name: complementary-dispatch-sites-keep-distinct-guarded-receipts
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (deliver) pending!(); if (!deliver) pending!()' }
  expect:
    - path: [S]
      value:
        - call: { external: audit.registered, args: [], returns: void, result: $e_0 }
        - call: { external: notices.notify, args: [], returns: void, result: $e_1, when: deliver }
        - call: { external: notices.notify, args: [], returns: void, result: $e_2, when: 'NOT (deliver)' }
- name: negated-nonzero-literal-is-false-before-ir
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (!1) pending!()' }
  expect:
    - path: [S]
      value:
        - call: { external: audit.registered, args: [], returns: void, result: $e_0 }
- name: negated-zero-literal-is-true-before-ir
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (!0) pending!()' }
  expect:
    - path: [S]
      value:
        - call: { external: audit.registered, args: [], returns: void, result: $e_0 }
        - call: { external: notices.notify, args: [], returns: void, result: $e_1 }
- name: negated-signed-nonzero-literal-is-false-before-ir
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (!(-1)) pending!()' }
  expect:
    - path: [S]
      value:
        - call: { external: audit.registered, args: [], returns: void, result: $e_0 }
- name: negated-hex-zero-literal-is-true-before-ir
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (!0x0) pending!()' }
  expect:
    - path: [S]
      value:
        - call: { external: audit.registered, args: [], returns: void, result: $e_0 }
        - call: { external: notices.notify, args: [], returns: void, result: $e_1 }
- name: negated-decimal-zero-literal-is-true-before-ir
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (!0.00) pending!()' }
  expect:
    - path: [S]
      value:
        - call: { external: audit.registered, args: [], returns: void, result: $e_0 }
        - call: { external: notices.notify, args: [], returns: void, result: $e_1 }
- name: positive-numeric-guard-is-true-with-no-js-rule-in-ir
  edits:
    - { from: 'if (deliver) pending!()', to: 'if (1) pending!()' }
  expect:
    - path: [S]
      value:
        - call: { external: audit.registered, args: [], returns: void, result: $e_0 }
        - call: { external: notices.notify, args: [], returns: void, result: $e_1 }

- name: lexical-callback-captures-host-despite-registrar-parameter
  edits:
  - from: function listen(callback
    to: function listen(notices
  - from: pending = callback
    to: pending = notices

- name: lexical-callback-captures-host-on-immediate-and-deferred-invocation
  edits:
  - from: function listen(callback
    to: function listen(notices
  - from: pending = callback
    to: pending = notices
  - from: audit.registered()
    to: notices(); audit.registered()
  expect:
  - path: [S]
    value:
    - call: { external: notices.notify, args: [], returns: void, result: $e_0 }
    - call: { external: audit.registered, args: [], returns: void, result: $e_1 }
    - call: { external: notices.notify, args: [], returns: void, result: $e_2, when: deliver }

- name: lexical-registrar-receiver-is-really-shadowed
  edits:
  - from: '{ notify(): void }'
    to: '{ notify(): void; toString(): void }'
  - from: function listen(callback
    to: function listen(notices
  - from: pending = callback
    to: pending = notices
  - from: audit.registered()
    to: notices.toString(); audit.registered()
  reject: ['[NORM-TS-MODULE]', 'local name shadows declared listener host']

- name: lexical-entry-receiver-is-really-shadowed
  edits:
  - from: '{ notify(): void }'
    to: '{ notify(): void; toString(): void }'
  - from: handle(deliver
    to: handle(notices
  - from: if (deliver) pending!()
    to: if (notices) pending!()
  - from: notices.notify()
    to: notices.toString()
  reject: ['[NORM-TS-MODULE]', 'local name shadows declared listener host']

- name: lexical-registrar-slot-shadow-does-not-register-the-entry-callback
  edits:
  - from: function listen(callback
    to: function listen(pending
  - from: pending = callback
    to: pending = pending
  reject: ['[NORM-TS-MODULE]', 'listener registration must write the entry callback slot from its callback parameter']
