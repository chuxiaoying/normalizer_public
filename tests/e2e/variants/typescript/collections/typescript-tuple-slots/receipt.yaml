- name: rest-count-excludes-the-two-fixed-slots
  edits:
  - from: '"sent", "ack"'
    to: '"sent", "ack", "settled"'
  expect:
  - path:
    - R
    value: "CASE\n  WHEN detailed AND NOT (failed) THEN 3\n  ELSE 0\nEND"
- name: a-present-but-unsuccessful-reply-does-not-count-its-traces
  edits:
  - from: '{ ok: true }, "sent"'
    to: '{ ok: false }, "sent"'
  expect:
  - path:
    - R
    value: '0'
- name: optional-slot-with-explicit-undefined-is-not-a-success
  edits:
  - from: '{ ok: true }, "sent"'
    to: undefined, "sent"
  expect:
  - path:
    - R
    value: '0'
- name: omitted-optional-reply-is-not-shifted-into-the-first-slot
  edits:
  - from: return ["offline"]
    to: return [undefined]
- name: required-first-slot-cannot-be-removed-by-shifting-the-array
  edits:
  - from: '[undefined, { ok: true }, "sent", "ack"]'
    to: '[{ ok: true }, "sent", "ack"]'
  reject:
  - '[NORM-TS-MODULE]'
  - is not assignable to type 'string'
- name: text-that-says-undefined-is-not-the-undefined-value
  edits:
  - from: '[undefined, { ok: true }, "sent", "ack"]'
    to: '["undefined", { ok: true }, "sent", "ack"]'
  expect:
  - path:
    - R
    value: '0'
- name: missing-optional-boolean-field-does-not-count-rest
  edits:
  - from: 'ok: boolean'
    to: 'ok?: boolean'
  - from: '{ ok: true }, "sent"'
    to: '{}, "sent"'
  expect:
  - path:
    - R
    value: '0'
- name: truthiness-of-a-string-length-is-not-an-optional-boolean-flag
  edits:
  - from: error === undefined && result?.ok
    to: error?.length
  reject:
  - '[NORM-TS-MODULE]'
  - optional tuple condition must be a Boolean flag
- name: type-only-import-is-not-opened-by-the-closed-module-typecheck
  edits:
  - from: type Reply =
    to: type Indirect = import("./missing").Indirect; type Reply =
  reject:
  - '[NORM-TS-MODULE]'
  - typed module cannot import outside declarations
- name: a-reserved-local-directive-is-never-silently-ignored
  edits:
  - from: if (failed) return
    to: /* @normalizer-ir retained = 2 */ if (failed) return
  reject:
  - 'SCENARIO_MODULE_INPUT:'
  - '@normalizer-ir'

- name: constant-guard-true-no-else
  edits:
  - from: |-
      if (failed) return ["offline"]
          if (detailed) return [undefined, { ok: true }, "sent", "ack"]
          return [undefined, { ok: true }]
    to: |-
      if (true) return [undefined, { ok: true }, "sent", "ack"]
  expect:
  - path: [R]
    value: '2'

- name: constant-guard-false-else
  edits:
  - from: |-
      if (failed) return ["offline"]
          if (detailed) return [undefined, { ok: true }, "sent", "ack"]
          return [undefined, { ok: true }]
    to: |-
      if (false) return ["offline"]
          else return [undefined, { ok: true }, "sent"]
  expect:
  - path: [R]
    value: '1'

- name: constant-guard-nested-returns
  edits:
  - from: |-
      if (failed) return ["offline"]
          if (detailed) return [undefined, { ok: true }, "sent", "ack"]
          return [undefined, { ok: true }]
    to: |-
      if (!!true) {
              if (!true) return ["offline"]
              else return [undefined, { ok: true }, "sent", "ack"]
          }
          return ["offline"]
  expect:
  - path: [R]
    value: '2'

- name: constant-guard-false-preserves-symbolic-following-conditions
  edits:
  - from: |-
      if (failed) return ["offline"]
          if (detailed) return [undefined, { ok: true }, "sent", "ack"]
          return [undefined, { ok: true }]
    to: |-
      if (false) return ["offline"]
          if (failed) return ["offline"]
          if (detailed) return [undefined, { ok: true }, "sent", "ack"]
          return [undefined, { ok: true }]

- name: constant-guard-does-not-skip-source-type-check
  edits:
  - from: |-
      if (failed) return ["offline"]
          if (detailed) return [undefined, { ok: true }, "sent", "ack"]
          return [undefined, { ok: true }]
    to: |-
      if (false) return [42]
          return [undefined, { ok: true }, "sent"]
  reject:
  - '[NORM-TS-MODULE]'
  - is not assignable to type 'string'

- name: constant-call-arguments-specialize-only-the-helper
  edits:
  - from: 'const [error, result, ...trace] = receipt(failed, detailed)'
    to: 'const [error, result, ...trace] = receipt(false, true)'
  expect:
  - path: [R]
    value: '2'

- name: constant-true-empty-arm-continues-to-the-symbolic-tail
  edits:
  - from: 'if (failed) return ["offline"]'
    to: |-
      if (true) {}
          if (failed) return ["offline"]

- name: nested-selected-empty-else-continues-to-the-symbolic-tail
  edits:
  - from: 'if (failed) return ["offline"]'
    to: |-
      if (true) {
              if (false) return ["offline"]
              else {}
          }
          if (failed) return ["offline"]

- name: a-number-slot-does-not-stand-in-for-the-error-text
  edits:
  - from: 'error: string | undefined'
    to: 'error: number | undefined'
  - from: 'return ["offline"]'
    to: 'return [7]'
  reject: ['[NORM-TS-MODULE]', 'tuple requires literal slots or distinct constant Boolean record fields']

- name: receipt-record-fields-cannot-publish-nonboolean-payload
  edits:
  - from: 'type Reply = { ok: boolean }'
    to: 'type Reply = { ok: boolean; diagnostic?: string }'
  - from: '{ ok: true }, "sent", "ack"'
    to: '{ ok: true, diagnostic: "sent" }, "sent", "ack"'
  reject: ['[NORM-TS-MODULE]', 'tuple requires literal slots or distinct constant Boolean record fields']
