- name: boolean-field-projects-from-the-same-declared-receipt
  edits:
    - { from: 'String label(int id)', to: 'boolean label(int id)' }
    - { from: 'return packet.label;', to: 'return packet.approved;' }
  expect:
    - { path: [entry, returns], value: bool }
    - { path: [R], value: '$e_0.approved' }
- name: an-unused-declaration-does-not-acquire-a-receipt
  edits:
    - from: |-
        Packet packet = port.lookup(id);
                return packet.label;
      to: 'return "offline";'
  expect:
    - { path: [S], absent: true }
    - { path: [types], absent: true }
    - { path: [R], value: '"offline"' }
- name: missing-port-interface-cannot-supply-a-boundary-signature
  edits:
    - { from: 'interface Records {', to: 'interface OtherRecords {' }
  reject: ['[NORM-EXTERNAL-TYPE]', 'kind=PREPROCESS_REQUIRED', 'location=Records']
- name: a-source-class-is-not-an-external-interface-contract
  edits:
    - { from: 'interface Records { Packet lookup(int id); }', to: 'class Records { Packet lookup(int id) { return null; } }' }
  reject: ['[NORM-EXTERNAL-TYPE]', 'kind=PREPROCESS_REQUIRED', 'location=Records']
- name: mutable-injected-field-is-not-a-fixed-external-port
  edits:
    - { from: 'private final Records port;', to: 'private Records port;' }
  reject: ['[NORM-EXTERNAL-FIELD]', 'kind=PREPROCESS_REQUIRED', 'location=port']
- name: static-external-field-is-not-an-injected-instance-port
  edits:
    - { from: 'private final Records port;', to: 'private static final Records port = null;' }
    - { from: 'this.port = port;', to: '' }
  reject: ['[NORM-EXTERNAL-FIELD]', 'kind=PREPROCESS_REQUIRED', 'location=port']
- name: instance-port-initialized-locally-is-not-an-injected-external-port
  edits:
    - { from: 'private final Records port;', to: 'private final Records port = null;' }
    - { from: 'this.port = port;', to: '' }
  reject: ['[NORM-EXTERNAL-FIELD]', 'kind=PREPROCESS_REQUIRED', 'location=port']
