        external: src/NumberService.java#Beans.ENTRY.issuer.issue
        args: []
        returns: number
        result: $e_0
    - call:
        external: src/NumberService.java#Beans.ENTRY.issuer.issue
        args: []
        returns: number
        result: $e_1
  - path:
    - R
    value: '0'
