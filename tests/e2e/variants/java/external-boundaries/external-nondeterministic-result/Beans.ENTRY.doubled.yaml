- name: add-one
  edits:
  - from: return reading + reading;
    to: return reading + 1;
  expect:
  - path:
    - R
    value: $e_0 + 1
- name: cancel-reading
  edits:
  - from: return reading + reading;
    to: return reading - reading;
  expect:
  - path:
    - R
    value: '0'
- name: preserve-two-identical-calls
  edits:
  - from: |-
      int reading = issuer.issue();
              return reading + reading;
    to: |-
      int first = issuer.issue();
              int second = issuer.issue();
              return first + second;
  expect:
  - path:
    - S
    value:
    - call:
        external: src/NumberService.java#Beans.ENTRY.issuer.issue
        args: []
        returns: number
        result: $e_0
    - call:
        external: src/NumberService.java#Beans.ENTRY.issuer.issue
        args: []
        returns: number
        result: $e_1
  - path:
    - R
    value: $e_0 + $e_1
