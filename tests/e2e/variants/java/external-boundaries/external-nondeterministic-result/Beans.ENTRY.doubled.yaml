- name: subtraction-of-two-independent-acquisitions-cannot-cancel
  edits:
  - from: return reading + reading;
    to: int next = issuer.issue(); return reading - next;
  expect:
  - path:
    - S
    value:
    - call:
        external: src/NumberService.java#Beans.ENTRY.issuer.issue
        args: []
        returns: number
        result: $e_0
    - call:
        external: src/NumberService.java#Beans.ENTRY.issuer.issue
        args: []
        returns: number
        result: $e_1
  - path:
    - R
    value: $e_0 - $e_1
- name: only-the-same-second-acquisition-cancels
  edits:
  - from: return reading + reading;
    to: int next = issuer.issue(); return next - next;
  expect:
  - path:
    - S
    value:
