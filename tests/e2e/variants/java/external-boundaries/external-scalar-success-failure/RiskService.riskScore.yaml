- name: fallback-to-negative-one
  edits:
  - from: return 0;
    to: return -1;
  expect:
  - path:
    - R
    value: "CASE\n  WHEN completion.is_throw($e_0, RiskUnavailable) THEN -1\n  ELSE $e_0\nEND"
- name: rename-external-method
  edits:
  - from: fetchScore(accountId)
    to: readScore(accountId)
  - from: int fetchScore(int accountId) throws RiskUnavailable;
    to: int readScore(int accountId) throws RiskUnavailable;
  expect:
  - path:
    - S
    value:
    - call:
        external: riskClient.readScore
        args:
        - accountId
        returns: number
        result: $e_0
  - path:
    - R
    value: "CASE\n  WHEN completion.is_throw($e_0, RiskUnavailable) THEN 0\n  ELSE $e_0\nEND"
- name: timeout-fallback
  edits:
  - from: catch (RiskUnavailable ignored)
    to: catch (Timeout ignored)
  - from: throws RiskUnavailable;
    to: throws Timeout;
  - from: class RiskUnavailable extends RuntimeException {}
    to: class Timeout extends RuntimeException {}
  expect:
  - path:
    - R
    value: "CASE\n  WHEN completion.is_throw($e_0, Timeout) THEN 0\n  ELSE $e_0\nEND"
- name: explicit-this-still-selects-the-declared-external-field
  edits:
  - from: return riskClient.fetchScore(accountId);
    to: return this.riskClient.fetchScore(accountId);
- name: an-ordinary-shadowing-parameter-is-not-the-external-field
  edits:
  - from: int riskScore(int accountId)
    to: int riskScore(RiskClient riskClient, int accountId)
  reject:
  - '[NORM-OUT-OF-SOURCE]'
  - target=RiskClient.fetchScore
  - '[NORM-ENGINE-FAILURE]'
