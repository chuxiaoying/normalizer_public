- name: rename-external-method
  edits:
  - from: client.fetch(accountId)
    to: client.read(accountId)
  - from: Profile fetch(int accountId) throws ProfileUnavailable;
    to: Profile read(int accountId) throws ProfileUnavailable;
  expect:
  - path:
    - S
    value:
    - call:
        external: src/ProfileService.java#Beans.ENTRY.client.read
        args:
        - accountId
        returns: Profile
        result: $e_0
  - path:
    - R
    value: $e_0.score
  - path:
    - throws
    value:
    - type: ProfileUnavailable
      when: completion.is_throw($e_0, ProfileUnavailable)
- name: project-different-field
  edits:
  - from: return client.fetch(accountId).score;
    to: return client.fetch(accountId).score + 1;
  expect:
  - path:
    - R
    value: $e_0.score + 1
- name: projected-receipts-sort-by-numeric-id-without-moving-calls
