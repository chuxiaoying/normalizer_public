- name: acquired-immutable-field-self-subtraction-preserves-call
  edits:
  - from: return client.fetch(accountId).score;
    to: |-
      Profile reply = client.fetch(accountId);
              return reply.score - reply.score;
  expect:
  - path:
    - R
    value: '0'
- name: earlier-scalar-receipt-is-not-the-throwing-record
  edits:
  - from: Profile fetch(int accountId) throws ProfileUnavailable;
    to: int preview(int accountId); native Profile fetch(int accountId) throws ProfileUnavailable;
  - from: return client.fetch(accountId).score;
    to: int ignored = client.preview(accountId); Profile selected = client.fetch(accountId); return selected.score;
  expect:
  - path:
    - S
    value:
    - call:
        external: src/ProfileService.java#Beans.ENTRY.client.preview
        args:
        - accountId
        returns: number
        result: $e_0
    - call:
        external: src/ProfileService.java#Beans.ENTRY.client.fetch
        args:
        - accountId
        returns: Profile
        result: $e_1
  - path:
    - R
    value: $e_1.score
  - path:
    - throws
    value:
    - type: ProfileUnavailable
      when: completion.is_throw($e_1, ProfileUnavailable)
- name: same-typed-earlier-record-is-not-the-selected-throwing-record
  edits:
  - from: Profile fetch(int accountId) throws ProfileUnavailable;
    to: Profile preview(int accountId); native Profile fetch(int accountId) throws ProfileUnavailable;
  - from: return client.fetch(accountId).score;
    to: Profile previous = client.preview(accountId); Profile selected = client.fetch(accountId); return previous.score
      - selected.score;
  expect:
  - path:
    - S
    value:
    - call:
        external: src/ProfileService.java#Beans.ENTRY.client.preview
        args:
        - accountId
        returns: Profile
        result: $e_0
    - call:
        external: src/ProfileService.java#Beans.ENTRY.client.fetch
        args:
        - accountId
        returns: Profile
        result: $e_1
  - path:
    - R
    value: $e_0.score - $e_1.score
  - path:
    - throws
    value:
    - type: ProfileUnavailable
      when: completion.is_throw($e_1, ProfileUnavailable)

- name: the-same-acquired-receipt-field-cancels-without-erasing-the-call
  edits:
    - { from: 'return client.fetch(accountId).score;', to: 'Profile reply = client.fetch(accountId); int score = reply.score; return score - score;' }
  expect:
    - { path: [R], value: '0' }

- name: same-field-in-separate-acquisitions-does-not-cancel
  edits:
    - { from: 'Profile fetch(int accountId) throws ProfileUnavailable;', to: 'Profile fetch(int accountId);' }
    - from: 'return client.fetch(accountId).score;'
      to: 'Profile first = client.fetch(accountId); Profile second = client.fetch(accountId); return first.score - second.score;'
  expect:
    - path: [R]
      value: '$e_0.score - $e_1.score'
    - path: [S]
      value:
        - call: { external: src/ProfileService.java#Beans.ENTRY.client.fetch, args: [accountId], returns: Profile, result: '$e_0' }
        - call: { external: src/ProfileService.java#Beans.ENTRY.client.fetch, args: [accountId], returns: Profile, result: '$e_1' }
    - { path: [throws], absent: true }
