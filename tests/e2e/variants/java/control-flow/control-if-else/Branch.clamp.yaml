- name: raise-lower-bound
  edits:
    - from: 'if (value < 0) return 0;'
      to: 'if (value < 10) return 10;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN value < 10 THEN 10
          WHEN limit < value THEN limit
          ELSE value
        END
- name: lower-upper-limit
  edits:
    - from: 'if (value > limit) return limit;'
      to: 'if (value > limit + 1) return limit + 1;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN value < 0 THEN 0
          WHEN value > limit + 1 THEN limit + 1
          ELSE value
        END
