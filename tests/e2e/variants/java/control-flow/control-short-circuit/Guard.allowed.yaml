- name: inactive-is-false
  edits:
    - from: 'return active && value > 0;'
      to: 'return false && value > 0;'
  expect:
    - path: [R]
      value: 'false'
- name: nonnegative-value
  edits:
    - from: 'return active && value > 0;'
      to: 'return active && value >= 0;'
  expect:
    - path: [R]
      value: active AND value >= 0
