- name: evaluate-probe-before-guard
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: |-
        int observed = probe.read(value);
                return active && observed > 0;
  expect:
    - path: [S]
      value:
        - call: { external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.read, args: [value], returns: number, result: $e_0 }
    - path: [R]
      value: active AND $e_0 > 0
- name: concrete-false-does-not-call-probe
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: 'return false && probe.read(value) > 0;'
  expect:
    - path: [S]
      absent: true
    - path: [R]
      value: 'false'
- name: concrete-true-calls-probe-once
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: 'return true && probe.read(value) > 0;'
  expect:
    - path: [S]
      value:
        - call: { external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.read, args: [value], returns: number, result: $e_0 }
    - path: [R]
      value: $e_0 > 0
- name: concrete-true-or-does-not-call-probe
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: 'return true || probe.read(value) > 0;'
  expect:
    - path: [S]
      absent: true
    - path: [R]
      value: 'true'
- name: concrete-false-or-calls-probe-once
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: 'return false || probe.read(value) > 0;'
  expect:
    - path: [S]
      value:
        - call: { external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.read, args: [value], returns: number, result: $e_0 }
    - path: [R]
      value: $e_0 > 0
- name: keep-receipt-guard-in-call-argument
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: |-
        boolean allowed = active && probe.read(value) > 0;
                probe.publish(allowed);
                return allowed;
    - from: 'class Probe { native int read(int value); }'
      to: 'class Probe { native int read(int value); native void publish(boolean allowed); }'
  expect:
    - path: [S]
      value:
        - call: { external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.read, args: [value], returns: number, result: $e_0, when: active }
        - call:
            external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.publish
            args: ['CASE WHEN active THEN $e_0 > 0 ELSE false END']
            returns: void
            result: $e_1
- name: keep-receipt-guard-in-state-write
  edits:
    - from: 'class GuardWithProbe {'
      to: |-
        class GuardWithProbe {
            @N.EntryState
            boolean stored;
    - from: 'return active && probe.read(value) > 0;'
      to: |-
        stored = active && probe.read(value) > 0;
                return stored;
  expect:
    - path: [E]
      add:
        stored: { kind: state, source: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.stored, type: bool }
    - path: [S]
      value:
        - call: { external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.read, args: [value], returns: number, result: $e_0, when: active }
        - write: { target: stored, value: 'CASE WHEN active THEN $e_0 > 0 ELSE false END' }
- name: keep-receipt-guard-in-later-call-condition
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: |-
        if (active && probe.read(value) > 0) probe.signal();
                return true;
    - from: 'class Probe { native int read(int value); }'
      to: 'class Probe { native int read(int value); native void signal(); }'
  expect:
    - path: [S]
      value:
        - call: { external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.read, args: [value], returns: number, result: $e_0, when: active }
        - call:
            external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.signal
            args: []
            returns: void
            result: $e_1
            when: CASE WHEN active THEN $e_0 > 0 ELSE false END
    - path: [R]
      value: 'true'

- name: equivalent-negated-disjunction-keeps-the-same-acquisition
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: 'return !(!active || probe.read(value) <= 0);'

- name: short-circuit-or-remains-guarded-in-a-later-publication-argument
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: |-
        boolean allowed = active || probe.read(value) > 0;
                probe.publish(allowed);
                return allowed;
    - from: 'class Probe { native int read(int value); }'
      to: 'class Probe { native int read(int value); native void publish(boolean allowed); }'
  expect:
    - path: [S]
      value:
        - call: {external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.read, args: [value], returns: number, result: '$e_0', when: 'NOT (active)'}
        - call: {external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.publish, args: ['CASE WHEN active THEN true ELSE $e_0 > 0 END'], returns: void, result: '$e_1'}
    - {path: [R], value: 'CASE WHEN active THEN true ELSE $e_0 > 0 END'}

- name: effect-guard-uses-or-result-not-an-unbound-probe
  edits:
    - from: 'return active && probe.read(value) > 0;'
      to: |-
        if (active || probe.read(value) > 0) probe.signal();
                return true;
    - from: 'class Probe { native int read(int value); }'
      to: 'class Probe { native int read(int value); native void signal(); }'
  expect:
    - path: [S]
      value:
        - call: {external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.read, args: [value], returns: number, result: '$e_0', when: 'NOT (active)'}
        - call: {external: src/GuardWithProbe.java#GuardWithProbe.INSTANCE.probe.signal, args: [], returns: void, result: '$e_1', when: 'CASE WHEN active THEN true ELSE $e_0 > 0 END'}
    - {path: [R], value: 'true'}
