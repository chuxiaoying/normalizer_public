- name: change-second-code
  edits:
    - {from: 'return 20;', to: 'return 30;'}
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN code == 1 THEN 10
          WHEN code == 2 THEN 30
          ELSE 0
        END
- name: change-default
  edits:
    - {from: 'return 0;', to: 'return 1;'}
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN code == 1 THEN 10
          WHEN code == 2 THEN 20
          ELSE 1
        END
- name: native-switch-with-case-block
  edits:
    - from: |-
        case 1:
                        return 10;
      to: |-
        case 1: {
                        return 10;
                    }
