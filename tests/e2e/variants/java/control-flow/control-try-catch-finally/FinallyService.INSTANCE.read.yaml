- name: change-catch-fallback
  edits:
  - from: return 0;
    to: return -1;
  expect:
  - path:
    - R
    value: "CASE\n  WHEN completion.is_throw($e_0, RemoteError) THEN -1\n  ELSE $e_0\nEND"
- name: count-two-completions
  edits:
  - from: attempts = attempts + 1;
    to: attempts = attempts + 2;
  expect:
  - path:
    - S
    - 1
    - write
    - value
    value: attempts + 2
- name: return-from-finally-overrides-try-and-catch
  edits:
  - from: attempts = attempts + 1;
    to: attempts = attempts + 1; return 42;
  expect:
  - path:
    - R
    value: '42'
- name: native-try-with-resources-closes-before-finally-on-both-paths
  edits:
    - from: 'class FinallyService {'
      to: |-
        class LocalResource implements AutoCloseable {
            private final FinallyService owner;
            LocalResource(FinallyService owner) { this.owner = owner; }
            public void close() { owner.attempts = owner.attempts + 10; }
        }

        class FinallyService {
    - {from: 'try {', to: 'try (LocalResource resource = new LocalResource(this)) {'}
  expect:
    - path: [S]
      value:
        - call: {external: 'src/FinallyService.java#FinallyService.INSTANCE.client.fetch', args: [accountId], returns: number, result: '$e_0'}
        - write: {target: attempts, value: 'attempts + 10'}
        - write: {target: attempts, value: 'attempts + 11'}

- name: native-multi-catch-retains-the-matching-alternative
  edits:
    - from: 'class RemoteError extends RuntimeException {}'
      to: |-
        class RemoteError extends RuntimeException {}
        class OtherError extends RuntimeException {}
    - {from: 'catch (RemoteError ignored)', to: 'catch (OtherError | RemoteError ignored)'}
- name: reject-overlapping-types-in-one-multi-catch
  edits:
    - {from: 'catch (RemoteError ignored)', to: 'catch (RemoteError | RuntimeException ignored)'}
  reject: ['[NORM-CATCH-TYPE]', 'kind=PREPROCESS_REQUIRED', 'RemoteError', 'RuntimeException']

- name: type-only-exception-walks-its-parents-not-an-unrelated-handler
  edits:
  - from: class RemoteError extends RuntimeException {}
    to: 'class ParentError extends RuntimeException {}

      class RemoteError extends ParentError {}

      class OtherError extends RuntimeException {}'
  - from: catch (RemoteError ignored)
    to: catch (OtherError ignored) { return 999; } catch (RuntimeException ignored)
- name: type-only-exception-hierarchy-cannot-cycle
  edits:
  - from: class RemoteError extends RuntimeException {}
    to: 'class ParentError extends RemoteError {}

      class RemoteError extends ParentError {}'
  reject:
  - '[NORM-EXCEPTION-CYCLE]'
  - ParentError
- name: source-exception-may-reach-the-checked-root
  edits:
    - from: 'class RemoteError extends RuntimeException {}'
      to: |-
        class ParentError extends java.lang.Exception {}
        class RemoteError extends ParentError {}
- name: a-non-throwable-root-is-not-an-exception-contract
  edits:
    - from: 'class RemoteError extends RuntimeException {}'
      to: |-
        class ParentError {}
        class RemoteError extends ParentError {}
  reject: ['[NORM-EXCEPTION-BASE]', 'RemoteError']

- name: always-throw-after-finally-write
  edits:
  - from: attempts = attempts + 1;
    to: attempts = attempts + 1; throw new RemoteError();
  expect:
  - path:
    - R
    value: ⊥
  - path:
    - throws
    add:
    - type: RemoteError
      when: 'true'

- name: conditional-finally-return-only-overrides-its-domain
  edits:
    - from: attempts = attempts + 1;
      to: attempts = attempts + 1; if (accountId == 0) return 42;
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN accountId == 0 THEN 42
          WHEN completion.is_throw($e_0, RemoteError) THEN 0
          ELSE $e_0
        END

- name: fully-qualified-catch-base-matches-the-same-exception
  edits:
  - from: catch (RemoteError ignored)
    to: catch (java.lang.RuntimeException ignored)

- name: final-catch-binding-does-not-change-the-matching-domain
  edits:
  - from: catch (RemoteError ignored)
    to: catch (final RemoteError ignored)

- name: reject-primitive-catch-type-rather-than-treating-it-as-unmatched
  edits:
  - from: catch (RemoteError ignored)
    to: catch (int ignored)
  reject: ['[SOURCE-PARSE-FAILED]', 'kind=PREPROCESS_REQUIRED', 'catch requires an exception class name']

- name: reject-array-catch-type-rather-than-using-its-component
  edits:
  - from: catch (RemoteError ignored)
    to: catch (RemoteError[] ignored)
  reject: ['[SOURCE-PARSE-FAILED]', 'kind=PREPROCESS_REQUIRED', 'catch requires an exception class name']

- name: reject-missing-catch-type-rather-than-ignoring-the-handler
  edits:
  - from: catch (RemoteError ignored)
    to: catch (MissingError ignored)
  reject: ['[NORM-CATCH-TYPE]', 'kind=PREPROCESS_REQUIRED', 'location=FinallyService.read', 'undeclared catch class MissingError']

- name: reject-declared-class-outside-the-exception-hierarchy
  edits:
  - from: class RemoteError extends RuntimeException {}
    to: |-
      class RemoteError extends RuntimeException {}
      class Ordinary {}
  - from: catch (RemoteError ignored)
    to: catch (Ordinary ignored)
  reject: ['[NORM-CATCH-TYPE]', 'kind=PREPROCESS_REQUIRED', 'location=FinallyService.read', 'undeclared catch class Ordinary']


- name: reject-unknown-catch-in-unused-method-at-entry
  edits:
  - from: int read(int accountId) {
    to: |-
      int unused(int id) { try { return id; } catch (MissingError ignored) { return 0; } }
          int read(int accountId) {
  reject: ['[NORM-CATCH-TYPE]', 'kind=PREPROCESS_REQUIRED', 'location=FinallyService.unused', 'undeclared catch class MissingError']

- name: reject-unknown-catch-after-a-matching-handler-at-entry
  edits:
  - from: '} finally {'
    to: '} catch (MissingError ignored) { return 999; } finally {'
  reject: ['[NORM-CATCH-TYPE]', 'kind=PREPROCESS_REQUIRED', 'location=FinallyService.read', 'undeclared catch class MissingError']

- name: reject-subclass-handler-shadowed-by-a-prior-base-at-entry
  edits:
  - from: catch (RemoteError ignored)
    to: catch (RuntimeException ignored) { return 999; } catch (RemoteError ignored)
  reject: ['[NORM-CATCH-ORDER]', 'kind=PREPROCESS_REQUIRED', 'location=FinallyService.read', 'catch class RemoteError is already caught by java.lang.RuntimeException']

- name: reject-duplicate-catch-under-alternate-qualified-name
  edits:
  - from: catch (RemoteError ignored)
    to: catch (RuntimeException ignored) { return 999; } catch (java.lang.RuntimeException ignored)
  reject: ['[NORM-CATCH-ORDER]', 'kind=PREPROCESS_REQUIRED', 'location=FinallyService.read', 'catch class java.lang.RuntimeException is already caught by java.lang.RuntimeException']

- name: legal-specific-handler-before-base-keeps-first-match
  edits:
  - from: '} finally {'
    to: '} catch (RuntimeException ignored) { return 999; } finally {'
- name: unmatched-remote-failure-propagates-after-finally-write
  edits:
    - from: 'class RemoteError extends RuntimeException {}'
      to: |-
        class RemoteError extends RuntimeException {}
        class DisjointError extends RuntimeException {}
    - from: 'catch (RemoteError ignored)'
      to: 'catch (DisjointError ignored)'
  expect:
    - {path: [R], value: '$e_0'}
    - path: [throws]
      add:
        - type: RemoteError
          when: completion.is_throw($e_0, RemoteError)

- name: terminal-finally-throw-replaces-the-pending-remote-failure
  edits:
    - from: 'class RemoteError extends RuntimeException {}'
      to: |-
        class RemoteError extends RuntimeException {}
        class DisjointError extends RuntimeException {}
        class TerminalError extends RuntimeException {}
    - from: 'catch (RemoteError ignored)'
      to: 'catch (DisjointError ignored)'
    - from: 'attempts = attempts + 1;'
      to: 'attempts = attempts + 1; throw new TerminalError();'
  expect:
    - {path: [R], value: '⊥'}
    - path: [throws]
      add:
        - {type: TerminalError, when: 'true'}

- name: second-finally-write-reads-the-first-write
  edits:
    - from: 'attempts = attempts + 1;'
      to: 'attempts = attempts + 1; attempts = attempts + 2;'
  expect:
    - path: [S]
      value:
        - call: {external: src/FinallyService.java#FinallyService.INSTANCE.client.fetch, args: [accountId], returns: number, result: '$e_0'}
        - write: {target: attempts, value: 'attempts + 1'}
        - write: {target: attempts, value: 'attempts + 3'}

- name: payload-bearing-terminal-finally-keeps-the-new-failure
  edits:
    - from: 'attempts = attempts + 1;'
      to: 'attempts = attempts + 1; throw new RuntimeException("message");'
  expect:
    - {path: [R], value: '⊥'}
    - path: [throws]
      add:
        - {type: java.lang.RuntimeException, when: 'true', payload: '"message"'}

- name: inactive-finally-return-does-not-erase-pending-result
  edits:
    - { from: 'attempts = attempts + 1;', to: 'attempts = attempts + 1; if (false) return 42;' }

- name: two-finally-returns-override-pending-completions-on-both-domains
  edits:
    - from: 'attempts = attempts + 1;'
      to: 'attempts = attempts + 1; if (accountId == 0) return 42; else return 43;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN accountId == 0 THEN 42
          ELSE 43
        END
