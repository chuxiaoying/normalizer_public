- name: raise-threshold
  edits:
    - {from: 'value < 0', to: 'value < 2'}
  expect:
    - {path: [R], value: "CASE\n  WHEN value < 2 THEN 0\n  ELSE value\nEND"}
- name: fallback-negative-one
  edits:
    - {from: 'return 0;', to: 'return -1;'}
  expect:
    - {path: [R], value: "CASE\n  WHEN value < 0 THEN -1\n  ELSE value\nEND"}
- name: negative-path-escapes-unrelated-handler
  edits:
    - {from: 'class Guarded {', to: "class OtherValue extends RuntimeException {}\n\nclass Guarded {"}
    - {from: 'catch (NegativeValue ignored)', to: 'catch (OtherValue ignored)'}
  expect:
    - {path: [R], value: value}
    - path: [throws]
      add: [{type: NegativeValue, when: 'value < 0'}]
