- name: stop-before-five
  edits:
    - {from: 'if (i > 4) break;', to: 'if (i > 3) break;'}
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN limit <= 2 THEN 0
          WHEN limit == 3 THEN 2
          ELSE 5
        END
- name: native-break-exits-on-the-first-candidate
  edits:
    - {from: 'if (i < 2) continue;', to: 'if (i < 2) break;'}
  expect:
    - {path: [R], value: '0'}
- name: native-continue-only-skips-the-first-candidate
  edits:
    - {from: 'if (i < 2) continue;', to: 'if (i < 1) continue;'}
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN limit <= 1 THEN 0
          WHEN limit == 2 THEN 1
          WHEN limit == 3 THEN 3
          WHEN limit == 4 THEN 6
          ELSE 10
        END
- name: first-unskipped-candidate-is-already-beyond-the-stop-bound
  edits:
    - {from: 'if (i > 4) break;', to: 'if (i > 1) break;'}
  expect:
    - {path: [R], value: '0'}
- name: write-before-break-is-part-of-the-completed-prefix
  edits:
    - from: |-
        if (i > 4) break;
                    total = total + i;
      to: |-
        total = total + i;
                    if (i > 4) break;
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN limit <= 2 THEN 0
          WHEN limit == 3 THEN 2
          WHEN limit == 4 THEN 5
          WHEN limit == 5 THEN 9
          ELSE 14
        END
- name: repeated-continue-is-not-a-proof-of-a-finite-symbolic-loop
  edits:
    - {from: 'if (i > 4) break;', to: 'if (i > 4) continue;'}
  reject: ['[NORM-LOOP]', 'PREPROCESS_REQUIRED']

- name: compound-guards-preserve-the-original-committed-prefix
  edits:
    - {from: 'if (i < 2) continue;', to: 'if (i == 0 || i == 1) continue;'}
    - {from: 'if (i > 4) break;', to: 'if (i >= 5 && i <= 5) break;'}
