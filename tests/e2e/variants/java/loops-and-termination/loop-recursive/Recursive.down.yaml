reject: ['[NORM-RECURSION]', 'kind=PREPROCESS_REQUIRED', 'Recursive.down']
variants:
  - name: strict-base-condition-still-allows-a-cycle
    edits:
      - {from: 'value <= 0', to: 'value < 0'}
    reject: ['[NORM-RECURSION]', 'kind=PREPROCESS_REQUIRED', 'Recursive.down']
  - name: mutual-call-cycle-keeps-the-same-argument
    edits:
      - from: |-
          return down(value) + 1;
              }
        to: |-
          return step(value);
              }
              static int step(int value) {
                  return down(value);
              }
    reject: ['[NORM-RECURSION]', 'kind=PREPROCESS_REQUIRED', 'Recursive.down']
