- name: larger-decreasing-step-with-its-own-base-case
  edits:
    - from: 'return finiteDown(value - 1) + 1;'
      to: |-
        if (value == 1) return 1;
                return finiteDown(value - 2) + 2;
- name: increase-the-per-step-result-with-the-same-decreasing-domain
  edits:
    - {from: 'return finiteDown(value - 1) + 1;', to: 'return finiteDown(value - 1) + 2;'}
  expect:
    - {path: [R], value: "CASE\n  WHEN value > 0 THEN value * 2\n  ELSE 0\nEND"}
