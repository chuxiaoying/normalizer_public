- name: four-iterations
  edits:
    - from: 'i < 3'
      to: 'i < 4'
  expect:
    - path: [R]
      value: '6'
- name: two-iterations
  edits:
    - from: 'i < 3'
      to: 'i < 2'
  expect:
    - path: [R]
      value: '1'
- name: inclusive-ascending-bound-counts-the-final-element
  edits:
    - { from: 'int i = 0; i < 3; i++', to: 'int i = 0; i <= 2; ++i' }
- name: inclusive-descending-bound-counts-zero-at-the-end
  edits:
    - { from: 'int i = 0; i < 3; i++', to: 'int i = 2; i >= 0; i--' }
- name: strict-descending-bound-starts-with-the-supplied-counter
  edits:
    - { from: 'int i = 0; i < 3; i++', to: 'int i = 2; i > 0; --i' }
- name: a-false-initial-condition-keeps-the-initial-accumulator
  edits:
    - { from: 'int i = 0; i < 3; i++', to: 'int i = 1; i < 0; i++' }
  expect:
    - { path: [R], value: '0' }
- name: negative-long-constants-preserve-the-start-and-bound
  edits:
    - { from: 'static int total()', to: 'static long total()' }
    - { from: 'int sum = 0;', to: 'long sum = 0L;' }
    - { from: 'int i = 0; i < 3; i++', to: 'long i = -1L; i < 2L; ++i' }
  expect:
    - { path: [R], value: '0' }
- name: a-constant-bound-with-the-wrong-step-does-not-prove-termination
  edits:
    - { from: 'int i = 0; i < 3; i++', to: 'int i = 0; i < 3; i--' }
  reject: ['[NORM-LOOP]', 'SmallLoop.total']
- name: an-assigned-outer-counter-retains-the-last-update
  edits:
    - { from: 'int sum = 0;', to: 'int i = 99; int sum = 0;' }
    - { from: 'int i = 0; i < 3; i++', to: 'i = 0; i < 3; i++' }
    - { from: 'return sum;', to: 'return sum * 10 + i;' }
  expect:
    - { path: [R], value: '33' }
- name: a-zero-trip-assigned-header-still-overwrites-the-outer-counter
  edits:
    - { from: 'int sum = 0;', to: 'int i = 99; int sum = 0;' }
    - { from: 'for (int i = 0; i < 3; i++) sum += i;', to: 'for (i = 4; i < 4; i++) {}' }
    - { from: 'return sum;', to: 'return i;' }
  expect:
    - { path: [R], value: '4' }
- name: a-legal-assigned-header-cannot-hide-an-illegal-prior-store
  edits:
    - { from: 'int sum = 0;', to: 'int i = 99; i = 99L; int sum = 0;' }
    - { from: 'int i = 0; i < 3; i++', to: 'i = 0; i < 3; i++' }
  reject: ['[NORM-SOURCE-TYPE]', 'assignment to i', 'cannot implicitly narrow']
- name: a-native-int-array-foreach-preserves-the-long-offset
  edits:
    - { from: 'static int total()', to: 'static long total(int[] items)' }
    - { from: 'int sum = 0;', to: 'long sum = 0L;' }
    - { from: 'for (int i = 0; i < 3; i++) sum += i;', to: 'for (int v : items) sum += v + 1L;' }
  expect:
    - { path: [P, parameters, items], add: { position: 0, type: 'number[]' } }
    - { path: [R], value: 'COALESCE(SUM(SELECT value + 1 FROM items), 0)' }
- name: commuted-integer-additions-still-prove-the-same-array-sum
  edits:
    - { from: 'static int total()', to: 'static int total(int[] items)' }
    - from: 'for (int i = 0; i < 3; i++) sum += i;'
      to: 'for (int v : items) { sum = (1 + v) + sum; }'
  expect:
    - { path: [P, parameters, items], add: { position: 0, type: 'number[]' } }
    - { path: [R], value: 'COALESCE(SUM(SELECT value + 1 FROM items), 0)' }

- name: an-assigned-outer-long-counter-retains-the-last-update
  edits:
    - from: 'static int total()'
      to: 'static long total()'
    - from: 'int sum = 0;'
      to: 'long i = 99L; long sum = 0L;'
    - from: 'int i = 0; i < 3; i++'
      to: 'i = 0L; i < 3L; i++'
    - from: 'return sum;'
      to: 'return sum * 10L + i;'
  expect:
    - path: [R]
      value: '33'

- name: an-assigned-outer-short-counter-within-range-keeps-the-last-step
  edits:
    - {from: 'int sum = 0;', to: 'short i = 99; int sum = 0;'}
    - {from: 'int i = 0; i < 3; i++', to: 'i = 0; i < 3; i++'}
    - {from: 'return sum;', to: 'return sum * 10 + i;'}
  expect:
    - {path: [R], value: '33'}

- name: reversing-the-comparison-operands-keeps-the-same-finite-range
  edits:
    - {from: 'int i = 0; i < 3; i++', to: 'int i = 0; 3 > i; i++'}

- name: an-early-return-uses-only-the-completed-iteration-prefix
  edits:
    - {from: 'for (int i = 0; i < 3; i++) sum += i;', to: 'for (int i = 0; i < 3; i++) { sum += i; if (i == 1) return sum + 10; }'}
  expect:
    - {path: [R], value: '11'}

- name: a-local-loop-counter-does-not-advance-when-returning-from-the-body
  edits:
    - {from: 'int sum = 0;', to: 'int i = 99; int sum = 0;'}
    - {from: 'for (int i = 0; i < 3; i++) sum += i;', to: 'for (i = 0; i < 3; i++) { sum += i; if (i == 1) return 10 * i + sum; }'}
  expect:
    - {path: [R], value: '11'}

- name: reversed-inclusive-ascending-comparison-keeps-the-last-iteration
  edits:
    - {from: 'int i = 0; i < 3; i++', to: 'int i = 0; 3 >= i; i++'}
  expect:
    - {path: [R], value: '6'}

- name: reversed-strict-descending-comparison-keeps-the-first-iteration
  edits:
    - {from: 'int i = 0; i < 3; i++', to: 'int i = 2; 0 < i; i--'}

- name: terminal-return-does-not-spend-budget-on-unreachable-iterations
  edits:
    - from: 'for (int i = 0; i < 3; i++) sum += i;'
      to: 'for (int i = 0; i < 2147483647; i++) { return 5; }'
  expect:
    - {path: [R], value: '5'}

- name: a-conditional-forward-write-counts-only-the-executed-values
  edits:
    - {from: 'int sum = 0;', to: 'int i = 0; int sum = 0;'}
    - from: 'for (int i = 0; i < 3; i++) sum += i;'
      to: 'for (i = 0; i < 3; i++) { if (i == 1) i = 2; sum += i; }'
  expect:
    - {path: [R], value: '2'}
- name: repeatedly-resetting-the-counter-cannot-prove-completion
  edits:
    - from: 'for (int i = 0; i < 3; i++) sum += i;'
      to: 'for (int i = 0; i < 3; i++) { if (i == 1) i = 0; sum += i; }'
  reject: ['[NORM-LOOP]', 'kind=PREPROCESS_REQUIRED', 'SmallLoop.total']

- name: constant-bound-for-each-without-an-offset-keeps-the-elements
  edits:
    - { from: 'static int total()', to: 'static long total(int[] items)' }
    - { from: 'int sum = 0;', to: 'long sum = 0L;' }
    - { from: 'for (int i = 0; i < 3; i++) sum += i;', to: 'for (int v : items) sum += v;' }
  expect:
    - { path: [P, parameters, items], add: { position: 0, type: 'number[]' } }
    - { path: [R], value: 'COALESCE(SUM(SELECT value FROM items), 0)' }

- name: condition-on-another-variable-does-not-bound-the-induction-counter
  edits:
    - { from: 'static int total()', to: 'static int total(int other)' }
    - { from: 'i < 3', to: 'other < 3' }
  reject: ['[NORM-LOOP]', 'kind=PREPROCESS_REQUIRED', 'SmallLoop.total']

- name: update-of-another-variable-does-not-prove-the-induction-step
  edits:
    - { from: 'static int total()', to: 'static int total(int other)' }
    - { from: 'i++) sum += i;', to: 'other++) sum += i;' }
  reject: ['[NORM-LOOP]', 'kind=PREPROCESS_REQUIRED', 'SmallLoop.total']

- name: a-private-new-field-counter-has-its-own-termination-proof
  edits:
    - from: 'class SmallLoop {'
      to: |-
        class Counter { int position; }
        class SmallLoop {
    - {from: 'int sum = 0;', to: 'Counter counter = new Counter(); Counter alias = counter; int sum = 0;'}
    - from: 'for (int i = 0; i < 3; i++) sum += i;'
      to: 'for (counter.position = 0; counter.position < 3; alias.position++) sum += counter.position;'
  expect:
    - {path: [R], value: '3'}

- name: identical-member-name-on-a-different-object-does-not-bind-the-counter
  edits:
    - from: 'class SmallLoop {'
      to: |-
        class Counter { int position; }
        class SmallLoop {
    - {from: 'int sum = 0;', to: 'Counter counter = new Counter(); Counter alias = new Counter(); int sum = 0;'}
    - from: 'for (int i = 0; i < 3; i++) sum += i;'
      to: 'for (counter.position = 0; counter.position < 3; alias.position++) sum += counter.position;'
  reject: ['[NORM-LOOP]', 'one acquired private allocation']

- name: zero-trip-private-counter-keeps-the-initial-header-store
  edits:
    - from: 'class SmallLoop {'
      to: |-
        class Counter { int position; }
        class SmallLoop {
    - {from: 'int sum = 0;', to: 'Counter counter = new Counter(); Counter alias = counter; int sum = 0;'}
    - from: 'for (int i = 0; i < 3; i++) sum += i;'
      to: 'for (alias.position = 3; counter.position < 3; counter.position++) sum += counter.position;'
    - {from: 'return sum;', to: 'return sum + counter.position;'}
  expect:
    - {path: [R], value: '3'}
