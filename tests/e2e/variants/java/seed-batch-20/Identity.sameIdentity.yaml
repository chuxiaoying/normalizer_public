- name: negate-identity-check
  edits:
    - from: "return left == right;"
      to: "return left != right;"
  expect:
    - path: [R]
      value: left != right
- name: reverse-identity-operands
  edits:
    - from: 'return left == right;'
      to: 'return right == left;'
- name: public-names-before-allocation-order
  edits:
    - from: 'static boolean sameIdentity(Box left, Box right) {'
      to: 'static boolean sameIdentity(Box right, Box left) {'
  expect:
    - path: [P, parameters, left, position]
      value: 1
    - path: [P, parameters, right, position]
      value: 0
- name: fresh-allocation-is-distinct-from-an-entry-reference
  edits:
    - { from: 'return left == right;', to: 'Box created = new Box(); return left == created;' }
  expect:
    - { path: [R], value: 'false' }
- name: freshness-is-symmetric-and-preserves-the-inequality
  edits:
    - { from: 'return left == right;', to: 'Box created = new Box(); return created != left;' }
  expect:
    - { path: [R], value: 'true' }
- name: a-local-alias-of-the-same-allocation-is-equal
  edits:
    - { from: 'return left == right;', to: 'Box created = new Box(); Box alias = created; return created == alias;' }
  expect:
    - { path: [R], value: 'true' }
- name: equal-fields-do-not-merge-two-fresh-allocations
  edits:
    - { from: 'return left == right;', to: 'Box first = new Box(); Box second = new Box(); first.value = 7; second.value = 7; return first == second;' }
  expect:
    - { path: [R], value: 'false' }
- name: fresh-replacement-identity-is-decided-by-the-source-branch
  edits:
    - { from: 'static boolean sameIdentity(Box left, Box right)', to: 'static boolean sameIdentity(Box left, Box right, boolean replace)' }
    - { from: 'return left == right;', to: 'Box alias = left; if (replace) { alias = new Box(); } return alias == left;' }
  expect:
    - path: [P, parameters]
      value: { left: { position: 0, type: Box }, right: { position: 1, type: Box }, replace: { position: 2, type: bool } }
    - { path: [R], value: 'NOT (replace)' }
- name: acquired-replacement-keeps-the-original-input-alias-test
  edits:
    - { from: 'static boolean sameIdentity(Box left, Box right)', to: 'static boolean sameIdentity(Box left, Box right, boolean replace)' }
    - { from: 'return left == right;', to: 'Box alias = left; if (replace) { alias = right; } return left == alias;' }
  expect:
    - path: [P, parameters]
      value: { left: { position: 0, type: Box }, right: { position: 1, type: Box }, replace: { position: 2, type: bool } }
    - { path: [R], value: 'left == right OR NOT (replace)' }
- name: a-definitely-fresh-replacement-is-the-only-inequality-path
  edits:
    - { from: 'static boolean sameIdentity(Box left, Box right)', to: 'static boolean sameIdentity(Box left, Box right, boolean replace)' }
    - { from: 'return left == right;', to: 'Box alias = left; if (replace) { alias = new Box(); } return left != alias;' }
  expect:
    - path: [P, parameters]
      value: { left: { position: 0, type: Box }, right: { position: 1, type: Box }, replace: { position: 2, type: bool } }
    - { path: [R], value: replace }
- name: null-replacement-is-not-the-same-as-a-nonnull-input
  edits:
    - { from: 'static boolean sameIdentity(Box left, Box right)', to: 'static boolean sameIdentity(Box left, Box right, boolean replace)' }
    - { from: 'return left == right;', to: 'Box alias = left; if (replace) { alias = null; } return alias == left;' }
  expect:
    - path: [P, parameters]
      value: { left: { position: 0, type: Box }, right: { position: 1, type: Box }, replace: { position: 2, type: bool } }
    - { path: [R], value: 'NOT (replace)' }
- name: a-null-replacement-uses-the-original-input-nullability
  edits:
    - { from: 'static boolean sameIdentity(Box left, Box right)', to: 'static boolean sameIdentity(@normalizer.annotations.Nullable Box left, Box right, boolean replace)' }
    - { from: 'return left == right;', to: 'Box alias = left; if (replace) { alias = null; } return left == alias;' }
  expect:
    - path: [P, parameters]
      value: { left: { position: 0, type: 'Box?' }, right: { position: 1, type: Box }, replace: { position: 2, type: bool } }
    - { path: [R], value: 'left == null OR NOT (replace)' }
- name: a-local-conditional-reference-keeps-its-null-guard
  edits:
    - { from: 'static boolean sameIdentity(Box left, Box right)', to: 'static boolean sameIdentity(Box left, Box right, boolean replace)' }
    - { from: 'return left == right;', to: 'Box alias = left; if (replace) { alias = null; } return alias == null;' }
  expect:
    - path: [P, parameters]
      value: { left: { position: 0, type: Box }, right: { position: 1, type: Box }, replace: { position: 2, type: bool } }
    - { path: [R], value: replace }
- name: null-inequality-keeps-the-complement-of-the-real-branch
  edits:
    - { from: 'static boolean sameIdentity(Box left, Box right)', to: 'static boolean sameIdentity(Box left, Box right, boolean replace)' }
    - { from: 'return left == right;', to: 'Box alias = left; if (replace) { alias = null; } return null != alias;' }
  expect:
    - path: [P, parameters]
      value: { left: { position: 0, type: Box }, right: { position: 1, type: Box }, replace: { position: 2, type: bool } }
    - { path: [R], value: 'NOT (replace)' }
