- name: reverse-structural-comparison
  edits:
    - from: "return left.value == right.value;"
      to: "return right.value == left.value;"
- name: shift-right-value
  edits:
    - from: "return left.value == right.value;"
      to: "return left.value == right.value + 1;"
  expect:
    - path: [R]
      value: left.value == right.value + 1
