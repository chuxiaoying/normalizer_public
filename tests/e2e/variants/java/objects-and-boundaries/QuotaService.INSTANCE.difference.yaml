- name: retain-roots-through-local-aliases
  edits:
    - from: return quota.units - this.quota.units + adjustment;
      to: |-
        Quota entry = this.quota;
                Quota argument = quota;
                return adjustment + (argument.units - entry.units);
- name: reverse-quota-difference
  edits:
    - from: quota.units - this.quota.units + adjustment
      to: this.quota.units - quota.units + adjustment
  expect:
    - path: [R]
      value: adjustment + (E.quota.units - P.quota.units)
