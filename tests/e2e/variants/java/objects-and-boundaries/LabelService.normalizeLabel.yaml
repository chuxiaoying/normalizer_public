- name: trim-idempotence-on-null-and-text
  edits:
    - from: NormalizedText.trim(raw)
      to: NormalizedText.trim(NormalizedText.trim(raw))
- name: preserve-surrounding-nonblank-text
  edits:
    - from: NormalizedText.trim(raw)
      to: raw
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN blank(raw) THEN fallback
          ELSE raw
        END
- name: trim-literal-visible-text
  edits:
    - from: NormalizedText.trim(raw)
      to: 'NormalizedText.trim("  item  ")'
  expect:
    - path: [R]
      value: '"item"'

- name: unicode-blank-literal-uses-fallback
  edits:
    - from: NormalizedText.trim(raw)
      to: 'NormalizedText.trim(" ")'
  expect:
    - path: [R]
      value: fallback

- name: nonbreaking-space-literal-stays-visible
  edits:
    - from: NormalizedText.trim(raw)
      to: 'NormalizedText.trim(" ")'
  expect:
    - path: [R]
      value: '" "'

- name: null-literal-uses-fallback
  edits:
    - from: NormalizedText.trim(raw)
      to: NormalizedText.trim(null)
  expect:
    - path: [R]
      value: fallback

- name: empty-literal-uses-fallback
  edits:
    - from: NormalizedText.trim(raw)
      to: 'NormalizedText.trim("")'
  expect:
    - path: [R]
      value: fallback

- name: decode-escaped-whitespace
  edits:
    - from: NormalizedText.trim(raw)
      to: 'NormalizedText.trim("\sitem\040")'
  expect:
    - path: [R]
      value: '"item"'

- name: invalid-string-escape-rejects
  edits:
    - from: NormalizedText.trim(raw)
      to: 'NormalizedText.trim("\q")'
  reject: ['[SOURCE-PARSE-FAILED]', 'kind=PREPROCESS_REQUIRED', 'invalid Java literal escape']

- name: octal-literal-accepts-full-byte-range
  edits:
    - from: NormalizedText.trim(raw)
      to: 'NormalizedText.trim("\377")'
  expect:
    - path: [R]
      value: '"ÿ"'

- name: retains-cjk-and-supplementary-text
  edits:
    - from: NormalizedText.trim(raw)
      to: 'NormalizedText.trim("  上海🙂  ")'
  expect:
    - path: [R]
      value: '"上海🙂"'

- name: explicit-null-guard-uses-the-registered-blank-predicate
  edits:
    - { from: 'return NormalizedText.defaultIfBlank(', to: 'return raw == null ? fallback : NormalizedText.defaultIfBlank(' }
    - { from: 'NormalizedText.trim(raw)', to: raw }
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN blank(raw) THEN fallback
          ELSE raw
        END

- name: direct-null-first-argument-is-not-an-unbound-receiver
  edits:
    - { from: 'NormalizedText.trim(raw)', to: 'null' }
  expect:
    - { path: [R], value: fallback }

- name: null-in-dead-fallback-is-not-observed
  edits:
    - from: 'NormalizedText.trim(raw),'
      to: '"label",'
    - from: "            fallback\n"
      to: "            null\n"
  expect:
    - { path: [R], value: '"label"' }
