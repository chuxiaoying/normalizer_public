- name: increment-by-two
  edits:
    - from: "value = value + 1;"
      to: "value = value + 2;"
  expect:
    - path: [S, 0, write, value]
      value: value + 2
    - path: [R]
      value: value + 2
- name: return-old-state
  edits:
    - from: |-
        value = value + 1;
                return value;
      to: |-
        value = value + 1;
                return value - 1;
  expect:
    - path: [R]
      value: value
