- name: fixed-dispatch
  edits:
  - from: 'fixed ? new FixedFee() : new ScaledFee()'
    to: new FixedFee()
  expect:
  - path:
    - R
    value: value - 1
- name: scaled-dispatch
  edits:
  - from: 'fixed ? new FixedFee() : new ScaledFee()'
    to: new ScaledFee()
  expect:
  - path:
    - R
    value: value * 2
- name: top-level-java-allows-an-empty-declaration
  edits:
  - from: interface Fee
    to: ; interface Fee
- name: top-level-garbage-is-not-skipped
  edits:
  - from: interface Fee
    to: nonsense interface Fee
  reject:
  - '[SOURCE-PARSE-FAILED]'
  - expected class or interface declaration
- name: parameterized-interface-is-not-erased
  edits:
  - from: class FixedFee implements Fee
    to: class FixedFee implements Fee<String>
  reject:
  - '[SOURCE-PARSE-FAILED]'
  - generic supertype requires explicit preprocessing
- name: another-declared-interface-member-does-not-change-the-selected-call
  edits:
  - from: 'interface Fee { int apply(int value); }'
    to: 'interface Fee { int preview(int value); int apply(int value); }'
  - from: 'class FixedFee implements Fee {'
    to: 'class FixedFee implements Fee { public int preview(int value) { return 7; }'
  - from: 'class RateFee implements Fee {'
    to: 'class RateFee implements Fee { public int preview(int value) { return 8; }'
  - from: 'class ScaledFee implements Fee {'
    to: 'class ScaledFee implements Fee { public int preview(int value) { return 9; }'
- name: a-second-nominal-interface-is-not-the-selected-call
  edits:
    - from: 'class FixedFee implements Fee {'
      to: |-
        interface AuditedFee { int code(); }
        class FixedFee implements Fee, AuditedFee { public int code() { return 9; }
- name: a-closed-interface-default-body-requires-preprocessing
  edits:
    - from: 'interface Fee { int apply(int value); }'
      to: 'interface Fee { default int apply(int value) { return value + 10; } }'
  reject: ['[NORM-CLASS-SHAPE]', 'kind=PREPROCESS_REQUIRED', 'Fee']
