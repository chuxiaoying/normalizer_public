- name: fixed-dispatch
  edits:
  - from: 'fixed ? new FixedFee() : new ScaledFee()'
    to: new FixedFee()
  expect:
  - path:
    - R
    value: value - 1
- name: scaled-dispatch
  edits:
  - from: 'fixed ? new FixedFee() : new ScaledFee()'
    to: new ScaledFee()
  expect:
  - path:
    - R
    value: value * 2
- name: top-level-java-allows-an-empty-declaration
  edits:
  - from: interface Fee
    to: ; interface Fee
- name: top-level-garbage-is-not-skipped
  edits:
  - from: interface Fee
    to: nonsense interface Fee
  reject:
  - '[SOURCE-PARSE-FAILED]'
  - expected class or interface declaration
- name: parameterized-interface-keeps-the-closed-specialized-dispatch
  edits:
  - from: interface Fee {
    to: interface Fee<T> {
  - from: class FixedFee implements Fee {
    to: class FixedFee implements Fee<String> {
  - from: class RateFee implements Fee {
    to: class RateFee implements Fee<String> {
  - from: class ScaledFee implements Fee {
    to: class ScaledFee implements Fee<String> {
  - from: static int charge(Fee fee,
    to: static int charge(Fee<String> fee,
  - from: Fee fee =
    to: Fee<String> fee =
- name: another-declared-interface-member-does-not-change-the-selected-call
  edits:
  - from: interface Fee { int apply(int value); }
    to: interface Fee { int preview(int value); int apply(int value); }
  - from: class FixedFee implements Fee {
    to: class FixedFee implements Fee { public int preview(int value) { return 7; }
  - from: class RateFee implements Fee {
    to: class RateFee implements Fee { public int preview(int value) { return 8; }
  - from: class ScaledFee implements Fee {
    to: class ScaledFee implements Fee { public int preview(int value) { return 9; }
- name: a-second-nominal-interface-is-not-the-selected-call
  edits:
  - from: class FixedFee implements Fee {
    to: |-
      interface AuditedFee { int code(); }
      class FixedFee implements Fee, AuditedFee { public int code() { return 9; }
- name: closed-default-body-is-ordinary-native-dispatch
  edits:
  - from: interface Fee { int apply(int value); }
    to: interface Fee { default int apply(int value) { return value + 10; } }
  - from: class FixedFee implements Fee { public int apply(int value) { return value - 1; } }
    to: class FixedFee implements Fee {}
  expect:
  - path:
    - R
    value: CASE WHEN fixed THEN value + 10 ELSE value * 2 END
- name: repeated-condition-does-not-select-the-dead-implementation
  edits:
  - from: 'fixed ? new FixedFee() : new ScaledFee()'
    to: 'fixed ? (fixed ? new FixedFee() : new RateFee()) : new ScaledFee()'
- name: different-nominal-receivers-with-equal-pure-results-collapse
  edits:
  - from: return value - 1;
    to: return 7;
  - from: return value * 2;
    to: return 7;
  expect:
  - path:
    - R
    value: '7'

- name: one-explicit-override-resolves-two-interface-defaults
  edits:
    - from: 'interface Fee { int apply(int value); }'
      to: |-
        interface Fee { default int apply(int value) { return value + 10; } }
        interface AlternativeFee { default int apply(int value) { return value + 20; } }
    - {from: 'class FixedFee implements Fee {', to: 'class FixedFee implements Fee, AlternativeFee {'}
- name: ambiguous-defaults-cannot-be-resolved-by-interface-order
  edits:
    - from: 'interface Fee { int apply(int value); }'
      to: |-
        interface Fee { default int apply(int value) { return value + 10; } }
        interface AlternativeFee { default int apply(int value) { return value + 20; } }
    - from: 'class FixedFee implements Fee { public int apply(int value) { return value - 1; } }'
      to: 'class FixedFee implements AlternativeFee, Fee {}'
  reject: ['[NORM-CLASS-SHAPE]', 'FixedFee']
