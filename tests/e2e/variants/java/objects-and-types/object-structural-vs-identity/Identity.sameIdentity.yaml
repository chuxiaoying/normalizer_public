    to: static boolean sameIdentity(Box left, Box right, boolean chooseA, boolean chooseB)
  - from: return left == right;
    to: Box a = left; if (chooseA) { a = right; } Box b = left; if (chooseB) { b = right; } return b == a;
  expect:
