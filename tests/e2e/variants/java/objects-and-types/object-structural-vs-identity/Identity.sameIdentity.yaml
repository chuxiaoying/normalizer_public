- name: independent-guards-selecting-distinct-allocations-only-match-on-the-original
  edits:
  - from: static boolean sameIdentity(Box left, Box right)
    to: static boolean sameIdentity(@N.Nullable Box prior, boolean p, boolean q)
  - from: return left == right;
    to: Box x = new Box(); Box y = new Box(); Box a = prior; if (p) { a = x; } Box b = prior; if (q) { b = y; }
      return a == b;
  expect:
  - path:
    - P
    - parameters
    value:
      prior:
        position: 0
        type: Box?
      p:
        position: 1
        type: bool
      q:
        position: 2
        type: bool
  - path:
    - R
    value: NOT (p) AND NOT (q)
