- name: rename-fetch-method
  edits:
  - from: client.fetch(accountId)
    to: client.loadProfile(accountId)
  - from: Profile fetch(int accountId);
    to: Profile loadProfile(int accountId);
  expect:
  - path:
    - S
    - 0
    - call
    - external
    value: src/ProfileService.java#Beans.ENTRY.client.loadProfile
- name: shift-account-input
  edits:
  - from: client.fetch(accountId)
    to: client.fetch(accountId + 1)
  expect:
  - path:
    - S
    - 0
    - call
    - args
    - 0
    value: accountId + 1
