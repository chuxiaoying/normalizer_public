- name: rename-fold-bindings-without-changing-position-semantics
  edits:
  - from: opened from [] as (s, task)
    to: opened from [] as (running, member)
  - from: closed from stack as (s, task)
    to: closed from stack as (running, member)
  - from: value.push(s, task)
    to: value.push(running, member)
  - from: value.length(s)
    to: value.length(running)
  - from: value.last_or(s, task).id != task.id
    to: value.last_or(running, member).id != member.id
  - from: value.pop(s)
    to: value.pop(running)
- name: mismatched-field-is-not-a-valid-symmetric-position-test
  edits:
  - from: '!= task.id'
    to: '!= task.other'
  reject:
  - '[SOURCE-PARSE-FAILED]'
  - unbound local stack operand
- name: both-failure-guards-must-throw-the-same-type
  edits:
  - from: == 0 throw IllegalArgumentException
    to: == 0 throw IllegalStateException
  reject:
  - '[SOURCE-PARSE-FAILED]'
  - unbound local stack operand
- name: the-record-members-used-for-matching-must-be-integer
  edits:
  - from: int id
    to: boolean id
  reject:
  - '[NORM-PROJECT]'
  - local stack requires one declared integer field
- name: reusing-the-same-array-removes-only-the-length-error
  edits:
  - from: fold closed from stack
    to: fold opened from stack
  expect:
  - path:
    - R
    value: 'true'
  - path:
    - throws
    - 0
    - when
    value: EXISTS (SELECT 1 FROM indices(LENGTH(opened)) AS i WHERE opened[i].id != opened[LENGTH(opened) - 1 -
      i].id)
- name: stack-tracks-the-selected-integer-field
  edits:
  - from: int id
    to: int sequence
  - from: value.last_or(s, task).id != task.id
    to: value.last_or(s, task).sequence != task.sequence
  expect:
  - path:
    - types
    - Task
    - fields
    value:
      sequence: number
  - path:
    - throws
    - 0
    - when
    value: LENGTH(closed) > LENGTH(opened) or EXISTS (SELECT 1 FROM indices(LEAST(LENGTH(closed), LENGTH(opened)))
      AS i WHERE closed[i].sequence != opened[LENGTH(opened) - 1 - i].sequence)
- name: acquired-array-aliases-keep-original-position-roots
  edits:
  - from: static boolean complete(Task[] opened, Task[] closed) {
    to: static boolean complete(Task[] opened, Task[] closed) { Task[] incoming = opened; Task[] outgoing = closed;
  - from: fold opened from []
    to: fold incoming from []
  - from: fold closed from stack
    to: fold outgoing from stack
- name: unused-stack-result-does-not-suppress-failure
  edits:
  - from: return empty;
    to: return true;
  expect:
  - path:
    - R
    value: 'true'
- name: an-extra-record-field-does-not-change-stack-matching
  edits:
  - from: record Task(int id) {}
    to: record Task(int id, int rank) {}
  expect:
  - path:
    - types
    - Task
    - fields
    - rank
    add: number
- name: swapping-open-and-close-sources-reverses-the-failure-direction
  edits:
  - from: fold opened from []
    to: fold closed from []
  - from: fold closed from stack
    to: fold opened from stack
  expect:
  - path:
    - throws
    - 0
    - when
    value: LENGTH(closed) < LENGTH(opened) or EXISTS (SELECT 1 FROM indices(LEAST(LENGTH(closed), LENGTH(opened)))
      AS i WHERE opened[i].id != closed[LENGTH(closed) - 1 - i].id)
- name: the-same-field-name-does-not-certify-the-same-record-type
  edits:
  - from: record Task(int id) {}
    to: record Task(int id) {} record Completed(int id) {}
  - from: Task[] opened, Task[] closed
    to: Task[] opened, Completed[] closed
  reject:
  - '[NORM-PROJECT]'
  - local stack requires one declared integer field in the same input record type
