- name: add-one-on-read
  edits:
    - from: |-
        int read() {
                return value;
      to: |-
        int read() {
                return value + 1;
  expect:
    - path: [R]
      value: value + 1
- name: subtract-one-on-read
  edits:
    - from: |-
        int read() {
                return value;
      to: |-
        int read() {
                return value - 1;
  expect:
    - path: [R]
      value: value - 1
