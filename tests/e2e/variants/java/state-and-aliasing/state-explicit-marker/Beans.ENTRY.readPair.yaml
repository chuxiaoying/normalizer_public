- name: swap-read-and-declaration-order
  edits:
  - from: |-
      @N.EntryState Quota zebra;
          @N.EntryState Quota amber;
    to: |-
      @N.EntryState Quota amber;
          @N.EntryState Quota zebra;
  - from: zebra.units + amber.units
    to: amber.units + zebra.units
- name: noncommutative-state-difference-preserves-operands
  edits:
  - from: zebra.units + amber.units
    to: zebra.units - amber.units
  expect:
  - path:
    - R
    value: zebra.units - amber.units
- name: unrelated-nominal-records-with-the-same-field-retain-distinct-state-owners
  edits:
  - from: class Counter {
    to: |-
      class Reserve { int units; }
      class Counter {
  - from: '@N.EntryState Quota amber;'
    to: '@N.EntryState Reserve amber;'
  - from: ENTRY.amber = new Quota();
    to: ENTRY.amber = new Reserve();
  - from: return zebra.units + amber.units;
    to: zebra.units = 9; return amber.units;
  expect:
  - path:
    - S
    add:
    - write:
        target: zebra.units
        value: '9'
  - path:
    - R
    value: amber.units
