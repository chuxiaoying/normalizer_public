- name: remove-explicit-rollover
  edits:
    - from: "        if (current == 2147483647) return -2147483648;\n        return current + 1;"
      to: "        return current + 1;"
  expect:
    - path: [R]
      value: current + 1
- name: redundant-rollover-at-zero
  edits:
    - from: "current == 2147483647"
      to: "current == 0"
    - from: "return -2147483648;"
      to: "return 1;"
  expect:
    - path: [R]
      value: current + 1
