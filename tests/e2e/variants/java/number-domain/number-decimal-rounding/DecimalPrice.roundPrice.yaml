- name: round-to-three-places
  edits:
    - from: 'return N.round(value, 2, N.HALF_UP);'
      to: 'return N.round(value, 3, N.HALF_UP);'
  expect:
    - path: [R]
      value: 'ROUND(value, 3, "HALF_UP")'
- name: round-taxed-value
  edits:
    - from: 'return N.round(value, 2, N.HALF_UP);'
      to: 'BigDecimal factor; /* @normalizer-ir factor = 1.13 */ return N.round(N.multiply(value, factor), 2, N.HALF_UP);'
  expect:
    - path: [R]
      value: 'ROUND(value * 1.13, 2, "HALF_UP")'
- name: retain-unrounded-value
  edits:
    - from: 'return N.round(value, 2, N.HALF_UP);'
      to: 'return value;'
  expect:
    - path: [R]
      value: value
- name: explicit-half-even-at-other-precision
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'return N.round(value, 4, N.HALF_EVEN);'}]
  expect: [{path: [R], value: 'ROUND(value, 4, "HALF_EVEN")'}]
- name: positive-midpoint-half-up
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'BigDecimal exact; /* @normalizer-ir exact = 2.345 */ return N.round(exact, 2, N.HALF_UP);'}]
  expect: [{path: [R], value: '2.35'}]
- name: negative-midpoint-half-up
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'BigDecimal exact; /* @normalizer-ir exact = -2.345 */ return N.round(exact, 2, N.HALF_UP);'}]
  expect: [{path: [R], value: '-2.35'}]
- name: negative-midpoint-half-even
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'BigDecimal exact; /* @normalizer-ir exact = -2.345 */ return N.round(exact, 2, N.HALF_EVEN);'}]
  expect: [{path: [R], value: '-2.34'}]
- name: exact-carry-outside-binary64-precision
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'BigDecimal exact; /* @normalizer-ir exact = 9007199254740993.995 */ return N.round(exact, 2, N.HALF_UP);'}]
  expect: [{path: [R], value: '9007199254740994'}]
- name: midpoint-requires-a-source-mode
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'return N.round(value, 2);'}]
  reject: ['[NORM-SOURCE-TYPE]', 'kind=PREPROCESS_REQUIRED', 'N.round']

- name: exact-decimal-just-below-half-even-midpoint
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'BigDecimal exact; /* @normalizer-ir exact = 2.344999999999999999999999999999 */ return N.round(exact, 2, N.HALF_EVEN);'}]
  expect: [{path: [R], value: '2.34'}]
- name: exact-decimal-just-above-half-even-midpoint
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'BigDecimal exact; /* @normalizer-ir exact = 2.345000000000000000000000000001 */ return N.round(exact, 2, N.HALF_EVEN);'}]
  expect: [{path: [R], value: '2.35'}]
- name: half-even-midpoint-rounds-away-from-an-odd-neighbour
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'BigDecimal exact; /* @normalizer-ir exact = 2.355 */ return N.round(exact, 2, N.HALF_EVEN);'}]
  expect: [{path: [R], value: '2.36'}]
- name: constant-product-and-no-op-round-retain-exact-value
  edits: [{from: 'return N.round(value, 2, N.HALF_UP);', to: 'BigDecimal left; BigDecimal right; /* @normalizer-ir left = 1.25 */ /* @normalizer-ir right = 2.5 */ return N.round(N.multiply(left, right), 4, N.HALF_EVEN);'}]
  expect: [{path: [R], value: '3.125'}]
