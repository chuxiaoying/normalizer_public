- name: guard-one-does-not-protect-zero
  edits:
    - {from: 'divisor == 0', to: 'divisor == 1'}
  expect:
    - {path: [R], value: 'CASE WHEN divisor == 1 THEN 0 ELSE 1 END'}
    - path: [throws]
      add: [{type: java.lang.ArithmeticException, when: 'divisor == 0'}]
- name: negative-fallback
  edits:
    - {from: 'return 0;', to: 'return -1;'}
  expect:
    - {path: [R], value: 'CASE WHEN divisor == 0 THEN -1 ELSE 1 END'}
