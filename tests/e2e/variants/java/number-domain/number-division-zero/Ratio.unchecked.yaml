- name: catch-the-zero-divisor-on-the-same-path
  edits:
    - from: |-
        static int unchecked(int divisor) {
                return divisor / divisor;
      to: |-
        static int unchecked(int divisor) {
                try {
                    return divisor / divisor;
                } catch (ArithmeticException ignored) {
                    return -1;
                }
  expect:
    - {path: [R], value: "CASE\n  WHEN divisor == 0 THEN -1\n  ELSE 1\nEND"}
    - {path: [throws], absent: true}

- name: remainder-of-a-value-by-itself-keeps-the-zero-divisor-exception
  edits:
    - from: |-
        static int unchecked(int divisor) {
                return divisor / divisor;
      to: |-
        static int unchecked(int divisor) {
                return divisor % divisor;
  expect:
    - {path: [R], value: '0'}
