- name: change-first-row-priority
  edits:
    - from: order by b.priority, b.due_date, b.id
      to: order by b.due_date, b.priority, b.id
  expect:
    - path: [R]
      value: |-
        COALESCE(
          (
            SELECT bill.amount
            FROM bill
            WHERE bill.account_id = :accountId
              AND bill.due_date <= :today
              AND bill.amount > 0
              AND bill.status = 'OPEN'
            ORDER BY bill.due_date, bill.priority, bill.id
            LIMIT 1
          ),
          0
        )
- name: empty-selection-default
  edits:
    - from: 'return 0;'
      to: 'return -7;'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          (
            SELECT bill.amount
            FROM bill
            WHERE bill.account_id = :accountId
              AND bill.due_date <= :today
              AND bill.amount > 0
              AND bill.status = 'OPEN'
            ORDER BY bill.priority, bill.due_date, bill.id
            LIMIT 1
          ),
          -7
        )
