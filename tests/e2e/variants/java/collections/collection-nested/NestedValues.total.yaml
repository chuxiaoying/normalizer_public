- name: add-one-per-value
  edits:
    - from: 'yield value'
      to: 'yield value + 1'
  expect:
    - path: [R]
      value: COALESCE(SUM(SELECT COALESCE(SUM(SELECT value + 1 FROM grp AS value), 0) FROM groups AS grp), 0)
- name: filter-positive-values
  edits:
    - from: 'yield value'
      to: 'where value > 0 yield value'
  expect:
    - path: [R]
      value: COALESCE(SUM(SELECT COALESCE(SUM(SELECT value FROM grp AS value WHERE value > 0), 0) FROM groups AS grp), 0)
- name: distinct-inner-scope
  edits:
    - from: 'int total(int[][] groups)'
      to: 'int total(int[][] groups, int value)'
    - from: 'sum from group as value yield value'
      to: 'sum from group as item yield item - value'
  expect:
    - path: [P, parameters]
      value:
        groups: {position: 0, type: 'number[][]'}
        value: {position: 1, type: number}
    - path: [R]
      value: COALESCE(SUM(SELECT COALESCE(SUM(SELECT value_ - value FROM grp AS value_), 0) FROM groups AS grp), 0)
- name: invalid-uncorrelated-inner-source
  edits:
    - from: 'sum from group as value'
      to: 'sum from groups as value'
  reject: ['[SOURCE-PARSE-FAILED]', 'kind=PREPROCESS_REQUIRED', 'nested sum requires a scalar sum from the outer row']

- name: nested-sum-accumulates-into-initial-seven
  edits:
    - {from: 'int total;', to: 'int total = 7;'}
    - {from: 'total = sum from groups', to: 'total += sum from groups'}
  expect:
    - path: [R]
      value: COALESCE(SUM(SELECT COALESCE(SUM(SELECT value FROM grp AS value), 0) FROM groups AS grp), 0) + 7

- name: external-parameter-cannot-be-captured-by-outer-generated-alias
  edits:
    - {from: 'int total(int[][] groups)', to: 'int total(int[][] groups, int grp)'}
    - {from: 'yield sum from group as value yield value', to: 'yield sum from group as value yield value - grp'}
  expect:
    - {path: [P, parameters, grp], add: {position: 1, type: number}}
    - path: [R]
      value: COALESCE(SUM(SELECT COALESCE(SUM(SELECT value - grp FROM grp_ AS value), 0) FROM groups AS grp_), 0)

- name: inner-filter-may-empty-every-group
  edits:
    - {from: 'sum from group as value yield value', to: 'sum from group as value where false yield value'}
  expect:
    - {path: [R], value: '0'}

- name: inner-filter-retains-its-own-rows-before-summing
  edits:
    - {from: 'sum from group as value yield value', to: 'sum from group as value where value > 0 and value < 5 yield value'}
  expect:
    - path: [R]
      value: COALESCE(SUM(SELECT COALESCE(SUM(SELECT value FROM grp AS value WHERE value < 5 AND value > 0), 0) FROM groups AS grp), 0)

- name: zero-initialized-nested-accumulation-preserves-the-correlated-sum
  edits:
    - {from: 'int total;', to: 'int total = 0;'}
    - {from: 'total = sum from groups', to: 'total += sum from groups'}

- name: nested-sum-adds-a-signed-initial-product-once
  edits:
    - {from: 'int total(int[][] groups)', to: 'int total(int[][] groups, int base, int multiplier)'}
    - {from: 'int total;', to: 'int total = base * multiplier;'}
    - {from: 'total = sum from groups', to: 'total += sum from groups'}
  expect:
    - {path: [P, parameters, base], add: {position: 1, type: number}}
    - {path: [P, parameters, multiplier], add: {position: 2, type: number}}
    - path: [R]
      value: base * multiplier + COALESCE(SUM(SELECT COALESCE(SUM(SELECT value FROM grp AS value), 0) FROM groups AS grp), 0)

- name: additive-initializer-keeps-both-non-additive-terms
  edits:
    - {from: 'int total(int[][] groups)', to: 'int total(int[][] groups, int base, int offset)'}
    - {from: 'int total;', to: 'int total = base * 2 + offset * 3;'}
    - {from: 'total = sum from groups', to: 'total += sum from groups'}
  expect:
    - {path: [P, parameters, base], add: {position: 1, type: number}}
    - {path: [P, parameters, offset], add: {position: 2, type: number}}
    - path: [R]
      value: base * 2 + offset * 3 + COALESCE(SUM(SELECT COALESCE(SUM(SELECT value FROM grp AS value), 0) FROM groups AS grp), 0)

- name: acquired-request-field-and-fixed-offset-each-contribute-once
  edits:
    - {from: 'class NestedValues {', to: 'class RequestOffset { int offset; } class NestedValues {'}
    - {from: 'int total(int[][] groups)', to: 'int total(int[][] groups, RequestOffset request)'}
    - {from: 'int total;', to: 'int total = request.offset + 7;'}
    - {from: 'total = sum from groups', to: 'total += sum from groups'}
  expect:
    - {path: [P, parameters, request], add: {position: 1, type: RequestOffset}}
    - {path: [types], add: {RequestOffset: {fields: {offset: number}}}}
    - path: [R]
      value: request.offset + COALESCE(SUM(SELECT COALESCE(SUM(SELECT value FROM grp AS value), 0) FROM groups AS grp), 0) + 7
