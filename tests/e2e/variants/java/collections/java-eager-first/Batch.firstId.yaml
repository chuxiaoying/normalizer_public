- name: changing-private-query-and-array-names-keeps-the-same-path
  edits:
  - from: int[] ids;
    to: int[] projected;
  - from: ids = from rows as row yield row.ticket.id
    to: projected = from rows as candidate yield candidate.ticket.id
  - from: return ids[0];
    to: return projected[0];
- name: even-an-unused-result-still-checks-all-rows
  edits:
  - from: return ids[0];
    to: return 7;
  expect:
  - path:
    - R
    value: '7'
  - path:
    - throws
    value:
    - type: java.lang.NullPointerException
      when: EXISTS (SELECT 1 FROM rows AS r WHERE r.ticket IS NULL)
- name: a-second-index-is-not-silently-replaced-by-first
  edits:
  - from: return ids[0];
    to: return ids[1];
  expect:
  - path: [R]
    value: "(SELECT r.ticket.id FROM rows AS r)[1]"
  - path: [throws, 0, when]
    value: 'LENGTH(rows) <= 1 and NOT (EXISTS (SELECT 1 FROM rows AS r WHERE r.ticket IS NULL))'
- name: missing-nullability-contract-is-not-treated-as-eager-null-check
  edits:
  - from: '@N.Nullable Ticket ticket;'
    to: Ticket ticket;
  reject:
  - '[NORM-PROJECT]'
  - eager projection member requires an explicit nullable record declaration
- name: ordinary-dereference-is-not-covered-by-eager-projection-proof
  edits:
  - from: firstId(Row[] rows)
    to: firstId(Row[] rows, Row extra)
  - from: return ids[0];
    to: return extra.ticket.id;
  expect:
  - path: [P, parameters, extra]
    add: { position: 1, type: Row }
  - path: [R]
    value: extra.ticket.id
  - path: [throws]
    value:
    - type: java.lang.NullPointerException
      when: EXISTS (SELECT 1 FROM rows AS r WHERE r.ticket IS NULL) or extra.ticket == null
- name: a-typed-row-array-alias-preserves-source-and-eager-checks
  edits:
    - {from: 'int[] ids;', to: 'Row[] same = rows; int[] ids;'}
    - {from: 'ids = from rows as row yield row.ticket.id', to: 'ids = from same as row yield row.ticket.id'}
