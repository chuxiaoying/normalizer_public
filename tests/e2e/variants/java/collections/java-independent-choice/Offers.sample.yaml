- name: private-record-variable-does-not-change-its-occurrence
  edits:
  - from: Offer first;
    to: Offer quote;
  - from: first = choose from offers
    to: quote = choose from offers
  - from: first.code, first.price
    to: quote.code, quote.price
- name: returning-the-second-price-uses-the-second-occurrence
  edits:
  - from: first.code, first.price, second.code
    to: first.code, second.price, second.code
  expect:
  - path:
    - R
    value: "{\n  firstCode: $t_0.code,\n  firstPrice: $t_1.price,\n  secondCode: $t_1.code\n}"
- name: selected-record-is-not-a-mutable-heap-reference
  edits:
  - from: return new Pick
    to: first.price = 9; return new Pick
  reject:
  - '[NORM-PROJECT]'
  - field write requires a closed source object
- name: integer-is-not-a-record-fallback
  edits:
  - from: first = choose from offers else backup
    to: first = choose from offers else 1
  reject:
  - '[NORM-PROJECT]'
  - record choice needs a same-type record parameter fallback
- name: selected-record-content-does-not-certify-reference-equality
  edits:
  - from: first.price, second.code
    to: 'first == second ? first.price : second.price, second.code'
  reject:
  - '[NORM-PROJECT]'
  - member choice record has content but no Java reference identity
- name: nonnullable-text-result-cannot-publish-a-missing-constructor-field
  edits:
  - from: this.firstCode = firstCode;
    to: ''
  reject:
  - '[NORM-PROJECT]'
  - nonnullable record text field was not initialized
- name: record-choice-retains-the-boolean-domain-of-its-declared-row
  edits:
    - {from: 'class Offer { String code; int price; }', to: 'class Offer { String code; int price; boolean available; }'}
  expect:
    - {path: [types, Offer, fields, available], value: bool}
- name: borrowed-record-alias-preserves-the-public-choice-fallback
  edits:
    - {from: 'Offer first;', to: 'Offer same = backup; Offer first;'}
    - {from: 'first = choose from offers else backup', to: 'first = choose from offers else same'}
