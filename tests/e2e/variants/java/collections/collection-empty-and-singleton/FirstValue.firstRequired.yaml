- name: same-ordered-array-through-local-alias
  edits:
    - from: 'return values[0];'
      to: 'int[] ordered = values; return ordered[0];'
- name: nonzero-index-is-not-the-first-element
  edits:
    - from: 'return values[0];'
      to: 'return values[1];'
  expect:
    - path: [R]
      value: 'values[1]'
    - path: [throws, 0, when]
      value: 'LENGTH(values) <= 1'

- name: borrowed-array-length-through-local-alias
  edits:
    - from: 'return values[0];'
      to: 'int[] ordered = values; return ordered.length;'
  expect:
    - path: [R]
      value: LENGTH(values)
    - path: [throws]
      absent: true

- name: borrowed-array-length-after-an-earlier-scalar-parameter
  edits:
    - from: 'firstRequired(int[] values)'
      to: 'firstRequired(int earlier, int[] values)'
    - from: 'return values[0];'
      to: 'int[] ordered = values; return ordered.length;'
  expect:
    - path: [P, parameters]
      value: { earlier: { position: 0, type: number }, values: { position: 1, type: 'number[]' } }
    - path: [R]
      value: LENGTH(values)
    - path: [throws]
      absent: true

- name: ordinary-record-length-field-is-not-array-cardinality
  edits:
    - from: 'class FirstValue {'
      to: |-
        class Box {
            int length;
            Box(int value) { this.length = value; }
        }

        class FirstValue {
    - from: 'return values[0];'
      to: 'Box box = new Box(7); return box.length;'
  expect:
    - path: [R]
      value: '7'
    - path: [throws]
      absent: true

- name: length-observed-in-helper-still-belongs-to-original-array
  edits:
    - from: 'class FirstValue {'
      to: 'class FirstValue { static int extent(int[] items) { return items.length; }'
    - { from: 'return values[0];', to: 'return extent(values);' }
  expect:
    - { path: [R], value: 'LENGTH(values)' }
    - { path: [throws], absent: true }

- name: a-long-array-alias-observes-length-without-reading-an-element
  edits:
    - { from: 'firstRequired(int[] values)', to: 'firstRequired(long[] values)' }
    - { from: 'return values[0];', to: 'long[] ordered = values; return ordered.length;' }
  expect:
    - { path: [R], value: 'LENGTH(values)' }
    - { path: [throws], absent: true }

- name: a-short-array-length-is-the-same-business-cardinality
  edits:
    - { from: 'firstRequired(int[] values)', to: 'firstRequired(short[] values)' }
    - { from: 'return values[0];', to: 'return values.length;' }
  expect:
    - { path: [R], value: 'LENGTH(values)' }
    - { path: [throws], absent: true }

- name: first-comparison-keeps-the-throw-before-reading-the-maximum
  edits:
    - {from: 'firstRequired(int[] values)', to: 'firstRequired(int[] values, int threshold)'}
    - {from: 'return values[0];', to: 'int first = values[0]; return first > threshold ? first : threshold;'}
  expect:
    - path: [P, parameters]
      value: { values: { position: 0, type: 'number[]' }, threshold: { position: 1, type: number } }
    - path: [R]
      value: |-
        CASE
          WHEN threshold > FIRST(value FROM values) THEN threshold
          ELSE FIRST(value FROM values)
        END

- name: same-maximum-with-opposite-comparison-direction
  edits:
    - {from: 'firstRequired(int[] values)', to: 'firstRequired(int[] values, int threshold)'}
    - {from: 'return values[0];', to: 'int first = values[0]; return threshold > first ? threshold : first;'}
  expect:
    - path: [P, parameters]
      value: { values: { position: 0, type: 'number[]' }, threshold: { position: 1, type: number } }
    - path: [R]
      value: |-
        CASE
          WHEN threshold > FIRST(value FROM values) THEN threshold
          ELSE FIRST(value FROM values)
        END
