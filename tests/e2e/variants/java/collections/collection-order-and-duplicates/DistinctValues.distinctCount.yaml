- name: distinct-nonnegative-values
  edits:
    - from: 'count distinct from values as value'
      to: 'count distinct from values as value where value >= 0'
  expect:
    - path: [R]
      value: COUNT(DISTINCT value FROM values WHERE value >= 0)
- name: preserve-all-values
  edits:
    - from: 'count distinct from values as value'
      to: 'count from values as value'
  expect:
    - path: [R]
      value: COUNT(value FROM values)
- name: all-values-filtered-out-by-constant
  edits:
    - from: 'count distinct from values as value'
      to: 'count distinct from values as value where false'
  expect:
    - path: [R]
      value: "0"
- name: every-value-accepted-by-constant
  edits:
    - from: 'count distinct from values as value'
      to: 'count distinct from values as value where true'
- name: integer-is-not-a-boolean-filter
  edits:
    - from: 'count distinct from values as value'
      to: 'count distinct from values as value where 0'
  reject: ['[NORM-PROJECT]', 'kind=PREPROCESS_REQUIRED', 'where requires bool']
