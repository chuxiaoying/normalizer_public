- name: change-second-code
  edits:
    - from: 'if (code == 2) return 20;'
      to: 'if (code == 2) return 30;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN code == 1 THEN 10
          WHEN code == 2 THEN 30
          ELSE 0
        END
- name: change-default
  edits:
    - from: 'return 0;'
      to: 'return 1;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN code == 1 THEN 10
          WHEN code == 2 THEN 20
          ELSE 1
        END

- name: unprepared-switch
  edits:
    - from: 'if (code == 1) return 10;'
      to: 'switch (code) { case 1: return 10; }'
  reject: ['[SOURCE-PARSE-FAILED]', 'kind=PREPROCESS_REQUIRED', 'switch requires explicit preprocessing']
