- name: missing-key-does-not-observe-the-null-of-another-key
  edits:
    - from: 'map_get_or(captions, "main", fallback)'
      to: 'map_get_or(captions, "different", fallback)'
  expect:
    - path: [R]
      value: fallback
- name: explicit-null-overwrites-a-present-title
  edits:
    - from: 'if (cleared) {'
      to: '/* @normalizer-ir captions = value.map_put(captions, "main", "queued") */ if (cleared) {'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN NOT (cleared) THEN "queued"
          ELSE null
        END
- name: inserting-into-the-other-branch-keeps-the-absence-distinction
  edits:
    - from: 'if (cleared) {'
      to: 'if (cleared) { } else {'
  expect:
    - path: [R]
      value: 'CASE WHEN cleared THEN fallback ELSE null END'
- name: acquired-text-is-a-value-not-a-map-key
  edits:
    - from: 'map_put(captions, "main", null)'
      to: 'map_put(captions, "main", fallback)'
    - from: 'map_get_or(captions, "main", fallback)'
      to: 'map_get_or(captions, "main", "missing")'
  expect:
    - path: [R]
      value: 'CASE WHEN cleared THEN fallback ELSE "missing" END'
- name: local-map-update-never-creates-an-alias
  edits:
    - from: 'captions = value.map_put'
      to: 'another = value.map_put'
  reject: ['local map update cannot alias to another binding']
- name: nullable-result-needs-an-explicit-return-contract
  edits:
    - from: '@normalizer.annotations.Nullable'
      to: ''
  reject: ['local map text result must declare a nullable return']
- name: ordinary-java-assignment-cannot-rewrite-local-map-identity
  edits:
    - from: 'if (cleared) {'
      to: 'captions = captions; if (cleared) {'
  reject: ['local map binding cannot be reassigned as a Java alias']
- name: symbolic-map-key-is-not-treated-as-a-literal-key
  edits:
    - from: 'map_put(captions, "main", null)'
      to: 'map_put(captions, fallback, null)'
  reject: ['local map key must be a text literal']
- name: inversion-with-swapped-effects-keeps-the-same-null-case
  edits:
    - from: 'if (cleared) {'
      to: 'if (!cleared) { } else {'
