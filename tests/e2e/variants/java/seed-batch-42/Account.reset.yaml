- name: null-read-before-write-prevents-the-same-write
  edits:
    - from: |-
        quota.units = 7;
                return observer.units;
      to: |-
        int prior = observer.units;
                quota.units = 7;
                return observer == quota ? 7 : prior;
  expect:
    - { path: [S, 0], value: { write: { target: quota.units, value: '7', when: 'observer != null' } } }
- name: changed-amount-reaches-the-other-reference-only-when-it-aliases
  edits:
    - from: 'quota.units = 7;'
      to: 'quota.units = 11;'
  expect:
    - { path: [S, 0, write, value], value: '11' }
    - path: [R]
      value: |-
        CASE
          WHEN observer == quota THEN 11
          ELSE observer.units
        END
- name: source-parameter-is-not-the-declared-write-root
  edits:
    - from: 'quota.units = 7;'
      to: 'observer.units = 7;'
  reject: ['observable mutation of an input object requires a state write']
- name: local-reference-to-state-uses-the-same-write-target
  edits:
    - from: 'quota.units = 7;'
      to: 'Quota written = quota; written.units = 7;'
- name: reads-from-state-itself-use-the-recent-value
  edits:
    - from: 'return observer.units;'
      to: 'return quota.units;'
  expect:
    - { path: [R], value: '7' }
    - { path: [throws], absent: true }
- name: fresh-object-does-not-alias-entry-state-or-erase-its-write
  edits:
    - { from: 'return observer.units;', to: 'Quota fresh = new Quota(); return quota == fresh ? 1 : 2;' }
  expect:
    - { path: [R], value: '2' }
    - { path: [throws], absent: true }
- name: nullable-marker-with-empty-parentheses-keeps-the-same-contract
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable() ' }
- name: a-comment-does-not-count-as-a-marker-argument
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable(/* marker only */) ' }
- name: annotation-comma-is-not-an-empty-marker
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable(,) ' }
  reject: ['unsupported source parameter annotation normalizer.annotations.Nullable']
- name: marker-does-not-treat-quoted-commas-as-missing-arguments
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable(reason="审核,(参数)") ' }
  reject: ['unsupported source parameter annotation normalizer.annotations.Nullable']
- name: repeated-nullable-markers-do-not-become-a-double-nullable-type
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable @normalizer.annotations.Nullable ' }
  reject: ['Account.reset.observer:', 'multiple source parameter annotations cannot define nullability']
- name: illegal-annotation-on-an-unused-helper-is-not-ignored
  edits:
    - from: 'class Account {'
      to: 'class Account { static int helper(@normalizer.annotations.Nullable int amount) { return amount; }'
  reject: ['Account.helper.amount:', 'unsupported source parameter annotation normalizer.annotations.Nullable']
- name: escaped-marker-requires-lexical-preprocessing-before-source-analysis
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.\u004eullable ' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-UNICODE-ESCAPE]', 'expand raw Java Unicode escapes before parsing']

- name: catching-null-uses-the-type-and-preserves-the-prior-write
  edits:
    - from: 'return observer.units;'
      to: 'try { return observer.units; } catch (NullPointerException ignored) { return 11; }'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN observer != null AND observer == quota THEN 7
          WHEN observer == null THEN 11
          ELSE observer.units
        END
    - { path: [throws], absent: true }
- name: an-unrelated-builtin-catch-keeps-the-actual-throw
  edits:
    - from: 'return observer.units;'
      to: 'try { return observer.units; } catch (IndexOutOfBoundsException ignored) { return 99; }'
