- name: null-read-before-write-prevents-the-same-write
  edits:
    - from: |-
        quota.units = 7;
                return observer.units;
      to: |-
        int prior = observer.units;
                quota.units = 7;
                return observer == quota ? 7 : prior;
  expect:
    - { path: [S, 0], value: { write: { target: quota.units, value: '7', when: 'observer != null' } } }
- name: changed-amount-reaches-the-other-reference-only-when-it-aliases
  edits:
    - from: 'quota.units = 7;'
      to: 'quota.units = 11;'
  expect:
    - { path: [S, 0, write, value], value: '11' }
    - path: [R]
      value: |-
        CASE
          WHEN observer == quota THEN 11
          ELSE observer.units
        END
- name: source-parameter-is-not-the-declared-write-root
  edits:
    - from: 'quota.units = 7;'
      to: 'observer.units = 7;'
  reject: ['observable mutation of an input object requires a state write']
- name: local-reference-to-state-uses-the-same-write-target
  edits:
    - from: 'quota.units = 7;'
      to: 'Quota written = quota; written.units = 7;'
- name: reads-from-state-itself-use-the-recent-value
  edits:
    - from: 'return observer.units;'
      to: 'return quota.units;'
  expect:
    - { path: [R], value: '7' }
    - { path: [throws], absent: true }
- name: fresh-object-does-not-alias-entry-state-or-erase-its-write
  edits:
    - { from: 'return observer.units;', to: 'Quota fresh = new Quota(); return quota == fresh ? 1 : 2;' }
  expect:
    - { path: [R], value: '2' }
    - { path: [throws], absent: true }
- name: nullable-marker-with-empty-parentheses-keeps-the-same-contract
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable() ' }
- name: a-comment-does-not-count-as-a-marker-argument
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable(/* marker only */) ' }
- name: annotation-comma-is-not-an-empty-marker
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable(,) ' }
  reject: ['unsupported source parameter annotation normalizer.annotations.Nullable']
- name: marker-does-not-treat-quoted-commas-as-missing-arguments
  edits:
    - { from: '@normalizer.annotations.Nullable ', to: '@normalizer.annotations.Nullable(reason="审核,(参数)") ' }
  reject: ['unsupported source parameter annotation normalizer.annotations.Nullable']
