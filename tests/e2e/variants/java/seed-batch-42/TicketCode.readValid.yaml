- name: an-identifier-that-starts-with-a-keyword-is-not-reserved
  edits:
    - { from: 'booleanValue', to: 'returnValue' }
- name: constant-false-does-not-encounter-a-native-call
  edits:
    - { from: 'return value;', to: 'if (false) return booleanValue(); return value;' }
- name: reaching-a-native-call-without-external-contract-panics
  edits:
    - { from: 'return value;', to: 'int result = booleanValue(); return result;' }
  reject: ['panicked', '[NORM-OUT-OF-SOURCE]', 'target=TicketCode.booleanValue']
- name: a-native-method-cannot-pretend-to-provide-a-java-body
  edits:
    - { from: 'booleanValue();', to: 'booleanValue() { return 5; }' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-NATIVE-DECLARATION]', 'requires a semicolon']
- name: unmarked-bodyless-class-method-is-not-a-native-declaration
  edits:
    - { from: 'static native int', to: 'static int' }
  reject: ['[NORM-MISSING-BODY]', 'TicketCode.booleanValue']
- name: contradictory-modifiers-cannot-hide-an-illegal-declaration
  edits:
    - { from: 'static native int', to: 'static abstract native int' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-NATIVE-DECLARATION]', 'incompatible native method modifier']
- name: a-reached-native-call-in-a-return-uses-the-same-kernel-failure
  edits:
    - { from: 'return value;', to: 'return booleanValue();' }
  reject: ['panicked', '[NORM-OUT-OF-SOURCE]', 'target=TicketCode.booleanValue']
- name: missing-parameter-name-is-not-a-zero-argument-method
  edits:
    - { from: 'static int readValid(int value) { return value; }', to: 'static int readValid(int) { return 7; }' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-PARAMETER]', 'expected a parameter name']
- name: trailing-comma-does-not-disappear-from-a-parameter-list
  edits:
    - { from: 'int readValid(int value)', to: 'int readValid(int value,)' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-PARAMETER]', 'expected a parameter type']
- name: varargs-cannot-precede-another-parameter
  edits:
    - { from: 'int readValid(int value)', to: 'int readValid(int... values, int value)' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-PARAMETER]', 'varargs must be the final parameter']
- name: duplicate-names-do-not-create-one-parameter
  edits:
    - { from: 'int readValid(int value)', to: 'int readValid(int value, int value)' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-PARAMETER]', 'reserved or duplicate parameter name']
- name: each-named-parameter-survives-a-comment-and-final
  edits:
    - { from: 'int readValid(int value)', to: 'int readValid(final /* input */ int value)' }
- name: empty-import-is-not-dropped
  edits:
    - { from: 'class TicketCode {', to: 'import ; class TicketCode {' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-IMPORT]', 'expected a qualified import name']
- name: import-statement-requires-its-own-semicolon
  edits:
    - { from: 'class TicketCode {', to: 'import java.util.List class TicketCode {' }
  reject: ['[SOURCE-PARSE-FAILED]', '[JAVA-IMPORT]', 'expected semicolon']
- name: a-closed-source-contract-does-not-infer-wildcard-imports
  edits:
    - { from: 'class TicketCode {', to: 'import java.util.*; class TicketCode {' }
  reject: ['[NORM-CLASS-SHAPE]', 'TicketCode']
- name: a-closed-source-contract-does-not-infer-static-imports
  edits:
    - { from: 'class TicketCode {', to: 'import static java.lang.Math.abs; class TicketCode {' }
  reject: ['[NORM-CLASS-SHAPE]', 'TicketCode']
- name: comments-between-qualified-import-components-keep-the-explicit-type
  edits:
    - { from: 'class TicketCode {', to: 'import java.util /* explicit type */ . List; class TicketCode {' }
