- name: count-present-memo
  edits:
    - from: 'row.memo IS NULL'
      to: 'row.memo IS NOT NULL'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == accountId
              AND bill.memo IS NOT NULL
          ),
          0
        )
- name: shift-account-filter
  edits:
    - from: 'b.account_id == accountId'
      to: 'b.account_id == accountId + 1'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == accountId + 1
              AND bill.memo IS NULL
          ),
          0
        )
- name: reject-unadmitted-three-valued-disjunction
  edits:
    - from: 'row.memo IS NULL'
      to: 'row.memo == "x" OR row.memo != "x"'
  reject: ['[SOURCE-PARSE-FAILED]', 'kind=PREPROCESS_REQUIRED', 'OR is not supported in local relation predicates']

- name: filtered-row-count-cannot-be-negative
  edits:
    - { from: 'return count;', to: 'if (0 > count) return 99; return count;' }
- name: known-empty-row-count-reaches-the-zero-guard
  edits:
    - { from: 'where b.account_id == accountId', to: 'where b.account_id == accountId and false' }
    - { from: 'return count;', to: 'if (count == 0) return 99; return count;' }
  expect:
    - { path: [R], value: '99' }
- name: lowercase-sql-null-is-the-same-predicate
  edits:
    - { from: 'row.memo IS NULL', to: 'row.memo is null' }

- name: acquired-count-cannot-be-at-most-minus-one
  edits:
    - { from: 'return count;', to: 'return count <= -1 ? 7 : 11;' }
  expect:
    - { path: [R], value: '11' }

- name: acquired-count-is-never-minus-one
  edits:
    - { from: 'return count;', to: 'return count != -1 ? 7 : 11;' }
  expect:
    - { path: [R], value: '7' }

- name: acquired-count-is-at-least-zero
  edits:
    - { from: 'return count;', to: 'return count >= 0 ? 7 : 11;' }
  expect:
    - { path: [R], value: '7' }

- name: unknown-signed-offset-does-not-inherit-count-floor
  edits:
    - { from: 'static int missingMemoCount(', to: 'static boolean missingMemoCount(' }
    - { from: 'return count;', to: 'return accountId + count >= 0;' }
  expect:
    - { path: [entry, returns], value: bool }
    - path: [R]
      value: |-
        accountId + COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == accountId
              AND bill.memo IS NULL
          ),
          0
        ) >= 0

- name: a-local-alias-of-a-request-field-still-belongs-to-the-request
  edits:
    - from: 'class NullMemoService {'
      to: |-
        class MemoFilter { int accountId; }
        class NullMemoService {
    - from: 'static int missingMemoCount(int accountId) {'
      to: |-
        static int missingMemoCount(MemoFilter request) {
                int accountId = request.accountId;
  expect:
    - path: [types]
      add:
        MemoFilter: {fields: {accountId: number}}
    - path: [P, parameters]
      value:
        request: {position: 0, type: MemoFilter}
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == request.accountId
              AND bill.memo IS NULL
          ),
          0
        )

- name: lowercase-sql-not-null-keeps-the-same-predicate
  edits:
    - {from: 'row.memo IS NULL', to: 'row.memo is not null'}
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == accountId
              AND bill.memo IS NOT NULL
          ),
          0
        )
- name: acquired-count-is-strictly-greater-than-minus-one
  edits:
    - {from: 'return count;', to: 'return count > -1 ? 7 : 11;'}
  expect:
    - {path: [R], value: '7'}
- name: one-plus-the-acquired-count-cannot-equal-zero
  edits:
    - {from: 'return count;', to: 'return 1 + count == 0 ? 7 : 11;'}
  expect:
    - {path: [R], value: '11'}

- name: nonnegative-count-keeps-less-than-three
  edits:
    - {from: 'static int missingMemoCount(', to: 'static boolean missingMemoCount('}
    - {from: 'return count;', to: 'return count < 3;'}
  expect:
    - {path: [entry, returns], value: bool}
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == accountId
              AND bill.memo IS NULL
          ),
          0
        ) < 3

- name: nonnegative-count-keeps-greater-than-three
  edits:
    - {from: 'static int missingMemoCount(', to: 'static boolean missingMemoCount('}
    - {from: 'return count;', to: 'return count > 3;'}
  expect:
    - {path: [entry, returns], value: bool}
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == accountId
              AND bill.memo IS NULL
          ),
          0
        ) > 3

- name: nonnegative-count-keeps-at-least-three
  edits:
    - {from: 'static int missingMemoCount(', to: 'static boolean missingMemoCount('}
    - {from: 'return count;', to: 'return count >= 3;'}
  expect:
    - {path: [entry, returns], value: bool}
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == accountId
              AND bill.memo IS NULL
          ),
          0
        ) >= 3

- name: nonnegative-count-keeps-reversed-less-than-three
  edits:
    - {from: 'static int missingMemoCount(', to: 'static boolean missingMemoCount('}
    - {from: 'return count;', to: 'return 3 > count;'}
  expect:
    - {path: [entry, returns], value: bool}
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM bill
            WHERE bill.account_id == accountId
              AND bill.memo IS NULL
          ),
