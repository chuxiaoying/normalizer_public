- name: known-empty-uses-nonnull-fallback
  edits:
    - from: 'where b.account_id == accountId'
      to: 'where b.account_id == accountId and false'
  expect:
    - path: [R]
      value: 'false'
- name: fallback-change-does-not-erase-a-selected-null
  edits:
    - from: String value = "missing";
      to: String value = "backup";

- name: empty-text-fallback-does-not-coerce-a-selected-null
  edits:
    - {from: 'String value = "missing";', to: 'String value = "";'}

- name: nonnull-fallback-is-observed-only-when-there-is-no-selected-row
  edits:
    - {from: 'return value == null;', to: 'return value != null;'}
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN EXISTS (SELECT 1 FROM bill WHERE bill.account_id == accountId) THEN FIRST(bill.memo FROM bill WHERE bill.account_id == accountId ORDER BY bill.id) != null
          ELSE true
        END

- name: nonnullable-row-value-and-nonnull-fallback-cannot-produce-null
  edits:
    - {from: '@N.Nullable String memo;', to: 'String memo;'}
  expect:
    - {path: [E, bill, columns, memo], value: text}
    - {path: [R], value: 'false'}

- name: nonnullable-row-value-and-nonnull-fallback-always-produce-text
  edits:
    - {from: '@N.Nullable String memo;', to: 'String memo;'}
    - {from: 'return value == null;', to: 'return value != null;'}
  expect:
    - {path: [E, bill, columns, memo], value: text}
    - {path: [R], value: 'true'}
