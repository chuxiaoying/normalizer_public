- name: order-by-id-first
  edits:
    - from: 'order by row.dueDate, row.id'
      to: 'order by row.id, row.dueDate'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          (
            SELECT bill.due_date
            FROM bill
            WHERE bill.account_id == accountId
            ORDER BY bill.id, bill.due_date
            LIMIT 1
          ),
          0
        )
- name: shift-account-filter
  edits:
    - from: 'b.account_id == accountId'
      to: 'b.account_id == accountId + 1'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          (
            SELECT bill.due_date
            FROM bill
            WHERE bill.account_id == accountId + 1
            ORDER BY bill.due_date, bill.id
            LIMIT 1
          ),
          0
        )
- name: known-empty-ordered-relation-uses-fallback
  edits:
    - from: 'where b.account_id == accountId'
      to: 'where b.account_id == accountId and false'
  expect: [{path: [R], value: '0'}]
- name: known-empty-ordered-relation-preserves-explicit-fallback
  edits:
    - from: 'where b.account_id == accountId'
      to: 'where b.account_id == accountId and false'
    - from: 'yield row.dueDate else 0'
      to: 'yield row.dueDate else accountId'
  expect: [{path: [R], value: accountId}]
- name: computed-row-member-is-not-a-column
  edits:
    - {from: 'int accountId;', to: 'int accountId; int synthetic;'}
    - from: 'yield { accountId: b.account_id, dueDate: b.due_date, id: b.id }'
      to: 'yield { accountId: b.account_id, dueDate: b.due_date, id: b.id, synthetic: 7 }'
- name: projected-local-parameter-does-not-replace-physical-filter-column
  edits:
    - {from: 'accountId: b.account_id', to: 'accountId: accountId'}
- name: physical-filter-column-is-independent-of-operand-order
  edits:
    - {from: 'b.account_id == accountId', to: 'accountId == b.account_id'}
- name: row-scoped-binding-does-not-become-a-column-or-entrance-parameter
  edits:
    - from: 'order by row.dueDate, row.id'
      to: 'let adjusted = row.dueDate + 1 order by row.dueDate, row.id'
    - from: 'yield row.dueDate else 0'
      to: 'yield adjusted else 0'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          (
            SELECT bill.due_date + 1
            FROM bill
            WHERE bill.account_id == accountId
            ORDER BY bill.due_date, bill.id
            LIMIT 1
          ),
          0
        )
