- name: swapping-certified-union-branches-does-not-change-the-normal-form
  edits:
  - from: pending.accountId, posted.accountId
    to: posted.accountId, pending.accountId
- name: projecting-bill-id-counts-bills-not-accounts
  edits:
  - from: p.account_id
    to: p.bill_id
  - from: q.account_id
    to: q.bill_id
  expect:
  - path:
    - E
    - pending_bill
    - columns
    value:
      bill_id: number
  - path:
    - E
    - posted_bill
    - columns
    value:
      bill_id: number
  - path:
    - R
    value: "SELECT COUNT(*) FROM (\n  SELECT bill_id FROM pending_bill\n  UNION\n  SELECT bill_id FROM posted_bill\n) AS accounts"
- name: an-unknown-projection-is-not-a-count-of-complete-rows
  edits:
  - from: posted.accountId
    to: posted.unknown
  reject:
  - '[NORM-PROJECT]'
  - projected union field must be a declared nonnullable integer
- name: duplicate-branches-still-deduplicate-values-within-one-table
  edits:
  - from: posted.accountId
    to: pending.accountId
  expect:
  - path:
    - R
    value: "SELECT COUNT(*) FROM (\n  SELECT DISTINCT account_id FROM pending_bill\n) AS accounts"
- name: private-record-and-query-aliases-do-not-leak
  edits:
  - from: AccountRow[] pending;
    to: AccountRow[] early;
  - from: 'pending = from pending_bill as p yield {accountId: p.account_id}'
    to: 'early = from pending_bill as raw yield {accountId: raw.account_id}'
  - from: pending.accountId, posted.accountId
    to: early.accountId, posted.accountId
- name: unsupported-column-type-is-not-assumed-to-be-an-integer
  edits:
  - from: int accountId;
    to: String accountId;
  reject:
  - '[NORM-PROJECT]'
  - projected union field must be a declared nonnullable integer
- name: an-internal-relation-is-not-a-scalar-java-value
  edits:
  - from: return count;
    to: long result = pending; return result;
  reject:
  - '[NORM-SOURCE-TYPE]'
  - kind=PREPROCESS_REQUIRED
  - location=BillReport.countAccounts
  - initializer for result requires number, got source sequence<number>

- name: projected-union-rejects-an-unbound-source
  edits:
    - { from: 'pending.accountId, posted.accountId', to: 'pending.accountId, undeclared.accountId' }
  reject: ['[NORM-PROJECT]', 'projected union needs a declared table row source']
- name: projected-union-does-not-discard-an-existing-source-filter
  edits:
    - { from: 'posted = from posted_bill as q yield', to: 'posted = from posted_bill as q where q.account_id > 0 yield' }
  reject: ['[NORM-PROJECT]', 'projected union needs direct table rows without filters']
- name: two-distinct-account-columns-from-one-table-both-contribute
  edits:
    - from: 'long count;'
      to: 'AccountRow[] alternate; /* @normalizer-ir alternate = from pending_bill as q yield {accountId: q.alternate_account_id} */ long count;'
    - from: 'pending.accountId, posted.accountId'
      to: 'pending.accountId, alternate.accountId, posted.accountId'
  expect:
    - {path: [E, pending_bill, columns, alternate_account_id], add: number}
    - path: [R]
      value: |-
        SELECT COUNT(*) FROM (
          SELECT account_id FROM pending_bill
          UNION
          SELECT alternate_account_id FROM pending_bill
          UNION
          SELECT account_id FROM posted_bill
        ) AS accounts
- name: reordering-and-repeating-a-physical-projection-keeps-one-canonical-union
  edits:
    - from: 'long count;'
      to: 'AccountRow[] alternate; /* @normalizer-ir alternate = from pending_bill as q yield {accountId: q.alternate_account_id} */ long count;'
    - from: 'pending.accountId, posted.accountId'
      to: 'posted.accountId, alternate.accountId, pending.accountId, pending.accountId'
  expect:
    - {path: [E, pending_bill, columns, alternate_account_id], add: number}
    - path: [R]
      value: |-
        SELECT COUNT(*) FROM (
          SELECT account_id FROM pending_bill
          UNION
          SELECT alternate_account_id FROM pending_bill
          UNION
          SELECT account_id FROM posted_bill
        ) AS accounts
- name: a-single-written-projection-is-not-a-union-directive
  edits:
    - {from: 'pending.accountId, posted.accountId', to: 'pending.accountId'}
  reject: ['[SOURCE-PARSE-FAILED]', 'projected union needs at least two closed branches']

- name: two-row-carriers-cannot-give-one-physical-column-conflicting-types
  edits:
    - {from: 'class BillReport {', to: 'class TextAccountRow { String accountId; } class BillReport {'}
    - from: 'long count;'
      to: 'TextAccountRow[] conflict; /* @normalizer-ir conflict = from pending_bill as c yield {accountId: c.account_id} */ long count;'
  reject: ['[NORM-PROJECT]', 'conflicting physical column type: pending_bill.account_id']

- name: independently-read-matching-column-contracts-still-deduplicate
  edits:
    - {from: 'class BillReport {', to: 'class OtherAccountRow { int id; } class BillReport {'}
    - from: 'long count;'
      to: 'OtherAccountRow[] again; /* @normalizer-ir again = from pending_bill as c yield {id: c.account_id} */ long count;'
    - {from: 'pending.accountId, posted.accountId', to: 'pending.accountId, again.id, posted.accountId'}
