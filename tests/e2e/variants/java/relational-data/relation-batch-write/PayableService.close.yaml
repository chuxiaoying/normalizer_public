- name: update-status
  edits: [{ from: '"CLOSED"', to: '"SETTLED"' }]
  expect:
    - path: [S, 0, sql]
      value: |-
        UPDATE payable
        SET closed_amount = amount, status = 'SETTLED'
        WHERE payable.account_id = accountId
- name: include-zero-amount
  edits: [{ from: 'amount > 0', to: 'amount >= 0' }]
  expect:
    - { path: [S, 0, when], value: amount >= 0 }
    - path: [throws, 0, when]
      value: |-
        CASE
          WHEN amount >= 0 THEN completion.is_throw($e_0, DatabaseWriteError)
          ELSE false
        END

- name: atomic-update-preserves-an-exact-integer-literal
  edits:
    - {from: 'closed_amount: amount', to: 'closed_amount: 7'}
  expect:
    - path: [S, 0, sql]
      value: |-
        UPDATE payable
        SET closed_amount = 7, status = 'CLOSED'
        WHERE payable.account_id = accountId
- name: atomic-update-without-where
  edits:
    - from: 'where p.account_id == accountId'
      to: ' '
  expect:
    - path: [S, 0, sql]
      value: |-
        UPDATE payable
        SET closed_amount = amount, status = 'CLOSED'
    - path: [E, payable, columns, account_id]
      absent: true
