- name: delete-open-bills
  edits:
    - from: 'b.status == "CLOSED"'
      to: 'b.status == "OPEN"'
  expect:
    - path: [S, 0, sql]
      value: |-
        DELETE FROM bill
        WHERE bill.account_id = accountId
          AND bill.status = 'OPEN'
- name: shift-account-filter
  edits:
    - from: 'int affected;'
      to: 'int shiftedAccount = accountId + 1; int affected;'
    - from: 'b.account_id == accountId'
      to: 'b.account_id == shiftedAccount'
  expect:
    - path: [S, 0, sql]
      value: |-
        DELETE FROM bill
        WHERE bill.account_id = accountId + 1
          AND bill.status = 'CLOSED'

- name: delete-text-literal-quotes-apostrophe-within-the-value
  edits:
    - from: 'b.status == "CLOSED"'
      to: 'b.status == "CUSTOMER''S"'
  expect:
    - path: [S, 0, sql]
      value: |-
        DELETE FROM bill
        WHERE bill.account_id = accountId
          AND bill.status = 'CUSTOMER''S'

- name: read-and-delete-cannot-disagree-about-the-same-account-column
  edits:
    - {from: 'class CleanupService {', to: 'class ObservedAccount { String id; } class CleanupService {'}
    - from: 'int affected;'
      to: 'ObservedAccount[] observed; /* @normalizer-ir observed = from bill as r yield {id: r.account_id} */ int affected;'
  reject: ['[NORM-PROJECT]', 'conflicting physical column type: bill.account_id']

- name: read-and-delete-share-the-same-numeric-account-column
  edits:
    - {from: 'class CleanupService {', to: 'class ObservedAccount { int id; } class CleanupService {'}
    - from: 'int affected;'
      to: 'ObservedAccount[] observed; /* @normalizer-ir observed = from bill as r yield {id: r.account_id} */ int affected;'

- name: deleting-by-a-text-literal-does-not-remove-known-nullability
  edits:
    - from: 'class DatabaseWriteError extends RuntimeException {}'
      to: |-
        import normalizer.intrinsics.N;
        class DatabaseWriteError extends RuntimeException {}
        class ObservedStatus { @N.Nullable String value; }
    - from: 'int affected;'
      to: 'ObservedStatus[] observed; /* @normalizer-ir observed = from bill as r yield {value: r.status} */ int affected;'
  expect:
    - {path: [E, bill, columns, status], value: 'text?'}
