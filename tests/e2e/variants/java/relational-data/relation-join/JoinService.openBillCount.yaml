- name: include-closed-bills
  edits:
    - from: 'b.status == "OPEN"'
      to: 'b.status == "CLOSED"'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM account AS a
            JOIN bill AS b ON a.id == b.account_id
            WHERE a.id == accountId
              AND b.status == "CLOSED"
          ),
          0
        )
- name: shift-join-key
  edits:
    - from: 'a.id == b.account_id'
      to: 'a.id + 1 == b.account_id'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM account AS a
            JOIN bill AS b ON a.id + 1 == b.account_id
            WHERE a.id == accountId
              AND b.status == "OPEN"
          ),
          0
        )
- name: reject-unknown-join-column
  edits: [{from: 'a.id == b.account_id', to: 'a.id == b.unlisted'}]
  reject: ['[NORM-PROJECT]', 'kind=PREPROCESS_REQUIRED', 'undeclared query input b']
- name: count-unequal-join-keys-with-multiplicity
  edits:
    - from: 'a.id == b.account_id'
      to: 'a.id != b.account_id'
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM account AS a
            JOIN bill AS b ON a.id != b.account_id
            WHERE a.id == accountId
              AND b.status == "OPEN"
          ),
          0
        )
- name: retain-all-matches-without-where
  edits:
    - from: 'where a.id == accountId and b.status == "OPEN"'
      to: ' '
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM account AS a
            JOIN bill AS b ON a.id == b.account_id
          ),
          0
        )

- name: ordered-join-compares-account-to-bill-in-that-direction
  edits:
    - {from: 'a.id == b.account_id', to: 'a.id < b.account_id'}
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM account AS a
            JOIN bill AS b ON a.id < b.account_id
            WHERE a.id == accountId
              AND b.status == "OPEN"
          ),
          0
        )

- name: filter-on-bill-side-alone-does-not-filter-account-id
  edits:
    - {from: 'a.id == accountId and b.status == "OPEN"', to: 'b.status == "OPEN"'}
  expect:
    - path: [R]
      value: |-
        COALESCE(
          SUM(
            SELECT 1
            FROM account AS a
            JOIN bill AS b ON a.id == b.account_id
            WHERE b.status == "OPEN"
          ),
          0
        )

- name: false-local-filter-leaves-no-join-pairs
  edits:
    - {from: 'a.id == accountId and b.status == "OPEN"', to: 'a.id == accountId and b.status == "OPEN" and false'}
  expect:
    - {path: [R], value: '0'}

- name: join-does-not-infer-an-unbound-right-source-from-its-alias
  edits:
    - { from: 'join bills as b on', to: 'join undeclared as b on' }
  reject: ['[NORM-PROJECT]', 'join requires two typed table bindings']
- name: join-does-not-discard-an-existing-filter-on-its-right-source
  edits:
    - { from: 'bills = from bill as row yield', to: 'bills = from bill as row where row.account_id > 0 yield' }
  reject: ['[NORM-PROJECT]', 'join count currently requires unfiltered table declarations']
