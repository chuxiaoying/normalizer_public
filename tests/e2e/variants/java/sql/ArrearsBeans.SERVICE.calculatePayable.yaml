- name: equivalent-cap-with-swapped-arms
  edits:
    - from: 'total > profile.quota ? profile.quota : total'
      to: 'total <= profile.quota ? total : profile.quota'

- name: exclude-bills-due-today
  edits:
    - from: row.dueDate <= today
      to: row.dueDate < today
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN $e_0.quota < COALESCE(
            SUM(
              SELECT bill.amount - bill.waived_amount
              FROM bill
              WHERE bill.account_id == accountId
                AND bill.due_date < today
                AND $e_0.minPriority <= bill.priority
                AND bill.amount > bill.waived_amount
                AND bill.status == "OPEN"
            ),
            0
          ) THEN $e_0.quota
          ELSE COALESCE(
            SUM(
              SELECT bill.amount - bill.waived_amount
              FROM bill
              WHERE bill.account_id == accountId
                AND bill.due_date < today
                AND $e_0.minPriority <= bill.priority
                AND bill.amount > bill.waived_amount
                AND bill.status == "OPEN"
            ),
            0
          )
        END
