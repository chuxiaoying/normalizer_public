  edits:
    - from: class PayableService {
      to: |-
        class AmountBox {
            int value;
            AmountBox(int amount) { this.value = amount; }
        }
        class PayableService {
    - from: int affected;
      to: |-
        AmountBox box = new AmountBox(amount);
                int savedAmount = box.value;
                int affected;
    - from: 'account_id: accountId, amount: amount'
