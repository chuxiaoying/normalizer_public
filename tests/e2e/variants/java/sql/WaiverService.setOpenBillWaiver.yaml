- name: equivalent-local-for-waiver
  edits:
    - from: int affected;
      to: |-
        int adjustment = waivedAmount;
                int affected;
    - from: 'waived_amount: waivedAmount'
      to: 'waived_amount: adjustment'

- name: include-only-closed-bills
  edits:
    - from: b.status == "OPEN"
      to: b.status == "CLOSED"
  expect:
    - path: [S, 0, sql]
      value: |-
        UPDATE bill
        SET waived_amount = waivedAmount
        WHERE bill.account_id = accountId
          AND bill.status = 'CLOSED'
