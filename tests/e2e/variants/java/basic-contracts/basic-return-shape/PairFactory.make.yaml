- name: a-declared-field-initializer-is-observed-before-the-constructor-write
  edits:
    - {from: 'int left;', to: 'int left = 7;'}
    - {from: 'this.left = left;', to: 'this.left = this.left + left;'}
  expect:
    - path: [R]
      value: |-
        {
          left: value + 7,
          right: value + 1
        }
