- name: reverse-null-test
  edits:
    - from: 'return value == null;'
      to: 'return value != null;'
  expect:
    - path: [R]
      value: value != null

- name: source-string-helper-observes-a-null-literal
  edits:
    - from: 'class OptionalText {'
      to: |-
        class OptionalText {
            static boolean helper(@N.Nullable String text) {
                return text == null;
            }
    - from: 'return value == null;'
      to: 'return helper(null);'
  expect:
    - path: [R]
      value: 'true'

- name: qualified-nullable-text-keeps-the-same-parameter
  edits:
    - { from: 'Nullable String value', to: 'Nullable java.lang.String value' }

- name: empty-parentheses-preserve-the-explicit-nullability-marker
  edits:
    - {from: '@N.Nullable String value', to: '@N.Nullable() String value'}

- name: qualified-helper-observes-the-original-symbolic-nullability
  edits:
    - from: 'class OptionalText {'
      to: |-
        class OptionalText {
            static boolean probe(@N.Nullable java.lang.String text) {
                return text == null;
            }
    - {from: 'return value == null;', to: 'return OptionalText.probe(value);'}
