- name: a-name-can-be-reused-after-the-earlier-child-block
  edits:
    - from: |-
        if (choose) {
                    int branch = tally + 1;
                    return branch;
                } else {
                    int branch = tally + 2;
                    return branch;
                }
      to: '{ int branch = tally + 1; } int branch = tally + 3; return branch;'
  expect:
    - { path: [R], value: 'input + 3' }
- name: even-an-unused-helper-cannot-redeclare-a-local-in-the-same-scope
  edits:
    - from: 'class LexicalScope {'
      to: 'class LexicalScope { static int unused() { int i=99; int i=1; return i; }'
  reject: ['[NORM-SOURCE-NAME]', 'location=LexicalScope.unused', 'duplicate local declaration i']
- name: a-child-block-cannot-redeclare-a-visible-local
  edits:
    - from: 'int branch = tally + 1;'
      to: 'int tally = 0; int branch = tally + 1;'
  reject: ['[NORM-SOURCE-NAME]', 'duplicate local declaration tally']
- name: a-child-block-cannot-redeclare-a-method-parameter
  edits:
    - from: 'int branch = tally + 1;'
      to: 'int input = 0; int branch = tally + 1;'
  reject: ['[NORM-SOURCE-NAME]', 'duplicate local declaration input']
- name: enhanced-for-binding-cannot-redeclare-a-method-parameter
  edits:
    - from: 'class LexicalScope {'
      to: 'class LexicalScope { static int unused(int input, int[] values) { int total=0; for (int input: values) total += input; return total; }'
  reject: ['[NORM-SOURCE-NAME]', 'location=LexicalScope.unused', 'duplicate local declaration input']
- name: catch-binding-cannot-redeclare-a-method-parameter
  edits:
    - from: 'class LexicalScope {'
      to: 'class LexicalScope { static int unused(int input) { try { return input; } catch (RuntimeException input) { return 0; } }'
  reject: ['[NORM-SOURCE-NAME]', 'location=LexicalScope.unused', 'duplicate local declaration input']
