- name: capitalized-local-subtraction-is-not-a-cast
  edits:
    - { from: 'return (Upper) + 1;', to: 'return (Upper) - 1;' }
  expect:
    - { path: [R], value: 'value - 1' }
- name: nested-grouping-and-comment-preserve-addition
  edits:
    - { from: 'return (Upper) + 1;', to: 'return ((Upper)) /* group */ + 1;' }
- name: lowercase-local-has-identical-binding
  edits:
    - { from: 'long Upper = value;', to: 'long lower = value;' }
    - { from: 'return (Upper) + 1;', to: 'return (lower) + 1;' }
- name: primitive-cast-accepts-signed-positive-operand
  edits:
    - { from: 'return (Upper) + 1;', to: 'return (long) +1;' }
  expect:
    - { path: [R], value: '1' }
- name: primitive-cast-accepts-signed-negative-operand
  edits:
    - { from: 'return (Upper) + 1;', to: 'return (long) -1;' }
  expect:
    - { path: [R], value: '-1' }
- name: missing-grouped-value-is-rejected-as-a-name
  edits:
    - { from: 'return (Upper) + 1;', to: 'return (Missing) + 1;' }
  reject: ['[NORM-SOURCE-NAME]', 'undeclared value Missing']
- name: a-primitive-element-array-is-not-a-primitive-cast
  edits:
    - { from: 'return (Upper) + 1;', to: 'return (long[]) +1;' }
  reject: ['[SOURCE-PARSE-FAILED]', 'expected expression']
- name: primitive-prefix-identifiers-start-grouped-values
  edits:
    - { from: 'long Upper = value;', to: 'long longValue = value, long_value = 2, long$value = 3;' }
    - { from: 'return (Upper) + 1;', to: 'return (longValue) + (long_value) + (long$value);' }
  expect:
    - { path: [R], value: 'value + 5' }
