reject: ['[NORM-OUT-OF-SOURCE]', 'kind=ABORT', 'UnsupportedBoundary.runtimeFormat', 'not-support']
variants:
  - name: a-familiar-spelling-does-not-close-an-opaque-method
    edits:
      - {from: 'return runtimeFormat(value);', to: 'return toString(value);'}
      - {from: 'static native String runtimeFormat(int value);', to: 'static native String toString(int value);'}
    reject: ['[NORM-OUT-OF-SOURCE]', 'kind=ABORT', 'UnsupportedBoundary.toString', 'not-support']
  - name: increment-before-format
    edits:
      - {from: 'runtimeFormat(value)', to: 'runtimeFormat(value + 1)'}
    reject: ['[NORM-OUT-OF-SOURCE]', 'kind=ABORT', 'UnsupportedBoundary.runtimeFormat', 'not-support']
