- name: simple-assignment-is-not-the-compound-conversion
  edits:
    - { from: 'value += 99L;', to: 'value = value + 99L;' }
  reject: ['[NORM-SOURCE-TYPE]', 'assignment to value', 'cannot implicitly narrow']
- name: overwriting-an-illegal-assignment-does-not-make-source-valid
  edits:
    - { from: 'value += 99L;', to: 'value = 99L; value = 1;' }
  reject: ['[NORM-SOURCE-TYPE]', 'assignment to value', 'cannot implicitly narrow']
- name: an-illegal-declaration-initializer-is-not-masked
  edits:
    - { from: 'int value = 99;', to: 'int value = 99L;' }
  reject: ['[NORM-SOURCE-TYPE]', 'initializer for value', 'cannot implicitly narrow']
- name: a-long-return-cannot-implicitly-narrow-to-int
  edits:
    - { from: 'return value;', to: 'return value + 1L;' }
  reject: ['[NORM-SOURCE-TYPE]', 'return cannot implicitly narrow']
- name: array-element-initialization-uses-the-same-conversion
  edits:
    - { from: 'value += 99L;', to: 'int[] slots = new int[] { 99L };' }
  reject: ['[NORM-SOURCE-TYPE]', 'array initializer cannot implicitly narrow']
- name: using-long-throughout-is-legal
  edits:
    - { from: 'static int read()', to: 'static long read()' }
    - { from: 'int value = 99;', to: 'long value = 99L;' }
- name: legal-byte-compound-assignment-has-no-business-wrap
  edits:
    - { from: 'int value = 99;', to: 'byte value = 127;' }
    - { from: 'value += 99L;', to: 'value += 1;' }
  expect:
    - { path: [R], value: '128' }
- name: an-initialized-final-local-cannot-be-assigned-again
  edits:
    - { from: 'int value = 99;', to: 'final int value = 99;' }
  reject: ['[NORM-SOURCE-TYPE]', 'cannot update final local value']
- name: a-finite-loop-still-cannot-increment-final
  edits:
    - { from: 'value += 99L;', to: 'for (final int i = 1; i < 4; i++) value += i;' }
  reject: ['[NORM-SOURCE-TYPE]', 'cannot update final local i']
- name: an-otherwise-identical-mutable-loop-counter-is-valid
  edits:
    - { from: 'value += 99L;', to: 'for (int i = 1; i < 4; i++) value += i;' }
  expect:
    - { path: [R], value: '105' }
- name: a-representable-char-literal-can-initialize-a-byte
  edits:
    - { from: 'int value = 99;', to: "byte value = 'A';" }
    - { from: 'value += 99L;', to: '' }
  expect:
    - { path: [R], value: '65' }
- name: a-char-literal-outside-the-byte-range-is-invalid
  edits:
    - { from: 'int value = 99;', to: "byte value = 'é';" }
  reject: ['[NORM-SOURCE-TYPE]', 'initializer for value', 'integral literal 233 is outside the Java byte range']
- name: a-direct-int-literal-one-past-the-byte-max-is-invalid
  edits:
    - { from: 'int value = 99;', to: 'byte value = 128;' }
  reject: ['[NORM-SOURCE-TYPE]', 'initializer for value', 'integral literal 128 is outside the Java byte range']
- name: short-assignment-accepts-the-signed-minimum
  edits:
    - { from: 'int value = 99;', to: 'short value = 0;' }
    - { from: 'value += 99L;', to: 'value = -32768;' }
  expect:
    - { path: [R], value: '-32768' }
- name: short-assignment-rejects-one-below-the-signed-minimum
  edits:
    - { from: 'int value = 99;', to: 'short value = 0;' }
    - { from: 'value += 99L;', to: 'value = -32769;' }
  reject: ['[NORM-SOURCE-TYPE]', 'assignment to value', 'integral literal -32769 is outside the Java short range']
- name: byte-return-accepts-the-signed-minimum
  edits:
    - { from: 'static int read()', to: 'static byte read()' }
    - { from: 'return value;', to: 'return -128;' }
  expect:
    - { path: [R], value: '-128' }
- name: byte-return-rejects-one-below-the-signed-minimum
  edits:
    - { from: 'static int read()', to: 'static byte read()' }
    - { from: 'return value;', to: 'return -129;' }
  reject: ['[NORM-SOURCE-TYPE]', 'return: integral literal -129 is outside the Java byte range']
- name: short-return-accepts-the-signed-maximum
  edits:
    - { from: 'static int read()', to: 'static short read()' }
    - { from: 'return value;', to: 'return 32767;' }
  expect:
    - { path: [R], value: '32767' }
- name: short-return-rejects-one-past-the-signed-maximum
  edits:
    - { from: 'static int read()', to: 'static short read()' }
    - { from: 'return value;', to: 'return 32768;' }
  reject: ['[NORM-SOURCE-TYPE]', 'return: integral literal 32768 is outside the Java short range']
- name: an-int-parameter-cannot-initialize-a-byte
  edits:
    - { from: 'static int read()', to: 'static int read(int input)' }
    - { from: 'int value = 99;', to: 'byte value = input;' }
  reject: ['[NORM-SOURCE-TYPE]', 'initializer for value', 'nonconstant int binding input cannot implicitly narrow to Java byte']
- name: an-int-parameter-cannot-be-assigned-to-a-short
  edits:
    - { from: 'static int read()', to: 'static int read(int input)' }
    - { from: 'int value = 99;', to: 'short value = 0;' }
    - { from: 'value += 99L;', to: 'value = input;' }
  reject: ['[NORM-SOURCE-TYPE]', 'assignment to value', 'nonconstant int binding input cannot implicitly narrow to Java short']
- name: a-short-parameter-cannot-return-to-a-byte
  edits:
    - { from: 'static int read()', to: 'static byte read(short input)' }
    - { from: 'return value;', to: 'return input;' }
  reject: ['[NORM-SOURCE-TYPE]', 'return:', 'nonconstant short binding input cannot implicitly narrow to Java byte']
- name: a-mutable-int-with-a-literal-initializer-is-still-not-a-constant-variable
  edits:
    - { from: 'int value = 99;', to: 'int input = 65; byte value = input;' }
  reject: ['[NORM-SOURCE-TYPE]', 'initializer for value', 'nonconstant int binding input cannot implicitly narrow to Java byte']
- name: an-in-range-final-int-constant-can-initialize-a-byte
  edits:
    - { from: 'int value = 99;', to: 'final int input = 65; byte value = input;' }
    - { from: 'value += 99L;', to: '' }
  expect:
    - { path: [R], value: '65' }
- name: an-in-range-final-short-constant-can-initialize-a-byte
  edits:
    - { from: 'int value = 99;', to: 'final short input = 65; byte value = input;' }
    - { from: 'value += 99L;', to: '' }
  expect:
    - { path: [R], value: '65' }
- name: a-mutable-byte-can-widen-to-a-short
  edits:
    - { from: 'int value = 99;', to: 'byte input = 65; short value = input;' }
    - { from: 'value += 99L;', to: '' }
  expect:
    - { path: [R], value: '65' }
