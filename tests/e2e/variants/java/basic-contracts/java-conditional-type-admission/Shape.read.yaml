- name: another-numeric-default-retains-the-condition
  edits:
    - { from: 'return choose ? value : 1;', to: 'return choose ? value : 2;' }
  expect:
    - { path: [R], value: 'CASE WHEN choose THEN value ELSE 2 END' }
- name: a-number-and-a-boolean-are-incompatible-branches
  edits:
    - { from: 'return choose ? value : 1;', to: 'return choose ? value : true;' }
  reject: ['[NORM-SOURCE-TYPE]', 'kind=PREPROCESS_REQUIRED', 'location=Shape.read', 'branch result type mismatch: then=number else=bool']
- name: sequence-in-the-then-arm-is-a-type-error-not-an-internal-panic
