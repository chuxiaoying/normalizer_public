    - { from: 'return choose ? value : 1;', to: 'return choose ? values : 1;' }
  reject: ['[NORM-SOURCE-TYPE]', 'kind=PREPROCESS_REQUIRED', 'location=Shape.read', 'branch result type mismatch: then=source sequence<number> else=number']
- name: sequence-in-the-else-arm-keeps-the-actual-error-direction
