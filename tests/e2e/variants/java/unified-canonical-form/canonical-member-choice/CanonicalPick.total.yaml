- name: commuting-result-arithmetic-does-not-merge-the-choices
  edits:
  - from: return first + second;
    to: return second + first;
- name: ordered-result-operation-retains-which-occurrence-it-uses
  edits:
  - from: return first + second;
    to: return second - first;
  expect:
  - path:
    - R
    value: $t_1 - $t_0
- name: empty-fallback-is-specific-to-each-occurrence
  edits:
  - from: second = choose from values else backup
    to: second = choose from values else 3
  expect:
  - path:
    - T
    - 1
    - empty
    value: '3'
- name: private-binding-rename-does-not-rename-its-occurrence
  edits:
  - from: int first;
    to: int picked;
  - from: first = choose from values
    to: picked = choose from values
  - from: return first + second;
    to: return picked + second;
- name: a-scalar-is-not-a-member-source
  edits:
  - from: first = choose from values
    to: first = choose from backup
  reject:
  - '[NORM-PROJECT]'
  - member choice requires a direct integer source array
- name: conditional-choice-must-not-be-hoisted-to-an-unconditional-definition
  edits:
  - from: "int first;\n        /* @normalizer-ir first = choose from values else backup */"
    to: "if (backup == 0) {\n  int first;\n  /* @normalizer-ir first = choose from values else backup */\n  return first;\n}"
  - from: return first + second;
    to: return second;
  expect:
  - path:
    - T
    - 0
    - when
    value: backup == 0
  - path:
    - T
    - 1
    - when
    value: backup != 0
  - path:
    - R
    value: "CASE\n  WHEN backup == 0 THEN $t_0\n  ELSE $t_1\nEND"
- name: choice-does-not-accumulate-an-uninitialized-binding
  edits:
  - from: first = choose from values
    to: first += choose from values
  reject:
  - '[SOURCE-PARSE-FAILED]'
  - member choice must initialize its binding with =
- name: known-length-zero-uses-fallback-without-choice
  edits:
  - from: int first;
    to: int[] local = new int[0]; int first;
  - from: first = choose from values
    to: first = choose from local
  - from: second = choose from values
    to: second = choose from local
  expect:
  - path:
    - T
    absent: true
  - path:
    - R
    value: backup + backup
- name: singleton-literal-is-a-known-result-without-choice
  edits:
  - from: int first;
    to: int[] local = {7}; int first;
  - from: first = choose from values
    to: first = choose from local
  - from: second = choose from values
    to: second = choose from local
  expect:
  - path:
    - T
    absent: true
  - path:
    - R
    value: '14'
- name: heterogeneous-literal-is-known-but-each-selection-remains-independent
  edits:
  - from: int first;
    to: int[] local = {2, 7}; int first;
  - from: first = choose from values
    to: first = choose from local
  - from: second = choose from values
    to: second = choose from local
  expect:
  - path:
    - T
    - 0
    - members
    value: '[2, 7]'
  - path:
    - T
    - 1
    - members
    value: '[2, 7]'
- name: zero-filled-array-is-homogeneous-without-materialization
  edits:
  - from: int first;
    to: int[] local = new int[2000000]; int first;
  - from: first = choose from values
    to: first = choose from local
  - from: second = choose from values
    to: second = choose from local
  expect:
  - path:
    - T
    absent: true
  - path:
    - R
    value: '0'
- name: explicit-empty-initializer-is-distinct-from-zero-filled-length
  edits:
  - from: int first;
    to: int[] local = {}; int first;
  - from: first = choose from values
    to: first = choose from local
  - from: second = choose from values
    to: second = choose from local
  expect:
  - path:
    - T
    absent: true
  - path:
    - R
    value: backup + backup
- name: text-is-not-an-integer-choice-fallback
  edits:
  - from: second = choose from values else backup
    to: second = choose from values else "not a number"
  reject:
  - '[SOURCE-PARSE-FAILED]'
  - member choice requires one integer empty fallback
- name: literal-order-and-duplicate-values-do-not-change-the-choice-support
  edits:
  - from: int first;
    to: int[] local = {7, 2, 7}; int first;
  - from: first = choose from values
    to: first = choose from local
  - from: second = choose from values
    to: second = choose from local
  expect:
  - path:
    - T
    - 0
    - members
    value: '[2, 7]'
  - path:
    - T
    - 1
    - members
    value: '[2, 7]'
- name: a-prior-nondeterministic-result-is-not-an-entry-guard
  edits:
  - from: "int second;\n        /* @normalizer-ir second = choose from values else backup */\n        return first + second;"
    to: "if (first == 0) {\n  int second;\n  /* @normalizer-ir second = choose from values else backup */\n  return second;\n}\nreturn\
      \ first;"
  reject:
  - '[NORM-PROJECT]'
  - member choice guard requires acquired entry scalars
- name: a-single-conditional-choice-is-absent-on-the-fallback-path
  edits:
  - from: "int first;\n        /* @normalizer-ir first = choose from values else backup */\n        int second;\n        /* @normalizer-ir\
      \ second = choose from values else backup */\n        return first + second;"
    to: "if (backup == 0) {\n  int first;\n  /* @normalizer-ir first = choose from values else backup */\n  return first;\n}\nreturn\
      \ backup;"
  expect:
  - path:
    - T
    value:
    - id: $t_0
      op: member_choice
      when: backup == 0
      members: values
      empty: backup
  - path:
    - R
    value: "CASE\n  WHEN backup == 0 THEN $t_0\n  ELSE backup\nEND"
