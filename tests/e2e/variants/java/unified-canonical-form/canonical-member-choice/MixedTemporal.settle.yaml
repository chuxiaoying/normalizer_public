- name: commutative-result-does-not-change-graph-identity
  edits:
    - from: 'return total + picked;'
      to: 'return picked + total;'
- name: a-fold-can-produce-the-empty-choice-fallback
  edits:
    - from: |-
        int picked;
                /* @normalizer-ir picked = choose from values else backup */
                int total;
                /* @normalizer-ir total = reduce values from picked as (acc, item) yield acc * 2 + item */
      to: |-
        int total;
        /* @normalizer-ir total = reduce values from backup as (acc, item) yield acc * 2 + item */
        int picked;
        /* @normalizer-ir picked = choose from values else total */
  expect:
    - path: [T]
      value:
        - { id: $t_0, op: fold, type: number, source: values, initial: backup, accumulator: acc, element: item, body: 'acc * 2 + item' }
        - { id: $t_1, op: member_choice, when: 'true', members: values, empty: '$t_0' }
- name: a-simulated-choice-is-not-removed-when-only-the-dependent-fold-is-returned
  edits:
    - from: 'return total + picked;'
      to: 'return total;'
  expect:
    - path: [R]
      value: '$t_1'
- name: a-dependent-guarded-choice-stays-inside-the-prior-choice-domain
  edits:
    - from: |-
        int picked;
                /* @normalizer-ir picked = choose from values else backup */
                int total;
                /* @normalizer-ir total = reduce values from picked as (acc, item) yield acc * 2 + item */
                return total + picked;
      to: |-
        if (backup == 0) {
          int picked;
          /* @normalizer-ir picked = choose from values else backup */
          int total;
          /* @normalizer-ir total = choose from values else picked */
          return total;
        }
        return backup;
  expect:
    - path: [T]
      value:
        - { id: $t_0, op: member_choice, when: 'backup == 0', members: values, empty: backup }
        - { id: $t_1, op: member_choice, when: 'backup == 0', members: values, empty: '$t_0' }
    - path: [R]
      value: |-
        CASE
          WHEN backup == 0 THEN $t_1
          ELSE backup
        END
- name: independence-allows-the-fold-to-sort-before-the-choice
  edits:
    - from: 'total = reduce values from picked'
      to: 'total = reduce values from backup'
  expect:
    - path: [T]
      value:
        - { id: $t_0, op: fold, type: number, source: values, initial: backup, accumulator: acc, element: item, body: 'acc * 2 + item' }
        - { id: $t_1, op: member_choice, when: 'true', members: values, empty: backup }
- name: reversing-independent-source-definitions-keeps-the-same-mixed-numbering
  edits:
    - from: |-
        int picked;
                /* @normalizer-ir picked = choose from values else backup */
                int total;
                /* @normalizer-ir total = reduce values from picked as (acc, item) yield acc * 2 + item */
      to: |-
        int total;
        /* @normalizer-ir total = reduce values from backup as (acc, item) yield acc * 2 + item */
        int picked;
        /* @normalizer-ir picked = choose from values else backup */
  expect:
    - path: [T]
      value:
        - { id: $t_0, op: fold, type: number, source: values, initial: backup, accumulator: acc, element: item, body: 'acc * 2 + item' }
        - { id: $t_1, op: member_choice, when: 'true', members: values, empty: backup }
