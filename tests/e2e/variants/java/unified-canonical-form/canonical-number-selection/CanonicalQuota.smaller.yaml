- name: strict-same-side
  edits:
    - from: 'if (total <= quota) return total;'
      to: 'if (total < quota) return total;'
- name: non-strict-and-swapped-arms
  edits:
    - from: |-
        if (total <= quota) return total;
                return quota;
      to: |-
        if (quota <= total) return quota;
                return total;
- name: canonical-source-form
  edits:
    - from: |-
        if (total <= quota) return total;
                return quota;
      to: |-
        if (quota < total) return quota;
                return total;
- name: maximum-is-a-different-selection
  edits:
    - from: 'if (total <= quota) return total;'
      to: 'if (total >= quota) return total;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN quota > total THEN quota
          ELSE total
        END
- name: exact-decimal-strict-minimum
  edits:
    - from: 'static int smaller(int quota, int total)'
      to: 'static double smaller(double quota, double total)'
    - from: |-
        if (total <= quota) return total;
                return quota;
      to: 'return quota < total ? quota : total;'
- name: exact-decimal-nonstrict-minimum
  edits:
    - from: 'static int smaller(int quota, int total)'
      to: 'static double smaller(double quota, double total)'
    - from: |-
        if (total <= quota) return total;
                return quota;
      to: 'return quota <= total ? quota : total;'
- name: exact-decimal-minimum-with-reversed-arms
  edits:
    - from: 'static int smaller(int quota, int total)'
      to: 'static double smaller(double quota, double total)'
    - from: |-
        if (total <= quota) return total;
                return quota;
      to: 'return total <= quota ? total : quota;'
