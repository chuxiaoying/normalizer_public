- name: swapping-disjoint-checks-does-not-move-receipt
  edits:
    - from: |-
        if (rank == 2) throw new RuntimeException("zeta");
                    if (rank == 1) throw new RuntimeException("alpha");
      to: |-
        if (rank == 1) throw new RuntimeException("alpha");
                    if (rank == 2) throw new RuntimeException("zeta");
- name: disabled-call-produces-no-receipt-or-exception
  edits:
    - from: 'if (enabled)'
      to: 'if (false)'
  expect:
    - path: [S]
      absent: true
    - path: [throws]
      absent: true
