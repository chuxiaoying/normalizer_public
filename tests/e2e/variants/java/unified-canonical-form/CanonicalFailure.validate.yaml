- name: independently-guarded-source-order-is-not-output-order
  edits:
    - from: |-
        if (code == 2) throw new RuntimeException("zeta");
                if (code == 1) throw new RuntimeException("alpha");
      to: |-
        if (code == 1) throw new RuntimeException("alpha");
                if (code == 2) throw new RuntimeException("zeta");
- name: observed-null-is-not-no-payload
  edits:
    - from: 'RuntimeException("alpha")'
      to: 'RuntimeException((java.lang.String) null)'
  expect:
    - path: [throws, 1, payload]
      value: 'null'
- name: equal-payloads-can-share-their-effective-domain
  edits:
    - from: 'RuntimeException("zeta")'
      to: 'RuntimeException("alpha")'
  expect:
    - path: [throws]
      value:
        - { type: java.lang.RuntimeException, when: 'code == 3' }
        - { type: java.lang.RuntimeException, when: 'code == 1 or code == 2', payload: '"alpha"' }
- name: first-match-domain-is-not-source-order-independent
  edits:
    - from: 'if (code == 2)'
      to: 'if (code == 1)'
  expect:
    - path: [throws]
      value:
        - { type: java.lang.RuntimeException, when: 'code == 3' }
        - { type: java.lang.RuntimeException, when: 'code == 1', payload: '"zeta"' }
- name: nested-exclusive-branches-preserve-separate-payloads
  edits:
    - from: |-
        if (code == 2) throw new RuntimeException("zeta");
                if (code == 1) throw new RuntimeException("alpha");
      to: |-
        if (code == 1 || code == 2) {
          if (code == 1) throw new RuntimeException("alpha");
          else throw new RuntimeException("zeta");
        }
- name: exception-cause-is-not-a-text-message
  edits:
    - from: 'RuntimeException("alpha")'
      to: 'RuntimeException(new RuntimeException())'
  reject: ['NORM-STATEMENT']
- name: three-return-arms-do-not-turn-the-throw-domain-into-a-return
  edits:
    - from: |-
        if (code == 2) throw new RuntimeException("zeta");
                if (code == 1) throw new RuntimeException("alpha");
                if (code == 3) throw new RuntimeException();
                return code;
      to: |-
        if (code == 1) return 10;
                if (code == 2) return 20;
                if (code == 3) return 30;
                throw new RuntimeException("invalid");
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN code == 1 THEN 10
          WHEN code == 2 THEN 20
          ELSE 30
        END
    - path: [throws]
      value:
        - { type: java.lang.RuntimeException, when: 'code != 1 and code != 2 and code != 3', payload: '"invalid"' }
