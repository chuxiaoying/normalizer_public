- name: evidence-positive-arm-is-the-same-indicator
  edits:
    - from: |-
        if (label == null) return 0;
                return 1;
      to: |-
        if (label != null) return 1;
                return 0;
- name: nonbinary-result-uses-ordinary-structure-direction
  edits:
    - from: return 1;
      to: return 2;
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN label == null THEN 0
          ELSE 2
        END
