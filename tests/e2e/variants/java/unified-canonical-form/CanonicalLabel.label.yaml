- name: swapped-text-is-different
  edits:
    - from: 'return "zone-" + "42";'
      to: 'return "42" + "zone-";'
  expect:
    - path: [R]
      value: '"42zone-"'
- name: association-keeps-text-order
  edits:
    - from: 'return "zone-" + "42";'
      to: 'return "zone-" + ("" + "42");'
- name: preserves-newline-and-quote-in-ordered-content
  edits:
    - from: 'return "zone-" + "42";'
      to: 'return "zone-\n\141\"" + "42";'
  expect:
    - path: [R]
      value: '"zone-\na\"42"'
