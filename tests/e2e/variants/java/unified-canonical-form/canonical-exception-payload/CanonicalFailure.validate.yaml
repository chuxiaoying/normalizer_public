- name: independently-guarded-source-order-is-not-output-order
  edits:
  - from: "if (code == 2) throw new RuntimeException(\"zeta\");\n        if (code == 1) throw new RuntimeException(\"alpha\");"
    to: "if (code == 1) throw new RuntimeException(\"alpha\");\n        if (code == 2) throw new RuntimeException(\"zeta\");"
- name: observed-null-is-not-no-payload
  edits:
  - from: RuntimeException("alpha")
    to: RuntimeException((java.lang.String) null)
  expect:
  - path:
    - throws
    - 1
    - payload
    value: 'null'
- name: fully-qualified-runtime-exception-is-the-same-declared-throw
  edits:
    - { from: 'RuntimeException("alpha")', to: 'java.lang.RuntimeException("alpha")' }
    - { from: 'RuntimeException();', to: 'java.lang.RuntimeException();' }
- name: fully-qualified-null-text-constructor-keeps-its-payload
  edits:
    - { from: 'RuntimeException("alpha")', to: 'java.lang.RuntimeException((java.lang.String) null)' }
  expect:
    - { path: [throws, 1, payload], value: 'null' }
- name: equal-payloads-can-share-their-effective-domain
  edits:
  - from: RuntimeException("zeta")
    to: RuntimeException("alpha")
  expect:
  - path:
    - throws
    value:
    - type: java.lang.RuntimeException
      when: code == 3
    - type: java.lang.RuntimeException
      when: code <= 2 AND code >= 1
      payload: '"alpha"'
- name: first-match-domain-is-not-source-order-independent
  edits:
  - from: if (code == 2)
    to: if (code == 1)
  expect:
  - path:
    - throws
    value:
    - type: java.lang.RuntimeException
      when: code == 3
    - type: java.lang.RuntimeException
      when: code == 1
      payload: '"zeta"'
- name: nested-exclusive-branches-preserve-separate-payloads
  edits:
  - from: "if (code == 2) throw new RuntimeException(\"zeta\");\n        if (code == 1) throw new RuntimeException(\"alpha\");"
    to: "if (code == 1 || code == 2) {\n  if (code == 1) throw new RuntimeException(\"alpha\");\n  else throw new RuntimeException(\"\
      zeta\");\n}"
- name: exception-cause-is-not-a-text-message
  edits:
  - from: RuntimeException("alpha")
    to: RuntimeException(new RuntimeException())
  reject:
  - '[NORM-STATEMENT]'
- name: three-return-arms-do-not-turn-the-throw-domain-into-a-return
  edits:
  - from: "if (code == 2) throw new RuntimeException(\"zeta\");\n        if (code == 1) throw new RuntimeException(\"alpha\");\n   \
      \     if (code == 3) throw new RuntimeException();\n        return code;"
    to: "if (code == 1) return 10;\n        if (code == 2) return 20;\n        if (code == 3) return 30;\n        throw new RuntimeException(\"\
      invalid\");"
  expect:
  - path:
    - R
    value: "CASE\n  WHEN code == 1 THEN 10\n  WHEN code == 2 THEN 20\n  ELSE 30\nEND"
  - path:
    - throws
    value:
    - type: java.lang.RuntimeException
      when: code <= 0 OR code >= 4
      payload: '"invalid"'
