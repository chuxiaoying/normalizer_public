- name: same-character-as-octal-escape
  edits:
    - from: "'\\141'"
      to: "'a'"
- name: utf8-source-character-keeps-its-code-unit
  edits:
    - from: "'\\141'"
      to: "'中'"
  expect:
    - path: [R]
      value: '20023'

- name: backspace-escape-keeps-java-code-unit
  edits:
    - from: "'\\141'"
      to: "'\\b'"
  expect:
    - { path: [R], value: '18' }

- name: form-feed-escape-keeps-java-code-unit
  edits:
    - from: "'\\141'"
      to: "'\\f'"
  expect:
    - { path: [R], value: '22' }

- name: carriage-return-escape-is-not-a-physical-newline
  edits:
    - from: "'\\141'"
      to: "'\\r'"
  expect:
    - { path: [R], value: '23' }

- name: tab-escape-keeps-java-code-unit
  edits:
    - from: "'\\141'"
      to: "'\\t'"
  expect:
    - { path: [R], value: '19' }

- name: escaped-apostrophe-does-not-end-character
  edits:
    - from: "'\\141'"
      to: "'\\''"
  expect:
    - { path: [R], value: '49' }

- name: escaped-backslash-keeps-one-character
  edits:
    - from: "'\\141'"
      to: "'\\\\'"
  expect:
    - { path: [R], value: '102' }

- name: space-escape-is-one-code-unit
  edits:
    - from: "'\\141'"
      to: "'\\s'"
  expect:
    - { path: [R], value: '42' }

- name: octal-escape-may-have-one-digit
  edits:
    - from: "'\\141'"
      to: "'\\7'"
  expect:
    - { path: [R], value: '17' }

- name: octal-escape-with-high-first-digit-may-have-two-digits
  edits:
    - from: "'\\141'"
      to: "'\\77'"
  expect:
    - { path: [R], value: '73' }

- name: octal-escape-three-digits-has-an-upper-bound
  edits:
    - from: "'\\141'"
      to: "'\\377'"
  expect:
    - { path: [R], value: '265' }

- name: reject-empty-character-before-execution
  edits:
    - from: "'\\141'"
      to: "''"
  reject: ["[SOURCE-PARSE-FAILED]", "kind=PREPROCESS_REQUIRED", "expected one Java character"]

- name: reject-unknown-character-escape-before-execution
  edits:
    - from: "'\\141'"
      to: "'\\q'"
  reject: ["[SOURCE-PARSE-FAILED]", "kind=PREPROCESS_REQUIRED", "invalid Java literal escape"]

- name: reject-physical-newline-inside-a-character-before-execution
  edits:
    - from: "'\\141'"
      to: "'\n'"
  reject: ["[SOURCE-PARSE-FAILED]", "kind=PREPROCESS_REQUIRED", "line terminator in Java literal"]

- name: reject-octal-extra-digit-as-a-second-character
  edits:
    - from: "'\\141'"
      to: "'\\477'"
  reject: ["[SOURCE-PARSE-FAILED]", "kind=PREPROCESS_REQUIRED", "Java character literal must contain one UTF-16 code unit"]
