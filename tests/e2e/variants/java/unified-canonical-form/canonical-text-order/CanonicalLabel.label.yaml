- name: swapped-text-is-different
  edits:
    - from: 'return "zone-" + "42";'
      to: 'return "42" + "zone-";'
  expect:
    - path: [R]
      value: '"42zone-"'
- name: association-keeps-text-order
  edits:
    - from: 'return "zone-" + "42";'
      to: 'return "zone-" + ("" + "42");'
- name: preserves-newline-and-quote-in-ordered-content
  edits:
    - from: 'return "zone-" + "42";'
      to: 'return "zone-\n\141\"" + "42";'
  expect:
    - path: [R]
      value: '"zone-\na\"42"'

- name: unicode-repeated-u-marks-the-same-character
  edits:
    - from: "return \"zone-\" + \"42\";"
      to: "return \"\\uuu0041\";"
  expect:
    - { path: [R], value: "\"A\"" }

- name: unicode-paired-escapes-form-the-supplementary-character
  edits:
    - from: "return \"zone-\" + \"42\";"
      to: "return \"\\uD83D\\uDE00\";"
  expect:
    - { path: [R], value: "\"😀\"" }

- name: unicode-escape-produces-a-backslash-but-is-not-recursively-expanded
  edits:
    - from: "return \"zone-\" + \"42\";"
      to: "return \"\\u005c\\u006e\";"
  expect:
    - { path: [R], value: "\"\\n\"" }

- name: unicode-ineligible-backslash-stays-text
  edits:
    - from: "return \"zone-\" + \"42\";"
      to: "return \"\\\\u0041\";"
  expect:
    - { path: [R], value: "\"\\\\u0041\"" }

- name: unicode-line-terminator-finishes-a-comment-before-source-parsing
  edits:
    - from: "return \"zone-\" + \"42\";"
      to: "// comment\\u000a        return \"visible\";"
  expect:
    - { path: [R], value: "\"visible\"" }

- name: malformed-eligible-unicode-escape-is-invalid-even-in-comment
  edits:
    - from: "return \"zone-\" + \"42\";"
      to: "// invalid \\u00G1\n        return \"unreachable\";"
  reject: ["[SOURCE-PARSE-FAILED]", "kind=PREPROCESS_REQUIRED", "[JAVA-UNICODE-ESCAPE] expected four hexadecimal digits"]

- name: isolated-utf16-unit-in-comment-does-not-change-the-program
  edits:
    - from: "return \"zone-\" + \"42\";"
      to: "// comment \\uD800\n        return \"zone-\" + \"42\";"

- name: syntax-after-translated-line-terminator-keeps-physical-line-number
  edits:
    - from: "return \"zone-\" + \"42\";"
      to: "// comment\\u000a        return @;"
  reject: ["[SOURCE-PARSE-FAILED]", "kind=PREPROCESS_REQUIRED", "CanonicalLabel.java:3:", "expected expression"]

- name: a-text-right-operand-keeps-concrete-null-as-left-text
  edits:
    - { from: 'return "zone-" + "42";', to: 'return null + "s";' }
  expect:
    - { path: [R], value: '"nulls"' }
- name: unused-type-correct-object-method-does-not-change-selected-text
  edits:
    - from: 'class CanonicalLabel {'
      to: |-
        class CanonicalLabel {
            static Object unused(boolean choose) { return choose ? true : 1; }
