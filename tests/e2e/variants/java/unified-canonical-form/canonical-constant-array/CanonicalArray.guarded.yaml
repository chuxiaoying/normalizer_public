- name: inline-length-stops-after-first-failing-initializer-element
  edits:
    - { from: '(new int[]{2, 7})[-1]', to: '(new int[]{(new int[]{2})[1], (new int[-1]).length}).length' }

- name: swapping-failing-initializer-elements-changes-first-exception
  edits:
    - { from: '(new int[]{2, 7})[-1]', to: '(new int[]{(new int[-1]).length, (new int[]{2})[1]}).length' }
  expect:
    - { path: [throws, 0, type], value: java.lang.NegativeArraySizeException }

- name: inline-length-preserves-ordered-effects-and-conditional-element-completion
  entry: src/CanonicalArray.java#CanonicalArray.INSTANCE.readGuarded
  edits:
    - { from: 'static int guarded', to: 'int readGuarded' }
    - from: 'class CanonicalArray {'
      to: |-
        import normalizer.intrinsics.N;
        class InlineProbe { native int read(int value); }
        class CanonicalArray {
            static final CanonicalArray INSTANCE = new CanonicalArray(new InlineProbe());
            @N.External private final InlineProbe probe;
            CanonicalArray(InlineProbe probe) { this.probe = probe; }
    - from: |-
        if (fail) return (new int[]{2, 7})[-1];
                return 7;
      to: 'try { return (new int[]{probe.read(10), fail ? (new int[]{2})[1] : 5, probe.read(30)}).length; } catch (ArrayIndexOutOfBoundsException ignored) { return 42; }'
  expect:
    - { path: [entry, function], value: src/CanonicalArray.java#CanonicalArray.INSTANCE.readGuarded }
    - { path: [R], value: 'CASE WHEN fail THEN 42 ELSE 3 END' }
    - path: [S]
      add:
        - call: { external: src/CanonicalArray.java#CanonicalArray.INSTANCE.probe.read, args: ['10'], returns: number, result: $e_0 }
        - call: { external: src/CanonicalArray.java#CanonicalArray.INSTANCE.probe.read, args: ['30'], returns: number, result: $e_1, when: 'NOT (fail)' }
    - { path: [throws], absent: true }

- name: minimum-java-int-index-still-exits-only-on-the-guarded-path
  edits:
    - {from: '(new int[]{2, 7})[-1]', to: '(new int[]{2, 7})[-2147483648]'}

- name: maximum-java-int-index-is-not-a-wrapped-valid-position
  edits:
    - {from: '(new int[]{2, 7})[-1]', to: '(new int[]{2, 7})[2147483647]'}

- name: zero-index-into-an-empty-array-is-still-an-index-failure
  edits:
    - {from: '(new int[]{2, 7})[-1]', to: '(new int[]{})[0]'}

- name: static-wrapper-keeps-its-entry-and-the-singleton-effects
  edits:
    - { from: 'static int guarded', to: 'int readGuarded' }
    - from: 'class CanonicalArray {'
      to: |-
        import normalizer.intrinsics.N;
        class InlineProbe { native int read(int value); }
        class CanonicalArray {
            static final CanonicalArray INSTANCE = new CanonicalArray(new InlineProbe());
            @N.External private final InlineProbe probe;
            CanonicalArray(InlineProbe probe) { this.probe = probe; }
            static int guarded(boolean fail) { return INSTANCE.readGuarded(fail); }
    - from: |-
        if (fail) return (new int[]{2, 7})[-1];
                return 7;
      to: 'try { return (new int[]{probe.read(10), fail ? (new int[]{2})[1] : 5, probe.read(30)}).length; } catch (ArrayIndexOutOfBoundsException ignored) { return 42; }'
  expect:
    - { path: [R], value: 'CASE WHEN fail THEN 42 ELSE 3 END' }
    - path: [S]
      add:
        - call: { external: src/CanonicalArray.java#CanonicalArray.INSTANCE.probe.read, args: ['10'], returns: number, result: $e_0 }
        - call: { external: src/CanonicalArray.java#CanonicalArray.INSTANCE.probe.read, args: ['30'], returns: number, result: $e_1, when: 'NOT (fail)' }
    - { path: [throws], absent: true }

