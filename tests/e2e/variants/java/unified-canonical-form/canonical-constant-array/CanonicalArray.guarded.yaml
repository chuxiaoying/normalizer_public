- name: catch-the-actual-negative-array-size-type
  edits:
    - from: |-
        if (fail) return (new int[]{2, 7})[-1];
                return 7;
      to: 'try { return (new int[-1]).length; } catch (NegativeArraySizeException ignored) { return 23; }'
