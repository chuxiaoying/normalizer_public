- name: explicitly-grouped-effective-domains
  edits:
    - from: |-
        if (a) return 10;
                if (b) return 20;
                if (c) return 10;
      to: |-
        if (a || (!b && c)) return 10;
                if (!a && b) return 20;
- name: default-with-the-first-payload-preserves-intervening-priority
  edits:
    - { from: 'return 30;', to: 'return 10;' }
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN NOT (a) AND b THEN 20
          ELSE 10
        END
- name: explicit-complement-leaves-the-terminal-default-unreachable
  edits:
    - { from: 'return 30;', to: 'if (!c) return 30; return 40;' }
- name: earlier-matches-do-not-reappear-in-later-disjuncts
  edits:
    - { from: 'if (b) return 20;', to: 'if (a || b) return 20;' }
    - { from: 'if (c) return 10;', to: 'if (a || c) return 10;' }
