- name: permute-and-reassociate-conjunction
  edits:
    - from: '(balance && address) && consent'
      to: 'consent && (address && balance)'
- name: canonical-conjunction-is-stable
  edits:
    - from: '(balance && address) && consent'
      to: '(address && balance) && consent'
- name: redundant-total-conjunct
  edits:
    - from: '(balance && address) && consent'
      to: '(balance && address) && (address && consent)'
- name: disjunction-has-different-truth-set
  edits:
    - from: '(balance && address) && consent'
      to: 'consent || (balance || address)'
  expect:
    - path: [R]
      value: address OR balance OR consent
- name: permute-and-reassociate-disjunction
  edits:
    - from: '(balance && address) && consent'
      to: '(balance || consent) || address'
  expect:
    - path: [R]
      value: address OR balance OR consent
- name: same-total-guard-with-complementary-routes-is-one-factor
  edits:
    - { from: '(balance && address) && consent', to: '(address && balance) || (address && !balance)' }
  expect:
    - { path: [R], value: address }
- name: complementary-total-clauses-share-only-the-common-disjunct
  edits:
    - { from: '(balance && address) && consent', to: '(address || balance) && (address || !balance)' }
  expect:
    - { path: [R], value: address }
- name: different-inputs-are-not-a-complementary-pair
  edits:
    - { from: '(balance && address) && consent', to: '(address && balance) || (address && !consent)' }
  expect:
    - { path: [R], value: 'address AND (balance OR NOT (consent))' }
