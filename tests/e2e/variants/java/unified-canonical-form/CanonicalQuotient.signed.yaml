- name: concrete-locals-and-direct-literals-have-the-same-quotient-and-remainder
  edits:
    - { from: 'return (-13 / 5) * 10 + (-13 % 5);', to: 'int numerator = -13, divisor = 5; return (numerator / divisor) * 10 + (numerator % divisor);' }
- name: a-negative-divisor-does-not-change-the-dividend-sign-of-the-remainder
  edits:
    - { from: 'return (-13 / 5) * 10 + (-13 % 5);', to: 'return (13 / -5) * 10 + (13 % -5);' }
  expect:
    - { path: [R], value: '-17' }
- name: a-symbolic-dividend-does-not-become-an-invented-constant
  edits:
    - { from: 'static long signed()', to: 'static long signed(int input)' }
    - { from: 'return (-13 / 5) * 10 + (-13 % 5);', to: 'return input / 5;' }
  reject: ['division and remainder require concrete integers']
