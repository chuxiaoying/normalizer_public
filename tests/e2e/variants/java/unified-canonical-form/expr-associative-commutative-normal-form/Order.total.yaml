- name: reverse-source-order
  edits:
    - from: 'return value + base;'
      to: 'return base + value;'
- name: add-offset
  edits:
    - from: 'return value + base;'
      to: 'return value + base + 1;'
  expect:
    - path: [R]
      value: base + value + 1
- name: add-left-associated
  edits:
    - from: 'return value + base;'
      to: 'return (value + 2) + base;'
  expect:
    - path: [R]
      value: base + value + 2
- name: add-right-associated
  edits:
    - from: 'return value + base;'
      to: 'return 2 + (base + value);'
  expect:
    - path: [R]
      value: base + value + 2
- name: multiply-right-associated
  edits:
    - from: 'return value + base;'
      to: 'return value * (base * value);'
  expect:
    - path: [R]
      value: base * value * value
- name: multiply-left-associated
  edits:
    - from: 'return value + base;'
      to: 'return (value * value) * base;'
  expect:
    - path: [R]
      value: base * value * value
- name: a-right-case-stays-the-subtrahend-without-net-simplification
  edits:
    - { from: 'return value + base;', to: 'return base - (value > 0 ? 3 : 7);' }
  expect:
    - path: [R]
      value: |-
        base - CASE
          WHEN value > 0 THEN 3
          ELSE 7
        END
- name: a-left-case-stays-the-minuend-without-net-simplification
  edits:
    - { from: 'return value + base;', to: 'return (value > 0 ? 3 : 7) - base;' }
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN value > 0 THEN 3
          ELSE 7
        END - base
- name: two-cases-do-not-form-a-cross-product-for-subtraction
  edits:
    - { from: 'return value + base;', to: 'return (base > 0 ? 3 : 7) - (value > 0 ? 1 : 2);' }
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN base > 0 THEN 3
          ELSE 7
        END - CASE
          WHEN value > 0 THEN 1
          ELSE 2
        END
- name: acquired-exact-input-subtracts-to-zero
  edits:
    - { from: 'return value + base;', to: 'return value - value;' }
  expect:
    - { path: [R], value: '0' }
- name: acquired-exact-input-cancels-in-each-case-arm
  edits:
    - { from: 'return value + base;', to: 'return (value > 0 ? value : value + 2) - value;' }
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN value > 0 THEN 0
          ELSE 2
        END
