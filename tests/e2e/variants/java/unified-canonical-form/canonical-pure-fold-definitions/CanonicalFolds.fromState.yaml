- name: explicit-state-receiver-preserves-dependency
  edits:
    - from: int initial = seed.value;
      to: int initial = this.seed.value;
- name: private-state-read-local-name-does-not-leak
  edits:
    - from: int initial = seed.value;
      to: int before = seed.value;
    - from: 'reduce values from initial'
      to: 'reduce values from before'
- name: same-input-and-state-name-does-not-capture-the-parameter
  edits:
    - from: fromState(int[] values)
      to: fromState(int[] values, int seed)
    - from: int initial = seed.value;
      to: int initial = this.seed.value;
  expect:
    - path: [P, parameters]
      value:
        values: { position: 0, type: 'number[]' }
        seed: { position: 1, type: number }
    - path: [T, 0, initial]
      value: E.seed.value

- name: the-selected-state-member-rather-than-sibling-initializes-the-fold
  edits:
    - {from: 'class Base { int value; }', to: 'class Base { int value; int offset; }'}
    - {from: 'int initial = seed.value;', to: 'int initial = seed.offset;'}
  expect:
    - {path: [types, Base, fields, offset], add: number}
    - {path: [T, 0, initial], value: seed.offset}
