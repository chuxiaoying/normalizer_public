- name: explicit-initializer-with-trailing-comma
  edits:
    - from: '{2, 7}'
      to: 'new int[]{2, 7,}'
- name: array-slot-order-must-not-sort
  edits:
    - from: '{2, 7}'
      to: '{7, 2}'
  expect:
    - path: [R]
      value: '72'
- name: comparison-is-not-generic-nesting
  edits:
    - from: '{2, 7}'
      to: '{(1 < 2 ? 2 : 9), 7}'
- name: missing-array-separator-must-not-ignore-source
  edits:
    - from: '{2, 7}'
      to: '{2 7}'
  reject: ['SOURCE-PARSE-FAILED']
