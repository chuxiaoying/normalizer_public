- name: explicit-closed-intervals
  edits:
    - from: 'quantity < 0'
      to: 'quantity <= -1'
    - from: |-
        if (quantity < 3) return 20;
                if (quantity <= 5) return 20;
      to: 'if (quantity >= 0 && quantity <= 5) return 20;'
- name: literal-first-comparisons-keep-the-same-effective-partition
  edits:
    - { from: 'quantity < 0', to: '0 > quantity' }
    - { from: 'quantity < 3', to: '3 > quantity' }
    - { from: 'quantity <= 5', to: '5 >= quantity' }
- name: overlapping-priority-is-observable
  edits:
    - from: |-
        if (quantity < 0) return 10;
                if (quantity < 3) return 20;
      to: |-
        if (quantity < 3) return 20;
                if (quantity < 0) return 10;
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN quantity > 5 THEN 30
          ELSE 20
        END
- name: partition-endpoint-beyond-signed-word
  edits:
    - from: 'band(int quantity)'
      to: 'band(long quantity)'
    - from: |-
        if (quantity < 0) return 10;
                if (quantity < 3) return 20;
                if (quantity <= 5) return 20;
      to: |-
        if (quantity <= 9223372036854775807L) return 10;
                if (quantity <= 9223372036854775807L + 1) return 20;
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN quantity <= 9223372036854775807 THEN 10
          WHEN quantity == 9223372036854775808 THEN 20
          ELSE 30
        END
- name: nonadjacent-singletons-remain-disjoint
  edits:
    - from: |-
        if (quantity < 0) return 10;
                if (quantity < 3) return 20;
                if (quantity <= 5) return 20;
      to: |-
        if (quantity == -2) return 10;
                if (quantity == 0) return 20;
                if (quantity == 2) return 10;
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN quantity == -2 OR quantity == 2 THEN 10
          WHEN quantity == 0 THEN 20
          ELSE 30
        END
- name: disjoint-integer-sign-arms-prove-the-throw-is-unreachable
  edits:
    - from: |-
        if (quantity < 0) return 10;
                if (quantity < 3) return 20;
                if (quantity <= 5) return 20;
                return 30;
      to: 'if (quantity > 0) return 1; if (quantity < 0) return -1; if (quantity == 0) return 0; throw new RuntimeException("unreachable");'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN quantity >= 1 THEN 1
          WHEN quantity <= -1 THEN -1
          ELSE 0
        END
- name: the-explicit-zero-default-has-the-same-exhaustive-partition
  edits:
    - from: |-
        if (quantity < 0) return 10;
                if (quantity < 3) return 20;
                if (quantity <= 5) return 20;
                return 30;
      to: 'if (quantity > 0) return 1; if (quantity < 0) return -1; return 0;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN quantity >= 1 THEN 1
          WHEN quantity <= -1 THEN -1
          ELSE 0
        END
- name: exact-decimal-open-interval-does-not-use-integer-successor
  edits:
    - { from: 'band(int quantity)', to: 'band(double quantity)' }
    - from: |-
        if (quantity < 0) return 10;
                if (quantity < 3) return 20;
                if (quantity <= 5) return 20;
      to: |-
        if (quantity <= 0) return 10;
                if (quantity < 1) return 20;
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN quantity <= 0 THEN 10
          WHEN quantity < 1 THEN 20
          ELSE 30
        END
- name: exact-decimal-open-interval-with-literal-first-comparisons
  edits:
    - { from: 'band(int quantity)', to: 'band(double quantity)' }
    - from: |-
        if (quantity < 0) return 10;
                if (quantity < 3) return 20;
                if (quantity <= 5) return 20;
      to: |-
        if (0 >= quantity) return 10;
                if (1 > quantity) return 20;
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN quantity <= 0 THEN 10
          WHEN quantity < 1 THEN 20
          ELSE 30
        END
