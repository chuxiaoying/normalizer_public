- name: include-upper-bound
  edits:
    - from: 'int total = 0;'
      to: 'int total = 0; int exclusiveEnd = limit + 1;'
    - from: '[0, limit) as i'
      to: '[0, exclusiveEnd) as i'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN limit + 1 > 0 THEN limit + 1
          ELSE 0
        END
