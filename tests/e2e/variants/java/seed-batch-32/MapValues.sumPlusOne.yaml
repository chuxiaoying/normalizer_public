- name: map-times-two
  edits:
    - from: 'value + 1'
      to: 'value * 2'
  expect:
    - path: [R]
      value: COALESCE(SUM(SELECT value * 2 FROM values), 0)
- name: map-negative-one
  edits:
    - from: 'value + 1'
      to: 'value - 1'
  expect:
    - path: [R]
      value: COALESCE(SUM(SELECT value - 1 FROM values), 0)
- name: sum-with-constant-false-filter-is-zero
  edits:
    - from: 'as value yield'
      to: 'as value where false yield'
  expect: [{path: [R], value: '0'}]
- name: later-filter-cannot-repopulate-empty-relation
  edits:
    - from: 'as value yield'
      to: 'as value where false and value > 0 yield'
  expect: [{path: [R], value: '0'}]
