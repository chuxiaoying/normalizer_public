- name: increment-enabled-branch
  edits:
    - from: 'return enabled ? value : value + 1;'
      to: 'return enabled ? value + 1 : value;'
  expect:
    - path: [R]
      value: CASE WHEN enabled THEN value + 1 ELSE value END
- name: widen-disabled-branch
  edits:
    - from: 'return enabled ? value : value + 1;'
      to: 'return enabled ? value : value + 2;'
  expect:
    - path: [R]
      value: CASE WHEN enabled THEN value ELSE value + 2 END
