- name: subtract-offset
  edits:
    - from: 'return value + 1 == target;'
      to: 'return value - 1 == target;'
  expect:
    - path: [R]
      value: target == value - 1
- name: target-shift-is-the-same-solved-constraint-as-subtract-offset
  edits:
    - from: 'return value + 1 == target;'
      to: 'return value + 1 == target + 2;'
  expect:
    - path: [R]
      value: target == value - 1
- name: affine-offset-normal-form-survives-reversed-equation
  edits:
    - { from: 'return value + 1 == target;', to: 'return target + 2 == 1 + value;' }
  expect:
    - { path: [R], value: target == value - 1 }
- name: affine-offset-normal-form-keeps-a-different-solution-set
  edits:
    - { from: 'return value + 1 == target;', to: 'return target + 3 == 1 + value;' }
  expect:
    - { path: [R], value: target == value - 2 }
