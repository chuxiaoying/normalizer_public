- name: shift-equation
  edits:
    - from: 'value + 1 == target && target <= limit'
      to: 'value + 2 == target && target <= limit'
  expect:
    - path: [R]
      value: limit >= target AND target == value + 2
- name: strict-limit
  edits:
    - from: 'value + 1 == target && target <= limit'
      to: 'value + 1 == target && target < limit'
  expect:
    - path: [R]
      value: limit > target AND target == value + 1

- name: proportional-equations-have-one-integer-solution-domain
  edits:
    - from: return value + 1 == target && target <= limit;
      to: return value + target == 10 && 2 * (value + target) == 20;
  expect:
    - path: [R]
      value: target + value == 10
