- name: shift-equation
  edits:
    - from: 'value + 1 == target && target <= limit'
      to: 'value + 2 == target && target <= limit'
  expect:
    - path: [R]
      value: limit >= target AND target == value + 2
- name: strict-limit
  edits:
    - from: 'value + 1 == target && target <= limit'
      to: 'value + 1 == target && target < limit'
  expect:
    - path: [R]
      value: limit > target AND target == value + 1

- name: proportional-equations-have-one-integer-solution-domain
  edits:
    - from: return value + 1 == target && target <= limit;
      to: return value + target == 10 && 2 * (value + target) == 20;
  expect:
    - path: [R]
      value: target + value == 10

- name: independent-affine-equations-determine-the-unique-integer-solution
  edits:
    - from: 'return value + 1 == target && target <= limit;'
      to: 'return 2 * value + target == 11 && value - target == 1;'
  expect:
    - { path: [R], value: 'target == 3 AND value == 4' }
- name: positive-rank-subsystem-must-not-hide-an-inconsistent-extra-row
  edits:
    - from: 'return value + 1 == target && target <= limit;'
      to: 'return 2 * value + target == 11 && value - target == 1 && value + target == 0;'
  expect:
    - { path: [R], value: 'false' }
- name: proportional-equations-do-not-erase-an-independent-limiting-equality
  edits:
    - from: 'return value + 1 == target && target <= limit;'
      to: 'return value + target == 10 && 2 * (value + target) == 20 && limit == 4;'
  expect:
    - { path: [R], value: 'limit == 4 AND target + value == 10' }
