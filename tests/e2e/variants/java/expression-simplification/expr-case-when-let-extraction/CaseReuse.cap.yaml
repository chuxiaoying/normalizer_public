- name: reverse-case-arms
  edits:
    - from: "return adjusted > limit ? limit : adjusted + base;"
      to: "return adjusted <= limit ? adjusted + base : limit;"
- name: change-adjustment-without-case
  edits:
    - from: "int adjusted = value + 1;"
      to: "int adjusted = value + 2;"
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN limit < value + 2 THEN limit
          ELSE base + value + 2
        END
- name: inline-single-use-conditional
  edits:
    - from: 'int adjusted = value + 1;'
      to: 'int adjusted = value == 0 ? 2 : value;'
    - from: 'return adjusted > limit ? limit : adjusted + base;'
      to: 'return adjusted;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN value == 0 THEN 2
          ELSE value
        END
