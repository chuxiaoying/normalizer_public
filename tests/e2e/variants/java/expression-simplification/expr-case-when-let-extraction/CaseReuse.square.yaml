- name: single-use-stays-inline
  edits:
    - from: return total * total;
      to: return total;
  expect:
    - path: [R]
      value: COALESCE(SUM(SELECT value + CASE WHEN enabled THEN extra ELSE 0 END FROM values), 0)
- name: repeated-query-without-case-stays-inline
  edits:
    - from: 'enabled ? extra : 0'
      to: extra
  expect:
    - path: [R]
      value: COALESCE(SUM(SELECT value + extra FROM values), 0) * COALESCE(SUM(SELECT value + extra FROM values), 0)
- name: repeated-use-under-return-guard-is-not-hoisted
  edits:
    - from: return total * total;
      to: 'if (extra > 0) return total * total; return 0;'
  expect:
    - path: [R]
      value: |-
        CASE
          WHEN extra <= 0 THEN 0
          ELSE COALESCE(SUM(SELECT value + CASE WHEN enabled THEN extra ELSE 0 END FROM values), 0) * COALESCE(SUM(SELECT value + CASE WHEN enabled THEN extra ELSE 0 END FROM values), 0)
        END
