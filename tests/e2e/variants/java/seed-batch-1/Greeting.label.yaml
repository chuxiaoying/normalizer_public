- name: change-prefix
  edits:
    - from: 'return name;'
      to: 'return fallback;'
  expect:
    - path: [R]
      value: fallback
- name: concatenate-text-constants-in-source-order
  edits:
    - from: 'return name;'
      to: 'return "上海" + "" + "账单";'
  expect:
    - path: [R]
      value: '"上海账单"'
- name: concatenate-null-constant-as-text
  edits:
    - from: 'return name;'
      to: 'return "备用：" + null;'
  expect:
    - path: [R]
      value: '"备用：null"'
- name: preserve-long-unicode-text
  edits:
    - from: 'return name;'
      to: 'return "请核对本期账单金额和到期日确认账户信息与服务记录一致如有疑问请联系客户服务团队并提供账单编号以便工作人员及时查询处理结果并反馈相关进度请妥善保留回执作为后续凭证谢谢配合请注";'
  expect:
    - path: [R]
      value: '"请核对本期账单金额和到期日确认账户信息与服务记录一致如有疑问请联系客户服务团队并提供账单编号以便工作人员及时查询处理结果并反馈相关进度请妥善保留回执作为后续凭证谢谢配合请注"'
