- name: remove-redundant-switch
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return active;'
- name: raise-score-threshold
  edits:
    - from: 'score >= 60'
      to: 'score >= 70'
  expect:
    - path: [R]
      value: score >= 70
- name: comparing-total-boolean-to-true-retains-the-predicate
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return active == true;'
- name: comparing-total-boolean-to-false-negates-the-predicate
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return active == false;'
  expect: [{path: [R], value: score < 60}]
- name: explicit-false-default-is-the-same-boolean-predicate
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return active ? active : false;'
- name: every-valid-score-implies-the-redundant-exclusion
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return (score == 1 || score == 2) && preferred && score != 3;'
  expect:
    - { path: [R], value: 'preferred AND (score == 1 OR score == 2)' }
- name: an-exclusion-matching-a-real-alternative-cannot-be-absorbed
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return (score == 1 || score == 2) && preferred && score != 2;'
  expect:
    - { path: [R], value: 'preferred AND score == 1' }
- name: one-total-integer-is-always-positive-negative-or-zero
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return score > 0 || score < 0 || score == 0;'
  expect:
    - { path: [R], value: 'true' }
- name: zero-from-a-different-integer-does-not-prove-exhaustiveness
  edits:
    - { from: 'int score, boolean preferred', to: 'int score, int alternate' }
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return score > 0 || score < 0 || alternate == 0;'
  expect:
    - path: [P, parameters]
      value: { score: { position: 0, type: number }, alternate: { position: 1, type: number } }
    - { path: [R], value: 'alternate == 0 OR score < 0 OR score > 0' }
- name: known-integer-comparisons-execute-with-exact-endpoints
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return 3 <= 4 && 3 <= 3 && 3 == 3 && 3 != 4 && -4 < -3 && 4 >= 3 && 4 > 3;'
  expect:
    - { path: [R], value: 'true' }
- name: known-adjacent-and-equal-points-do-not-match-strict-comparisons
  edits:
    - from: 'return (active && preferred) || (active && !preferred);'
      to: 'return 3 < 3 || 4 <= 3 || 3 == 4;'
  expect:
    - { path: [R], value: 'false' }
