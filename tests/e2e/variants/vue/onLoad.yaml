    to: "yield netAmount\n    */\n    const first = total\n    /* @normalizer-ir total += sum from rows\
      \ as row\n         where row.dueDate <= today and row.priority >= profile.minPriority\n        \
      \ let netAmount = row.amount - row.waivedAmount\n         where netAmount > 0 yield netAmount */"
  - file: src/ArrearsPage.ts
