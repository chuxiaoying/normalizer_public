    from: "yield netAmount\n    */"
    to: "yield netAmount\n    */\n    const first = total\n    /* @normalizer-ir total += sum from rows as row\n         where row.dueDate\
      \ <= props.today and row.priority >= profile.minPriority\n         let netAmount = row.amount - row.waivedAmount\n         where\
      \ netAmount > 0 yield netAmount */"
  - file: src/ArrearsPage.mjs
    from: 'total > profile.quota ? profile.quota : total'
    to: 'total === first + first ? 701 : 702'
  expect:
  - path:
    - S
    - 5
    - write
    - value
