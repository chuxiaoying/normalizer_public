- name: replace-total-at-second-directive
  edits:
  - file: src/ArrearsPage.mjs
    from: "yield netAmount\n    */"
    to: "yield netAmount\n    */\n    /* @normalizer-ir total = sum from rows as row yield row.priority */"
  expect:
  - path:
    - S
    - 5
    - write
    - value
    value: "CASE\n  WHEN $e_0.quota < COALESCE(\n    SUM(\n      SELECT row.priority\n      FROM $e_1 AS row\n    ),\n    0\n  ) THEN\
      \ $e_0.quota\n  ELSE COALESCE(\n    SUM(\n      SELECT row.priority\n      FROM $e_1 AS row\n    ),\n    0\n  )\nEND"
- name: accumulate-into-initialized-zero
  edits:
  - file: src/ArrearsPage.mjs
    from: "let total\n    /* @normalizer-ir\n       total = sum"
    to: "let total = 0\n    /* @normalizer-ir\n       total += sum"
- name: unknown-second-directive
