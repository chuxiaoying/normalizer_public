- name: chained-local-read
  edits:
    - file: src/ArrearsPage.mjs
      from: 'return arrears.status.ready ? arrears.summary.payable : 0'
      to: |-
        const ready = arrears.status.ready
          const value = arrears.summary.payable
          const visible = ready ? value : 0
          return visible

- name: local-fallback-three
  edits:
    - file: src/ArrearsPage.mjs
      from: 'return arrears.status.ready ? arrears.summary.payable : 0'
      to: |-
        const fallback = 3
          return arrears.status.ready ? arrears.summary.payable : fallback
  expect:
    - path: [R]
      value: CASE WHEN arrears.status.ready THEN arrears.summary.payable ELSE 3 END

- name: plain-state-record-alias
  edits:
    - file: src/ArrearsPage.mjs
      from: 'return arrears.status.ready ? arrears.summary.payable : 0'
      to: |-
        const page = arrears
          const state = page.status
          return state.ready ? page.summary.payable : 0

- name: missing-component-observation
  edits:
    - file: src/ArrearsPage.mjs
      from: '/** @componentProp PayableCard#balance.amount */'
      to: '/** Missing explicit component observation. */'
  reject: ['SCENARIO_MODULE_INPUT', 'missing or invalid @componentProp on amount']
