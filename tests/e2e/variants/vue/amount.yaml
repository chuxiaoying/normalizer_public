- name: chained-local-read
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.ready ? arrears.summary.payable : 0'
    to: "const ready = arrears.status.ready\n  const value = arrears.summary.payable\n  const visible\
      \ = ready ? value : 0\n  return visible"
- name: local-fallback-three
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.ready ? arrears.summary.payable : 0'
    to: "const fallback = 3\n  return arrears.status.ready ? arrears.summary.payable : fallback"
  expect:
  - path:
    - R
    value: CASE WHEN arrears.status.ready THEN arrears.summary.payable ELSE 3 END
- name: plain-state-record-alias
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.ready ? arrears.summary.payable : 0'
    to: "const page = arrears\n  const state = page.status\n  return state.ready ? page.summary.payable\
      \ : 0"
- name: missing-component-observation
  edits:
  - file: src/ArrearsPage.ts
    from: /** @N componentProp PayableCard#balance.amount */
    to: /** Missing explicit component observation. */
  reject:
  - 'SCENARIO_MODULE_INPUT:'
  - missing or invalid @N componentProp on amount
- name: exact-field-bracket-notation
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.ready ? arrears.summary.payable : 0'
    to: 'return arrears[''status''][''ready''] ? arrears[''summary''][''payable''] : 0'
- name: dotted-key-is-not-a-nested-path
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.ready ? arrears.summary.payable : 0'
    to: 'return arrears.status.ready ? arrears[''summary.payable''] : 0'
