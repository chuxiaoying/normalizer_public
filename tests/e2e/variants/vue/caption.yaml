- name: local-caption-branches
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.loading ? "加载中" : "应付金额"'
    to: "const busy = arrears.status.loading\n  const loading = \"加载中\", title = \"应付金额\"\n  return busy\
      \ ? loading : title"
- name: renamed-loading-caption
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.loading ? "加载中" : "应付金额"'
    to: "const loading = \"查询中\"\n  return arrears.status.loading ? loading : \"应付金额\""
  expect:
  - path:
    - R
    value: CASE WHEN arrears.status.loading THEN "查询中" ELSE "应付金额" END
- name: forward-local-reference
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.loading ? "加载中" : "应付金额"'
    to: "const early = later\n  const later = \"查询中\"\n  return arrears.status.loading ? early : \"应付金额\""
  reject:
  - 'SCENARIO_MODULE_INPUT:'
  - Block-scoped variable 'later' used before its declaration
- name: directive-in-return-expression
  edits:
  - file: src/ArrearsPage.ts
    from: 'return arrears.status.loading ? "加载中" : "应付金额"'
    to: 'return arrears.status.loading ? /* @normalizer-ir extra = unknown */ "加载中" : "应付金额"'
  reject:
  - 'SCENARIO_MODULE_INPUT:'
  - '@normalizer-ir must appear between statements'
- name: entry-state-annotation-binds-one-source-variable
  edits:
  - file: src/ArrearsPage.ts
    from: const arrears = {
    to: const another = 0, arrears = {
  reject:
  - 'SCENARIO_MODULE_INPUT:'
  - '@N entryState must mark one named binding'
- name: prepared-component-projection-has-no-function-argument
  edits:
  - file: src/ArrearsPage.ts
    from: export function caption()
    to: 'export function caption(unbound: number)'
  reject:
  - 'SCENARIO_MODULE_INPUT:'
  - prepared component projection caption requires a synchronous exported function with a return expression
    and no parameters

- name: projection-preflight-rejects-an-unused-helper-with-resolved-any
  edits:
    - file: src/ArrearsPage.ts
      from: '/** @N componentProp PayableCard#balance.caption */'
      to: |-
        function unchecked() { return JSON.parse("{}") }
        /** @N componentProp PayableCard#balance.caption */
  reject: ['SCENARIO_MODULE_INPUT:', 'resolved any is not an admitted analysis type']
