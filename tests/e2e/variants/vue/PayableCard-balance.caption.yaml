- name: local-caption-branches
  edits:
    - file: src/ArrearsPage.mjs
      from: "return arrears.status.loading ? '加载中' : '应付金额'"
      to: |-
        const busy = arrears.status.loading
          const loading = '加载中', title = '应付金额'
          return busy ? loading : title

- name: renamed-loading-caption
  edits:
    - file: src/ArrearsPage.mjs
      from: "return arrears.status.loading ? '加载中' : '应付金额'"
      to: |-
        const loading = '查询中'
          return arrears.status.loading ? loading : '应付金额'
  expect:
    - path: [R]
      value: CASE WHEN arrears.status.loading THEN "查询中" ELSE "应付金额" END

- name: forward-local-reference
  edits:
    - file: src/ArrearsPage.mjs
      from: "return arrears.status.loading ? '加载中' : '应付金额'"
      to: |-
        const early = later
          const later = '查询中'
          return arrears.status.loading ? early : '应付金额'
  reject: ['SCENARIO_MODULE_INPUT:', 'unbound projection local later']

- name: directive-in-return-expression
  edits:
    - file: src/ArrearsPage.mjs
      from: "return arrears.status.loading ? '加载中' : '应付金额'"
      to: "return arrears.status.loading ? /* @normalizer-ir extra = unknown */ '加载中' : '应付金额'"
  reject: ['SCENARIO_MODULE_INPUT:', '@normalizer-ir must appear between statements']

- name: entry-state-annotation-binds-one-source-variable
  edits:
    - file: src/ArrearsPage.mjs
      from: 'const arrears = {'
      to: 'const another = 0, arrears = {'
  reject: ['SCENARIO_MODULE_INPUT:', '@entryState must mark one named binding']

- name: prepared-component-projection-has-no-function-argument
  edits:
    - file: src/ArrearsPage.mjs
      from: 'export function caption()'
      to: 'export function caption(unbound)'
  reject: ['SCENARIO_MODULE_INPUT:', 'prepared component projection caption requires a synchronous exported function with a return expression and no parameters']
