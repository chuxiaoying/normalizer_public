version: 1
java_edition: 25
families:
  switch:
    title: 分支选择 switch
    leaves:
      independent-colon-groups:
        focus: 冒号分支的整数标签、默认分支和互斥分支的定形
        seed: control-switch-branch
        evidence:
          - [SwitchMode.classify, original, pers]
          - [SwitchMode.classify, same-integer-cases-in-reverse-order, pers]
          - [SwitchMode.classify, change-default, pers]
      arrow-rules:
        focus: 箭头规则中的块、赋值后继续和异常完成
        seed: control-switch-branch
        evidence:
          - [SwitchMode.classify, arrow-rules-keep-the-same-return-paths, pers]
          - [SwitchMode.classify, arrow-assignment-is-executed-before-the-continuation, pers]
          - [SwitchMode.classify, arrow-throw-is-abrupt-only-on-its-own-path, pers]
      grouped-labels:
        focus: 多个标签共用一个分支体，保留单一异常来源
        seed: control-switch-branch
        evidence:
          - [SwitchMode.classify, comma-labels-also-apply-to-colon-groups, pers]
          - [SwitchMode.classify, comma-labels-share-one-return-arm, pers]
          - [SwitchMode.classify, comma-labels-share-one-abrupt-site, pers]
      exact-constant-labels:
        focus: 不回卷的闭整数加、减、乘标签按常量值匹配
        seed: control-switch-branch
        evidence:
          - [SwitchMode.classify, constant-arithmetic-labels-are-native, pers]
      text-matching:
        focus: String 选择按内容匹配，重排等价分支不改变 PERS
        seed: control-switch-branch
        evidence:
          - [Stage.read, original, pers]
          - [Stage.read, disjoint-text-labels-paused-first, pers]
          - [Stage.read, disjoint-text-labels-ready-first, pers]
          - [Stage.read, disjoint-text-labels-distinct-results, pers]
      nullable-text-selector:
        focus: 不含空值标签时，可空 String 的 null 走异常而非默认分支
        seed: control-switch-branch
        evidence:
          - [Stage.read, null-throws-instead-of-selecting-default, pers]
      unicode-label-order:
        focus: 补充码点与孤立代理项按统一定形规则排序
        seed: control-switch-branch
        evidence:
          - [Stage.read, case-label-order-is-codepoints-with-isolated-units, pers]
          - [Stage.read, opposite-source-order-keeps-same-unicode-case-result, pers]
      duplicate-labels:
        focus: 重复标签按值拒绝，包括逗号列表、整数折叠和 Unicode 转义
        seed: control-switch-branch
        evidence:
          - [SwitchMode.classify, comma-list-does-not-hide-a-duplicate, reject]
          - [SwitchMode.classify, duplicate-discovered-after-constant-folding, reject]
          - [Stage.read, unicode-escape-does-not-make-a-different-label, reject]
      invalid-rule-shapes:
        focus: 非语句表达式、同一块混用冒号组和箭头规则须拒绝
        seed: control-switch-branch
        evidence:
          - [SwitchMode.classify, arrow-switch-statements-reject-a-bare-value, reject]
          - [SwitchMode.classify, switch-block-cannot-mix-arrow-and-colon, reject]
      colon-fall-through:
        focus: 命中后继续执行下一组，直到离开 switch
        seed: control-switch-branch
        evidence:
          - [SwitchMode.classify, colon-fallthrough-updates-the-next-group, pers]
          - [SwitchMode.classify, colon-default-in-the-middle-only-matches-if-no-label-does, pers]
          - [SwitchMode.classify, colon-break-prevents-fallthrough, pers]
          - [SwitchMode.classify, earlier-return-cannot-enter-a-later-switch-group, pers]
      nested-break:
        focus: 无标签 break 停止最近的 switch 或循环，不串到外层，保留已写局部值
        seed: control-switch-branch
        evidence:
          - [SwitchMode.classify, arrow-nested-break-preserves-written-local, pers]
          - [SwitchMode.classify, nested-break-only-prevents-its-own-fallthrough-path, pers]
          - [SwitchMode.classify, inner-switch-does-not-consume-outer-break, pers]
          - [SwitchMode.classify, loop-break-does-not-leave-an-enclosing-switch, pers]
          - [SwitchMode.classify, break-without-an-enclosing-transfer-target-is-invalid, reject]
      value-expression:
        focus: 产生值的 switch 表达式，区分箭头值与块内 yield
        gap: review
      pattern-and-null-labels:
        focus: 模式绑定、显式 null 标签和守卫的匹配范围
        gap: review
  lambda:
    title: Lambda 表达式与调用
    leaves:
      expression-and-block-body:
        focus: 源码内标量 SAM 的表达式体、等价的单 return 块和多个形参
        seed: java-closed-lambda
        evidence:
          - [Quote.run, original, pers]
          - [Quote.run, block-return-preserves-lexical-scalar-capture, pers]
          - [Quote.run, two-lambda-parameters-keep-their-argument-order, pers]
          - [Quote.run, lambda-arity-must-match-the-sam, reject]
      effectively-final-capture:
        focus: 区分捕获的有效 final 标量局部值和调用实参
        seed: java-closed-lambda
        evidence:
          - [Quote.run, original, pers]
      invalid-mutable-capture:
        focus: 被再次写入的标量局部变量不得作为合法捕获
        seed: java-closed-lambda
        evidence:
          - [Quote.run, captured-local-must-be-effectively-final, reject]
      blank-scalar-capture:
        focus: 空白标量局部变量在捕获之前完成一次无歧义赋值，完整条件两臂分别赋值也成立
        seed: java-closed-lambda
        evidence:
          - [Quote.run, blank-local-assigned-once-is-effectively-final, pers]
          - [Quote.run, blank-local-assigned-once-in-each-if-arm, pers]
          - [Quote.run, blank-capture-must-be-assigned-on-all-paths, reject]
          - [Quote.run, blank-capture-cannot-be-assigned-twice-on-a-path, reject]
      creation-versus-invocation:
        focus: 创建闭合 Lambda 不执行标量函数体，除零只发生在实际调用路径
        seed: java-closed-lambda
        evidence:
          - [Quote.run, unused-closure-does-not-evaluate-its-body, pers]
          - [Quote.run, invoked-closure-throws-only-on-the-call-path, pers]
      reference-receiver-in-lambda:
        focus: 闭合 Lambda 保留引用和调用参数顺序，空接收者只在实际调用时抛异常
        seed: java-closed-lambda
        evidence:
          - [Quote.run, reference-capture-does-not-check-null-at-creation, pers]
          - [Quote.run, reference-capture-checks-null-on-the-invocation-path, pers]
          - [Quote.run, reference-capture-reads-the-same-heap-object, pers]
          - [Quote.run, reference-capture-keeps-caller-argument-failure-first, pers]
          - [Quote.run, unused-lambda-still-needs-a-valid-receiver-member, reject]
      general-lambda-body-and-scope:
        focus: 嵌套块声明、显式参数类型、多语句体、泛型目标类型和函数值流动
        seed: java-closed-lambda
        gap: review
  interface-default-methods:
    title: 接口默认方法与分派
    leaves:
      inherited-default:
        focus: 确定接收者执行实际继承的默认本体
        seed: object-polymorphic-dispatch
        evidence:
          - [Billing.chargeClosed, closed-default-body-is-ordinary-native-dispatch, pers]
      explicit-class-override:
        focus: 类覆盖消解多个接口的默认方法冲突
        seed: object-polymorphic-dispatch
        evidence:
          - [Billing.chargeClosed, one-explicit-override-resolves-two-interface-defaults, pers]
      ambiguous-defaults:
        focus: 无覆盖时不靠接口排列顺序消解默认方法冲突
        seed: object-polymorphic-dispatch
        evidence:
          - [Billing.chargeClosed, ambiguous-defaults-cannot-be-resolved-by-interface-order, reject]
      qualified-super:
        focus: 接口名.super 调用选定接口的默认本体而非动态覆盖
        seed: object-polymorphic-dispatch
        evidence:
          - [Billing.chargeClosed, qualified-super-selects-one-of-two-defaults, pers]
          - [Billing.chargeClosed, qualified-super-cannot-select-an-unimplemented-interface, reject]
          - [Billing.chargeClosed, qualified-super-cannot-run-from-a-static-method, reject]
          - [Billing.chargeClosed, qualified-super-can-select-an-inherited-default, pers]
          - [Billing.chargeClosed, qualified-super-cannot-bypass-a-more-specific-direct-parent, reject]
      inherited-through-subinterface:
        focus: 子接口未覆盖时继承父接口的默认本体
        seed: object-polymorphic-dispatch
        evidence:
          - [Billing.chargeClosed, subinterface-inherits-parent-default, pers]
          - [Billing.chargeClosed, diamond-sharing-one-default-is-unambiguous, pers]
      more-specific-interface-default:
        focus: 较具体子接口重新定义默认本体时选择子接口实现
        seed: object-polymorphic-dispatch
        evidence:
          - [Billing.chargeClosed, subinterface-overrides-parent-default, pers]
          - [Billing.chargeClosed, parent-typed-call-still-selects-subinterface-override, pers]
          - [Billing.chargeClosed, unrelated-defaults-conflict-in-the-subinterface, reject]
      abstract-redeclaration-of-default:
        focus: 子接口把继承的默认方法重新声明为抽象方法；实现类须提供实现
        seed: object-polymorphic-dispatch
        evidence:
          - [Billing.chargeClosed, abstract-redeclaration-requires-concrete-implementation, pers]
          - [Billing.chargeClosed, abstract-redeclaration-cannot-fall-back-to-parent-default, reject]
      dispatch-inside-default-body:
        focus: 默认方法中的普通接收者调用仍应动态分派
        seed: object-polymorphic-dispatch
        evidence:
          - [Billing.chargeClosed, default-body-dispatches-a-peer-on-the-original-receiver, pers]
          - [Billing.chargeClosed, default-body-this-keeps-the-virtual-receiver, pers]
  lexical-literals:
    title: 词法与字面量
    leaves:
      unicode-text:
        focus: Unicode 源码转义、转义资格与补充字符
        seed: canonical-text-order
        evidence:
          - [CanonicalLabel.label, unicode-paired-escapes-form-the-supplementary-character, pers]
      character-code:
        focus: 字符单码元、转义和数值提升
        seed: canonical-text-order
        evidence:
          - [CanonicalLabel.charCode, original, pers]
      numeric-lexemes:
        focus: 各种进制、分隔符、指数和后缀
        gap: review
      text-block:
        focus: 文本块缩进、换行和转义
        gap: review
  declarations-and-binding:
    title: 声明、作用域与绑定
    leaves:
      nested-static-class:
        focus: 嵌套类型的入口和封闭名称
        seed: java-invalid-declaration
        evidence:
          - [TicketCode.Nested.readNested, original, pers]
      branch-local-scope:
        focus: 不同块中的局部名称及其作用域
        seed: java-lexical-declaration-scope
        evidence:
          - [LexicalScope.INSTANCE.read, original, pers]
      local-inference:
        focus: 局部 var 推断及初始化要求
        gap: review
      member-access:
        focus: 包名、导入、访问控制、字段隐藏与类型名遮蔽
        gap: review
      compact-compilation-unit:
        focus: 紧凑编译单元的隐式类、成员绑定和入口定位
        gap: review
      annotations-and-modifiers:
        focus: 声明标记、访问性、final 和实际影响业务的修饰符
        gap: review
  type-relationships:
    title: 类型、继承和转换
    leaves:
      text-instanceof-pattern:
        focus: 文本模式绑定和 null；未匹配分支不能读取模式变量
        seed: entry-java-wide-text-pattern
        evidence:
          - [Entry.read, original, pers]
          - [Entry.read, null-does-not-match-the-pattern, pers]
          - [Entry.read, pattern-name-is-not-bound-in-the-unmatched-arm, reject]
      casts-and-other-patterns:
        focus: 强制转换、记录模式、失配、限定和嵌套绑定
        gap: review
      closed-generic-local:
        focus: 源码内泛型类和泛型方法的已绑定参数
        seed: java-invalid-declaration
        evidence:
          - [TicketCode.readValid, a-generic-source-class-retains-its-concrete-bound-constructor-use, pers]
          - [TicketCode.readValid, a-generic-source-method-binds-its-type-parameter-without-changing-the-entry, pers]
      generic-inference-and-variance:
        focus: 边界、通配符、原始类型及泛型推断
        gap: review
      integer-assignment-conversion:
        focus: 窄化只接受可表示的常量；普通较宽变量仍不能隐式窄化
        seed: java-assignment-conversion
        evidence:
          - [AssignmentConversion.read, an-in-range-final-int-constant-can-initialize-a-byte, pers]
          - [AssignmentConversion.read, an-int-parameter-cannot-initialize-a-byte, reject]
      boxing-and-promotion:
        focus: 装箱、拆箱、null 与不同数值运算类型的提升
        gap: review
      reference-shapes:
        focus: 类、记录、枚举、匿名类和封闭继承关系
        gap: review
      constructors-and-initializers:
        focus: 委托构造、超类构造、实例字段和静态初始化时点
        gap: review
      statements-before-constructor-invocation:
        focus: 显式 this(...) 或 Object.super() 前，接收者无关的标量局部计算与异常完成
        seed: basic-return-shape
        evidence:
          - [PairFactory.make, locals-before-this-delegation-are-available-to-the-callee, pers]
          - [PairFactory.make, locals-before-object-super-survive-in-the-constructor, pers]
          - [PairFactory.make, prologue-exception-precedes-constructor-body, pers]
          - [PairFactory.make, preconstruction-receiver-read-is-invalid, reject]
          - [PairFactory.make, constructor-cannot-delegate-twice, reject]
      early-constructor-field-writes-and-parent-arguments:
        focus: 更广义的早期构造字段写入、带参父构造器和复杂控制流
        gap: review
  invocation:
    title: 调用与函数值
    leaves:
      static-and-instance:
        focus: 静态入口、实例接收者和求值顺序
        gap: review
      null-receiver-argument-order:
        focus: 直接实例调用先求实参，再因空接收者异常完成；空值不豁免参数类型
        seed: java-closed-lambda
        evidence:
          - [Quote.run, plain-null-receiver-checks-arguments-first, pers]
          - [Quote.run, plain-null-receiver-does-not-admit-a-boolean-number-argument, reject]
      overload-varargs:
        focus: 重载、可变参数、方法隐藏及调用解析
        gap: review
      method-reference:
        focus: 静态、未绑定接收者的方法引用，以及构造器引用
        gap: review
      bound-method-reference-acquisition:
        focus: 创建绑定方法引用时立即取得并校验接收者，即使后续从不调用
        seed: java-closed-lambda
        gap: implementation
      nested-receivers:
        focus: 内部类接收者、限定 this 和显式父类调用
        gap: review
  expressions:
    title: 普通表达式与赋值
    leaves:
      precedence-and-parentheses:
        focus: 括号与一元符号在当前源码位置的含义
        seed: java-grouping-signed-operand
        evidence:
          - [SignedGrouping.read, original, pers]
      short-circuit-observable:
        focus: 右操作数只在条件命中时调用外部端口
        seed: control-short-circuit
        evidence:
          - [GuardWithProbe.INSTANCE.allowed, original, pers]
      conditional-expression:
        focus: 条件表达式的分支求值、类型合并与实际选择
        gap: review
      assignment-and-updates:
        focus: 赋值表达式、复合赋值、前后自增与地址求值一次
        gap: review
      arithmetic-and-comparison:
        focus: 数值运算、显式位模式、比较和文本连接
        gap: review
  arrays:
    title: 数组创建、读写与身份
    leaves:
      sized-array:
        focus: 指定长度创建、默认值和索引读取
        seed: canonical-constant-array
        evidence:
          - [CanonicalArray.sized, original, pers]
      initializer-and-bounds:
        focus: 数组初始化与索引越界只出现在实际路径
        seed: canonical-constant-array
        evidence:
          - [CanonicalArray.guarded, original, pers]
      multidimensional-and-covariance:
        focus: 多维、协变、运行时存储类型、别名与越界
        gap: review
  branch-and-exit:
    title: 普通分支、块与完成
    leaves:
      early-return:
        focus: 提前返回不执行后续逻辑
        seed: control-early-return
        evidence:
          - [Early.choose, original, pers]
      labelled-transfer:
        focus: 标签语句、跨层 break、continue 及返回目标
        gap: review
      empty-and-assert:
        focus: 空语句及具有实际执行条件的断言
        gap: review
  loops:
    title: 循环与有界控制转移
    leaves:
      counted-for:
        focus: 原生 for 初始化、判断和更新
        seed: loop-constant-bound
        evidence:
          - [SmallLoop.total, original, pers]
      break-and-continue:
        focus: 原生 break 和 continue 对本轮和后续轮的不同影响
        seed: loop-break-continue
        evidence:
          - [BreakContinue.sum, original, pers]
      enhanced-for:
        focus: 数组和可迭代对象的增强 for、取值顺序和终止条件
        gap: review
      while-and-do:
        focus: while 先判断与 do-while 至少执行一次
        gap: review
  exceptions-and-resources:
    title: 异常、清理与资源
    leaves:
      typed-catch-finally:
        focus: catch 处理异常，finally 在两种路径都执行
        seed: control-try-catch-finally
        evidence:
          - [FinallyService.INSTANCE.read, original, pers]
      multi-catch:
        focus: 一个处理器接收多种原有异常，保留实际匹配者
        seed: control-try-catch-finally
        evidence:
          - [FinallyService.INSTANCE.read, native-multi-catch-retains-the-matching-alternative, pers]
          - [FinallyService.INSTANCE.read, reject-overlapping-types-in-one-multi-catch, reject]
      catch-and-finally-order:
        focus: 具体处理器先于宽泛处理器，finally 返回仅覆盖自己的路径
        seed: control-try-catch-finally
        evidence:
          - [FinallyService.INSTANCE.read, legal-specific-handler-before-base-keeps-first-match, pers]
          - [FinallyService.INSTANCE.read, conditional-finally-return-only-overrides-its-domain, pers]
      rethrow:
        focus: 精确重抛及当前异常对象身份，不改成新异常
        gap: review
      single-resource-close:
        focus: 一项原生资源在成功和失败路径都先关闭，再进入 finally
        seed: control-try-catch-finally
        evidence:
          - [FinallyService.INSTANCE.read, native-try-with-resources-closes-before-finally-on-both-paths, pers]
      multiple-resource-close:
        focus: 资源从左到右取得、逆序关闭、主异常与 suppressed 异常
        gap: review
  host-dependent-syntax:
    title: 依赖宿主或环境的语法
    leaves:
      monitor-and-concurrency:
        focus: synchronized 与宿主调度何时改变外部可观察行为
        gap: review
      native-and-linkage:
        focus: native、不可见实现及宿主链接；不可伪造源码或默认值
        gap: review
      module-and-visibility:
        focus: 源码模块和可见性；区分 Java 语法合法与分析依赖闭合
        gap: review
      single-module-import:
        focus: import module 的单模块导入；区分语言绑定与外部依赖闭合
        gap: review
